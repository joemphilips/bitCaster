<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f7931a" />
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#f7931a" />
    </marker>
  </defs>

  <!-- Oracle publishes signed DLC data into the public relay network. -->
  <rect x="280" y="20" width="160" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="360" y="47" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">Oracle</text>
  <text x="360" y="67" text-anchor="middle" fill="#94a3b8" font-size="12">(DLC)</text>

  <path d="M284 132
           C284 113 300 101 320 105
           C329 89 350 84 367 95
           C382 82 409 89 416 108
           C439 107 456 121 456 140
           C456 160 440 172 417 172
           H315
           C294 172 278 158 284 132 Z"
        fill="none" stroke="#f7931a" stroke-width="2" stroke-dasharray="6 5" />
  <text x="370" y="133" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">Nostr Oracle</text>
  <text x="370" y="153" text-anchor="middle" fill="#94a3b8" font-size="12">Network</text>

  <rect x="280" y="205" width="160" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="360" y="232" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">Matching Engine</text>

  <rect x="280" y="335" width="160" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="360" y="362" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">Cashu Mint</text>

  <rect x="35" y="205" width="150" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="110" y="232" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">bitCaster App</text>
  <text x="110" y="252" text-anchor="middle" fill="#94a3b8" font-size="12">(PWA)</text>

  <rect x="535" y="205" width="150" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="610" y="232" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">bitCaster App</text>
  <text x="610" y="252" text-anchor="middle" fill="#94a3b8" font-size="12">(PWA)</text>

  <!-- Oracle -> Nostr oracle network -->
  <line x1="360" y1="80" x2="360" y2="104"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370" y="96" fill="#94a3b8" font-size="11" font-style="italic">announce / attest</text>

  <!-- Matching Engine reads the signed oracle data from the Nostr network. -->
  <line x1="360" y1="172" x2="360" y2="205"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370" y="195" fill="#94a3b8" font-size="11" font-style="italic">fetch + verify</text>

  <!-- Matching Engine coordinates settlement with the mint after verification. -->
  <line x1="360" y1="265" x2="360" y2="335"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Apps talk to the sequencer for order-book access. -->
  <line x1="185" y1="235" x2="280" y2="235"
        stroke="#f7931a" stroke-width="2"
        marker-start="url(#arrow-start)" marker-end="url(#arrow)" />
  <line x1="440" y1="235" x2="535" y2="235"
        stroke="#f7931a" stroke-width="2"
        marker-start="url(#arrow-start)" marker-end="url(#arrow)" />

  <!-- Apps talk directly to the mint for token operations. -->
  <line x1="110" y1="265" x2="110" y2="365"
        stroke="#f7931a" stroke-width="2" />
  <line x1="110" y1="365" x2="280" y2="365"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="610" y1="265" x2="610" y2="365"
        stroke="#f7931a" stroke-width="2" />
  <line x1="610" y1="365" x2="440" y2="365"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />
</svg>
