<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="Inter, sans-serif">
  <defs>
    <!-- Single-headed arrowhead (orange) -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f7931a" />
    </marker>
    <!-- Double-headed: left arrowhead -->
    <marker id="arrow-start" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#f7931a" />
    </marker>
  </defs>

  <!-- ===== Boxes ===== -->
  <!-- Oracle (DLC) — row 1, center -->
  <rect x="230" y="20" width="160" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="310" y="47" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">Oracle</text>
  <text x="310" y="67" text-anchor="middle" fill="#94a3b8" font-size="12">(DLC)</text>

  <!-- bitCaster App (PWA) — row 2, left -->
  <rect x="20" y="170" width="150" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="95" y="197" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">bitCaster App</text>
  <text x="95" y="217" text-anchor="middle" fill="#94a3b8" font-size="12">(PWA)</text>

  <!-- Cashu Mint — row 2, center -->
  <rect x="230" y="170" width="160" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="310" y="197" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">Cashu Mint</text>

  <!-- bitCaster App (PWA) — row 2, right -->
  <rect x="450" y="170" width="150" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="525" y="197" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">bitCaster App</text>
  <text x="525" y="217" text-anchor="middle" fill="#94a3b8" font-size="12">(PWA)</text>

  <!-- Matching Engine — row 3, center -->
  <rect x="230" y="310" width="160" height="60" rx="8" ry="8"
        fill="none" stroke="#f7931a" stroke-width="2" />
  <text x="310" y="337" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600">Matching Engine</text>

  <!-- ===== Connections ===== -->
  <!-- Oracle -> Cashu Mint (vertical) -->
  <line x1="310" y1="80" x2="310" y2="170"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Label: Nostr Protocol -->
  <text x="318" y="130" fill="#94a3b8" font-size="11" font-style="italic">Nostr Protocol</text>

  <!-- Left App <-> Cashu Mint -->
  <line x1="170" y1="200" x2="230" y2="200"
        stroke="#f7931a" stroke-width="2"
        marker-start="url(#arrow-start)" marker-end="url(#arrow)" />

  <!-- Right App <-> Cashu Mint -->
  <line x1="390" y1="200" x2="450" y2="200"
        stroke="#f7931a" stroke-width="2"
        marker-start="url(#arrow-start)" marker-end="url(#arrow)" />

  <!-- Left App -> Matching Engine -->
  <line x1="95" y1="230" x2="95" y2="340"
        stroke="#f7931a" stroke-width="2" stroke-dasharray="none" />
  <line x1="95" y1="340" x2="230" y2="340"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Right App -> Matching Engine -->
  <line x1="525" y1="230" x2="525" y2="340"
        stroke="#f7931a" stroke-width="2" />
  <line x1="525" y1="340" x2="390" y2="340"
        stroke="#f7931a" stroke-width="2" marker-end="url(#arrow)" />
</svg>
