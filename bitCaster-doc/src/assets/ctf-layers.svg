<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, sans-serif">
  <!-- ===== Dashed ground line (suggests the stack) ===== -->
  <line x1="40" y1="430" x2="860" y2="430"
        stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5" opacity="0.5" />

  <!-- ===== Layer 1 — Bitcoin ===== -->
  <rect x="40" y="40" width="160" height="380" rx="12" ry="12"
        fill="#f7931a" fill-opacity="0.03" stroke="#f7931a" stroke-width="2" />

  <rect x="60" y="60" width="60" height="22" rx="11" ry="11"
        fill="#f7931a" fill-opacity="0.12" stroke="#f7931a" stroke-width="1" />
  <text x="90" y="75" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" letter-spacing="1">LAYER 1</text>

  <text x="120" y="120" text-anchor="middle" fill="#94a3b8" font-size="19" font-weight="700">Bitcoin</text>
  <text x="120" y="148" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" font-style="italic">Trustless · Slow</text>

  <line x1="70" y1="170" x2="170" y2="170" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

  <text x="120" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">Base money.</text>
  <text x="120" y="223" text-anchor="middle" fill="#94a3b8" font-size="11">Censorship-</text>
  <text x="120" y="241" text-anchor="middle" fill="#94a3b8" font-size="11">resistant, but</text>
  <text x="120" y="259" text-anchor="middle" fill="#94a3b8" font-size="11">on-chain fees</text>
  <text x="120" y="277" text-anchor="middle" fill="#94a3b8" font-size="11">and block</text>
  <text x="120" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">confirmations</text>
  <text x="120" y="313" text-anchor="middle" fill="#94a3b8" font-size="11">make it unfit</text>
  <text x="120" y="331" text-anchor="middle" fill="#94a3b8" font-size="11">for trading.</text>

  <text x="120" y="395" text-anchor="middle" fill="#f7931a" font-size="26" font-weight="600" font-family="JetBrains Mono, monospace">₿</text>

  <!-- ===== Layer 2 — Lightning Network ===== -->
  <rect x="260" y="40" width="160" height="380" rx="12" ry="12"
        fill="#f7931a" fill-opacity="0.05" stroke="#f7931a" stroke-width="2.25" />

  <rect x="280" y="60" width="60" height="22" rx="11" ry="11"
        fill="#f7931a" fill-opacity="0.16" stroke="#f7931a" stroke-width="1" />
  <text x="310" y="75" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" letter-spacing="1">LAYER 2</text>

  <text x="340" y="120" text-anchor="middle" fill="#94a3b8" font-size="19" font-weight="700">Lightning</text>
  <text x="340" y="148" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" font-style="italic">Trustless · Online only</text>

  <line x1="290" y1="170" x2="390" y2="170" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

  <text x="340" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">Trustless</text>
  <text x="340" y="223" text-anchor="middle" fill="#94a3b8" font-size="11">scaling over</text>
  <text x="340" y="241" text-anchor="middle" fill="#94a3b8" font-size="11">Bitcoin. Fast</text>
  <text x="340" y="259" text-anchor="middle" fill="#94a3b8" font-size="11">and cheap, but</text>
  <text x="340" y="277" text-anchor="middle" fill="#94a3b8" font-size="11">requires online</text>
  <text x="340" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">nodes and</text>
  <text x="340" y="313" text-anchor="middle" fill="#94a3b8" font-size="11">channel-liquidity</text>
  <text x="340" y="331" text-anchor="middle" fill="#94a3b8" font-size="11">management.</text>

  <text x="340" y="395" text-anchor="middle" fill="#f7931a" font-size="26" font-weight="600" font-family="JetBrains Mono, monospace">⚡</text>

  <!-- ===== Layer 3 — Cashu Native ===== -->
  <rect x="480" y="40" width="160" height="380" rx="12" ry="12"
        fill="#f7931a" fill-opacity="0.08" stroke="#f7931a" stroke-width="2.5" />

  <rect x="500" y="60" width="60" height="22" rx="11" ry="11"
        fill="#f7931a" fill-opacity="0.2" stroke="#f7931a" stroke-width="1" />
  <text x="530" y="75" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" letter-spacing="1">LAYER 3</text>

  <text x="560" y="120" text-anchor="middle" fill="#94a3b8" font-size="19" font-weight="700">Cashu Native</text>
  <text x="560" y="148" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" font-style="italic">Trustful · Liquid</text>

  <line x1="510" y1="170" x2="610" y2="170" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

  <text x="560" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">Ecash wrapping</text>
  <text x="560" y="223" text-anchor="middle" fill="#94a3b8" font-size="11">a reserve asset</text>
  <text x="560" y="241" text-anchor="middle" fill="#94a3b8" font-size="11">(BTC, stables,</text>
  <text x="560" y="259" text-anchor="middle" fill="#94a3b8" font-size="11">WBTC). Custodial</text>
  <text x="560" y="277" text-anchor="middle" fill="#94a3b8" font-size="11">vs. the mint,</text>
  <text x="560" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">but instant,</text>
  <text x="560" y="313" text-anchor="middle" fill="#94a3b8" font-size="11">private and</text>
  <text x="560" y="331" text-anchor="middle" fill="#94a3b8" font-size="11">fee-less.</text>

  <text x="560" y="395" text-anchor="middle" fill="#f7931a" font-size="22" font-weight="600" font-family="JetBrains Mono, monospace">◈</text>

  <!-- ===== Layer 4 — Cashu Conditional Tokens ===== -->
  <rect x="700" y="40" width="160" height="380" rx="12" ry="12"
        fill="#f7931a" fill-opacity="0.1" stroke="#f7931a" stroke-width="3" />

  <rect x="720" y="60" width="60" height="22" rx="11" ry="11"
        fill="#f7931a" fill-opacity="0.25" stroke="#f7931a" stroke-width="1" />
  <text x="750" y="75" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" letter-spacing="1">LAYER 4</text>

  <text x="780" y="120" text-anchor="middle" fill="#94a3b8" font-size="19" font-weight="700">Cashu-CTF</text>
  <text x="780" y="148" text-anchor="middle" fill="#f7931a" font-size="11" font-weight="600" font-style="italic">Market position</text>

  <line x1="730" y1="170" x2="830" y2="170" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

  <text x="780" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">A position in</text>
  <text x="780" y="223" text-anchor="middle" fill="#94a3b8" font-size="11">a prediction</text>
  <text x="780" y="241" text-anchor="middle" fill="#94a3b8" font-size="11">market — a</text>
  <text x="780" y="259" text-anchor="middle" fill="#94a3b8" font-size="11">"security token".</text>
  <text x="780" y="277" text-anchor="middle" fill="#94a3b8" font-size="11">Spendable only</text>
  <text x="780" y="295" text-anchor="middle" fill="#94a3b8" font-size="11">when a DLC</text>
  <text x="780" y="313" text-anchor="middle" fill="#94a3b8" font-size="11">oracle attests</text>
  <text x="780" y="331" text-anchor="middle" fill="#94a3b8" font-size="11">the outcome.</text>

  <text x="780" y="395" text-anchor="middle" fill="#f7931a" font-size="22" font-weight="600" font-family="JetBrains Mono, monospace">✦</text>

  <!-- ===== Conversion arrows (double-headed, path-drawn) ===== -->
  <!-- L1 <-> L2 -->
  <g fill="#f7931a" stroke="none">
    <path d="M206,232 L218,225 L218,239 Z" />
    <path d="M254,232 L242,225 L242,239 Z" />
  </g>
  <line x1="216" y1="232" x2="244" y2="232" stroke="#f7931a" stroke-width="2.5" stroke-linecap="butt" />
  <text x="230" y="217" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">channel</text>
  <text x="230" y="257" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">open / close</text>

  <!-- L2 <-> L3 -->
  <g fill="#f7931a" stroke="none">
    <path d="M426,232 L438,225 L438,239 Z" />
    <path d="M474,232 L462,225 L462,239 Z" />
  </g>
  <line x1="436" y1="232" x2="464" y2="232" stroke="#f7931a" stroke-width="2.5" stroke-linecap="butt" />
  <text x="450" y="217" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Cashu</text>
  <text x="450" y="257" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">mint / melt</text>

  <!-- L3 <-> L4 -->
  <g fill="#f7931a" stroke="none">
    <path d="M646,232 L658,225 L658,239 Z" />
    <path d="M694,232 L682,225 L682,239 Z" />
  </g>
  <line x1="656" y1="232" x2="684" y2="232" stroke="#f7931a" stroke-width="2.5" stroke-linecap="butt" />
  <text x="670" y="217" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">NUT-CTF</text>
  <text x="670" y="257" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">split / merge</text>
</svg>
