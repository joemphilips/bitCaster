server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest MIME type (not in nginx defaults)
    types {
        application/manifest+json webmanifest;
    }

    # Service worker — must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Manifest — should revalidate
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Use Docker's embedded DNS so nginx can start before upstreams are ready
    resolver 127.0.0.11 valid=10s;

    # Proxy mint API
    location /v1/ {
        set $mint_upstream http://mintd:8085;
        proxy_pass $mint_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy server REST API
    location /api/ {
        set $server_upstream http://server:5000;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy SignalR hub with WebSocket upgrade
    location /hubs/ {
        set $server_upstream_ws http://server:5000;
        proxy_pass $server_upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
