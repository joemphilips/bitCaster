asyncapi: 3.0.0
info:
  title: BitCaster SignalR Hubs
  description: SignalR hubs for real-time market and trade updates.
  version: 0.1.0
  license:
    name: MIT

servers:
  development:
    host: localhost:5000
    pathname: /hubs/market
    protocol: signalr
    description: Local development MarketHub SignalR hub
  developmentTrade:
    host: localhost:5000
    pathname: /hubs/trade
    protocol: signalr
    description: Local development TradeHub SignalR hub

channels:
  joinMarket:
    address: JoinMarket
    messages:
      joinMarketRequest:
        $ref: '#/components/messages/JoinMarketRequest'
    description: Client joins a market group to receive order book updates.

  leaveMarket:
    address: LeaveMarket
    messages:
      leaveMarketRequest:
        $ref: '#/components/messages/LeaveMarketRequest'
    description: Client leaves a market group.

  orderBookUpdated:
    address: OrderBookUpdated
    messages:
      orderBookUpdatedMessage:
        $ref: '#/components/messages/OrderBookUpdatedMessage'
    description: Server pushes an updated order book snapshot to the market group.

  orderAccepted:
    address: OrderAccepted
    messages:
      orderAcceptedMessage:
        $ref: '#/components/messages/OrderAcceptedMessage'
    description: Server pushes a public accepted-order delta to the market group.

  orderCancelled:
    address: OrderCancelled
    messages:
      orderCancelledMessage:
        $ref: '#/components/messages/OrderCancelledMessage'
    description: Server pushes a public cancellation delta to the market group.

  matched:
    address: Matched
    messages:
      matchedMessage:
        $ref: '#/components/messages/MatchedMessage'
    description: Server pushes a public match delta to affected market groups.

  marketStatusChanged:
    address: MarketStatusChanged
    messages:
      marketStatusChangedMessage:
        $ref: '#/components/messages/MarketStatusChangedMessage'
    description: >
      Server pushes a lifecycle-change notification (e.g. open -> closed) to
      every per-outcome market group of a condition.

  tradeCreated:
    address: TradeCreated
    messages:
      tradeCreatedMessage:
        $ref: '#/components/messages/TradeCreatedMessage'
    description: >
      Server pushes the initial atomic-swap trade payload to both parties.
      SignalR JSON clients receive this as an ordered argument list.

  swapMessageReceived:
    address: SwapMessageReceived
    messages:
      swapMessageReceivedMessage:
        $ref: '#/components/messages/SwapMessageReceivedMessage'
    description: Server relays an opaque encrypted swap-protocol message.

  tradeStateChanged:
    address: TradeStateChanged
    messages:
      tradeStateChangedMessage:
        $ref: '#/components/messages/TradeStateChangedMessage'
    description: Server pushes an atomic-swap trade state transition.

operations:
  joinMarket:
    action: send
    channel:
      $ref: '#/channels/joinMarket'
    summary: Join a market group
    description: >
      Client invokes JoinMarket with a marketId. The server adds the connection
      to the market's SignalR group and immediately replies with the current
      OrderBookSnapshot via the OrderBookUpdated channel.
    messages:
      - $ref: '#/channels/joinMarket/messages/joinMarketRequest'

  leaveMarket:
    action: send
    channel:
      $ref: '#/channels/leaveMarket'
    summary: Leave a market group
    description: Client invokes LeaveMarket to stop receiving updates for a market.
    messages:
      - $ref: '#/channels/leaveMarket/messages/leaveMarketRequest'

  orderBookUpdated:
    action: receive
    channel:
      $ref: '#/channels/orderBookUpdated'
    summary: Receive order book update
    description: >
      Server pushes an OrderBookSnapshot to all clients in the market group
      whenever the order book changes (new order, cancellation, fill).
    messages:
      - $ref: '#/channels/orderBookUpdated/messages/orderBookUpdatedMessage'

  orderAccepted:
    action: receive
    channel:
      $ref: '#/channels/orderAccepted'
    summary: Receive accepted-order delta
    messages:
      - $ref: '#/channels/orderAccepted/messages/orderAcceptedMessage'

  orderCancelled:
    action: receive
    channel:
      $ref: '#/channels/orderCancelled'
    summary: Receive cancellation delta
    messages:
      - $ref: '#/channels/orderCancelled/messages/orderCancelledMessage'

  matched:
    action: receive
    channel:
      $ref: '#/channels/matched'
    summary: Receive match delta
    messages:
      - $ref: '#/channels/matched/messages/matchedMessage'

  marketStatusChanged:
    action: receive
    channel:
      $ref: '#/channels/marketStatusChanged'
    summary: Receive market lifecycle change
    description: >
      Server pushes a MarketStatusChanged to clients in any of the
      condition's per-outcome market groups when the market's lifecycle
      state changes (e.g. when an oracle attestation or deadline closes it).
      A client joined to any one outcome group of the condition receives it.
    messages:
      - $ref: '#/channels/marketStatusChanged/messages/marketStatusChangedMessage'

  tradeCreated:
    action: receive
    channel:
      $ref: '#/channels/tradeCreated'
    summary: Receive trade creation payload
    description: >
      Server pushes the positional TradeCreated payload after an order fill
      creates an atomic-swap trade.
    messages:
      - $ref: '#/channels/tradeCreated/messages/tradeCreatedMessage'

  swapMessageReceived:
    action: receive
    channel:
      $ref: '#/channels/swapMessageReceived'
    summary: Receive encrypted swap message
    messages:
      - $ref: '#/channels/swapMessageReceived/messages/swapMessageReceivedMessage'

  tradeStateChanged:
    action: receive
    channel:
      $ref: '#/channels/tradeStateChanged'
    summary: Receive trade state change
    messages:
      - $ref: '#/channels/tradeStateChanged/messages/tradeStateChangedMessage'

components:
  messages:
    JoinMarketRequest:
      payload:
        type: object
        required:
          - marketId
        properties:
          marketId:
            type: string
            description: >
              The primitive market ID in the format "{conditionId}-{outcomeName}".

    LeaveMarketRequest:
      payload:
        type: object
        required:
          - marketId
        properties:
          marketId:
            type: string
            description: >
              The primitive market ID in the format "{conditionId}-{outcomeName}".

    OrderBookUpdatedMessage:
      payload:
        $ref: '#/components/schemas/OrderBookSnapshot'

    OrderAcceptedMessage:
      payload:
        $ref: '#/components/schemas/OrderAcceptedDelta'

    OrderCancelledMessage:
      payload:
        $ref: '#/components/schemas/OrderCancelledDelta'

    MatchedMessage:
      payload:
        $ref: '#/components/schemas/MatchedDelta'

    MarketStatusChangedMessage:
      payload:
        $ref: '#/components/schemas/MarketStatusChanged'

    TradeCreatedMessage:
      payload:
        $ref: '#/components/schemas/TradeCreatedArguments'

    SwapMessageReceivedMessage:
      payload:
        $ref: '#/components/schemas/SwapMessageReceivedArguments'

    TradeStateChangedMessage:
      payload:
        $ref: '#/components/schemas/TradeStateChangedArguments'

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    CollateralSubunits:
      type: integer
      format: int64
      minimum: 1
      description: >
        Collateral subunits — msat (1/1000 sat) for sat-denominated markets,
        cents for USD-denominated markets. Wire amount = collateral subunits
        per ADR-025.

    Probability:
      type: integer
      minimum: 1
      description: >
        Market price numerator `k`. Valid range is `1 <= k <= D - 1`, where
        `D` is the market's immutable `divisibility`. Immutable price
        denominator D is per-market: sat markets use D=10000 (0.01%
        precision), USD markets use D=1000 (0.1% precision), numeric sat
        markets use D=1000000 (0.0001% precision).

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell

    MatchPath:
      type: string
      enum:
        - Complementary
        - Mint

    BaseAsset:
      type: string
      enum:
        - sat
        - usd
        - jpy
      description: >
        Market quote/collateral base asset. `sat` and `usd` are accepted for
        market registration. Collateral is held in msat for `sat` markets and
        cents (`usd`) for `usd` markets. `jpy` is reserved.

    TokenSide:
      type: string
      enum:
        - Outcome
        - Complement
      description: >
        Which token on the primitive outcome book is being traded. `Outcome`
        means the selected primitive outcome named by outcomeId; `Complement`
        means the one-vs-rest complement of that outcome.

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/CollateralSubunits'

    OrderBookSnapshot:
      type: object
      description: >
        Order book snapshot for market-detail rendering. When `depthLimit` is
        present, `bids` and `asks` contain at most that many top executable
        price levels per side; clients must not treat the snapshot as full
        depth.
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The primitive market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          type:
            - integer
            - 'null'
          description: Difference between best ask and best bid. Null if either side is empty.
        depthLimit:
          type:
            - integer
            - 'null'
          minimum: 1
          description: >
            Maximum number of top price levels included per side. Null or absent
            means the producer did not declare whether the snapshot is bounded.

    OrderAcceptedDelta:
      type: object
      required:
        - marketId
        - orderId
        - outcomeId
        - side
        - price
        - remainingAmountSubunits
      properties:
        marketId:
          type: string
        orderId:
          type: string
          format: uuid
        outcomeId:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'

    OrderCancelledDelta:
      type: object
      required:
        - marketId
        - orderId
      properties:
        marketId:
          type: string
        orderId:
          type: string
          format: uuid

    MatchedDelta:
      type: object
      description: >
        Public match delta broadcast to affected market groups. Canonical
        settlement amounts are additive and nullable; consumers should prefer
        `quotePaymentSubunits`, `outcomeFaceAmountSubunits`, `baseAsset`,
        `divisibility`, and `tokenSide` when present.
      required:
        - marketId
        - tradeId
        - makerOrderId
        - takerOrderId
        - executionPrice
        - amountSubunits
        - path
        - matchedAt
      properties:
        marketId:
          type: string
        tradeId:
          type: string
          format: uuid
        makerOrderId:
          type: string
          format: uuid
        takerOrderId:
          type: string
          format: uuid
        executionPrice:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        path:
          $ref: '#/components/schemas/MatchPath'
        matchedAt:
          type: string
          format: date-time
        baseAsset:
          oneOf:
            - $ref: '#/components/schemas/BaseAsset'
            - type: 'null'
          description: >
            Base asset for the canonical settlement amount. Null or omitted
            for legacy sat/100 rows.
        divisibility:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 2
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).
        quotePaymentSubunits:
          type:
            - integer
            - 'null'
          format: int64
          description: >
            Engine-computed quote payment in the market base-asset sub-unit.
            Authoritative when `baseAsset` and `divisibility` are also present.
        outcomeFaceAmountSubunits:
          type:
            - integer
            - 'null'
          format: int64
          description: >
            Engine-computed conditional-token face amount in the market
            base-asset sub-unit.
        tokenSide:
          oneOf:
            - $ref: '#/components/schemas/TokenSide'
            - type: 'null'
          description: >
            Which token on the primitive outcome book was traded. Null or
            omitted for legacy rows.

    MarketStatusChanged:
      type: object
      required:
        - conditionId
        - state
      properties:
        conditionId:
          type: string
          description: The condition identifier whose lifecycle changed.
        state:
          type: string
          enum: [open, closed]
          description: >
            New engine-side lifecycle state. `open` accepts new orders;
            `closed` does not.
        closedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Engine-side close timestamp. Null unless state is `closed`.
        finalOutcome:
          type:
            - string
            - 'null'
          description: >
            Winning outcome after an oracle attestation close. Null for
            deadline-only closes or non-resolving transitions.

    TradeCreatedArguments:
      type: array
      description: >
        Positional SignalR arguments for ITradeHubClient.TradeCreated. The
        nullable tail fields are additive compatibility fields. The
        authoritative canonical settlement amount is
        `quotePaymentSubunits + baseAsset + divisibility`; consumers should
        prefer `quotePaymentSubunits` and `outcomeFaceAmountSubunits` when
        present.
      minItems: 15
      maxItems: 15
      prefixItems:
        - type: string
          format: uuid
          description: tradeId
        - type: string
          description: sellerPubkey
        - type: string
          description: buyerPubkey
        - type: string
          format: date-time
          description: sellerLocktime
        - type: string
          format: date-time
          description: buyerLocktime
        - type: string
          description: marketId
        - type: integer
          format: int64
          description: fillAmountSubunits
        - type:
            - integer
            - 'null'
          format: int64
          description: outcomeFaceAmountSubunits
        - type:
            - integer
            - 'null'
          format: int64
          description: quotePaymentSubunits
        - type:
            - string
            - 'null'
          description: settlementKind
        - type:
            - string
            - 'null'
          description: sellerKeepOutcomeSetId
        - type:
            - string
            - 'null'
          description: sellerLockOutcomeSetId
        - oneOf:
            - $ref: '#/components/schemas/BaseAsset'
            - type: 'null'
          description: baseAsset
        - type:
            - integer
            - 'null'
          format: int32
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).
        - oneOf:
            - $ref: '#/components/schemas/TokenSide'
            - type: 'null'
          description: tokenSide

    SwapMessageReceivedArguments:
      type: array
      minItems: 3
      maxItems: 3
      prefixItems:
        - type: string
          format: uuid
          description: tradeId
        - type: string
          description: messageType
        - type: string
          description: ciphertext

    TradeStateChangedArguments:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: string
          format: uuid
          description: tradeId
        - type: string
          description: newState
