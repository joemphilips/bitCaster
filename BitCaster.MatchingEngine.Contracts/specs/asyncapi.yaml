asyncapi: 3.0.0
info:
  title: BitCaster SignalR Hubs
  description: SignalR hubs for real-time market and order updates.
  version: 0.1.0
  license:
    name: MIT

servers:
  development:
    host: localhost:5000
    pathname: /hubs/market
    protocol: signalr
    description: Local development MarketHub SignalR hub
  developmentOrder:
    host: localhost:5000
    pathname: /hubs/order
    protocol: signalr
    description: Local development OrderHub SignalR hub

channels:
  joinMarket:
    address: JoinMarket
    messages:
      joinMarketRequest:
        $ref: '#/components/messages/JoinMarketRequest'
    description: Client joins a market group to receive order book updates.

  leaveMarket:
    address: LeaveMarket
    messages:
      leaveMarketRequest:
        $ref: '#/components/messages/LeaveMarketRequest'
    description: Client leaves a market group.

  orderBookUpdated:
    address: OrderBookUpdated
    messages:
      orderBookUpdatedMessage:
        $ref: '#/components/messages/OrderBookUpdatedMessage'
    description: Server pushes an updated order book snapshot to the market group.

  orderAccepted:
    address: OrderAccepted
    messages:
      orderAcceptedMessage:
        $ref: '#/components/messages/OrderAcceptedMessage'
    description: Server pushes a public accepted-order delta to the market group.

  orderCancelled:
    address: OrderCancelled
    messages:
      orderCancelledMessage:
        $ref: '#/components/messages/OrderCancelledMessage'
    description: Server pushes a public cancellation delta to the market group.

  matched:
    address: Matched
    messages:
      matchedMessage:
        $ref: '#/components/messages/MatchedMessage'
    description: Server pushes a public match delta to affected market groups.

  confirmedTradeRecorded:
    address: ConfirmedTradeRecorded
    messages:
      confirmedTradeRecordedMessage:
        $ref: '#/components/messages/ConfirmedTradeRecordedMessage'
    description: >
      Server pushes a committed confirmed-trade price delta to the market
      groups for the condition. The REST market catalogue remains authoritative
      when a client reconnects or misses a live delta.

  marketStatusChanged:
    address: MarketStatusChanged
    messages:
      marketStatusChangedMessage:
        $ref: '#/components/messages/MarketStatusChangedMessage'
    description: >
      Server pushes a lifecycle-change notification (e.g. open -> closed) to
      every per-outcome market group of a condition.

  joinOrder:
    address: JoinOrder
    messages:
      joinOrderRequest:
        $ref: '#/components/messages/JoinOrderRequest'
    description: Client joins authenticated updates for one owned order.

  orderLifecycleChanged:
    address: OrderLifecycleChanged
    messages:
      orderLifecycleChangedMessage:
        $ref: '#/components/messages/OrderLifecycleChangedMessage'
    description: >
      Server pushes an owner-filtered, capability-secret-free order lifecycle
      update over the authenticated order hub.

  settlementGroupStateChanged:
    address: SettlementGroupStateChanged
    messages:
      settlementGroupStateChangedMessage:
        $ref: '#/components/messages/SettlementGroupStateChangedMessage'
    description: >
      Server pushes an owner-filtered settlement-group transition for one
      affected order. No capability artifact or bearer proof material is
      included.

operations:
  joinMarket:
    action: send
    channel:
      $ref: '#/channels/joinMarket'
    summary: Join a market group
    description: >
      Client invokes JoinMarket with a marketId. The server adds the connection
      to the market's SignalR group and immediately replies with the current
      OrderBookSnapshot via the OrderBookUpdated channel.
    messages:
      - $ref: '#/channels/joinMarket/messages/joinMarketRequest'

  leaveMarket:
    action: send
    channel:
      $ref: '#/channels/leaveMarket'
    summary: Leave a market group
    description: Client invokes LeaveMarket to stop receiving updates for a market.
    messages:
      - $ref: '#/channels/leaveMarket/messages/leaveMarketRequest'

  orderBookUpdated:
    action: receive
    channel:
      $ref: '#/channels/orderBookUpdated'
    summary: Receive order book update
    description: >
      Server pushes an OrderBookSnapshot to all clients in the market group
      whenever the order book changes (new order, cancellation, fill).
    messages:
      - $ref: '#/channels/orderBookUpdated/messages/orderBookUpdatedMessage'

  orderAccepted:
    action: receive
    channel:
      $ref: '#/channels/orderAccepted'
    summary: Receive accepted-order delta
    messages:
      - $ref: '#/channels/orderAccepted/messages/orderAcceptedMessage'

  orderCancelled:
    action: receive
    channel:
      $ref: '#/channels/orderCancelled'
    summary: Receive cancellation delta
    messages:
      - $ref: '#/channels/orderCancelled/messages/orderCancelledMessage'

  matched:
    action: receive
    channel:
      $ref: '#/channels/matched'
    summary: Receive match delta
    messages:
      - $ref: '#/channels/matched/messages/matchedMessage'

  confirmedTradeRecorded:
    action: receive
    channel:
      $ref: '#/channels/confirmedTradeRecorded'
    summary: Receive committed confirmed-trade price delta
    description: >
      Server pushes a confirmed trade only after its settlement is committed.
      The message contains one bounded latest-trade value. Clients must reload
      the REST market catalogue after reconnect or an explicit refresh.
    messages:
      - $ref: '#/channels/confirmedTradeRecorded/messages/confirmedTradeRecordedMessage'

  marketStatusChanged:
    action: receive
    channel:
      $ref: '#/channels/marketStatusChanged'
    summary: Receive market lifecycle change
    description: >
      Server pushes a MarketStatusChanged to clients in any of the
      condition's per-outcome market groups when the market's lifecycle
      state changes (e.g. when an oracle attestation or deadline closes it).
      A client joined to any one outcome group of the condition receives it.
    messages:
      - $ref: '#/channels/marketStatusChanged/messages/marketStatusChangedMessage'

  joinOrder:
    action: send
    channel:
      $ref: '#/channels/joinOrder'
    summary: Join authenticated order updates
    description: >
      Client invokes JoinOrder with a marketId and an owned orderId. The
      server adds the connection to the order's authenticated group.
    messages:
      - $ref: '#/channels/joinOrder/messages/joinOrderRequest'

  orderLifecycleChanged:
    action: receive
    channel:
      $ref: '#/channels/orderLifecycleChanged'
    summary: Receive an owned order lifecycle update
    messages:
      - $ref: '#/channels/orderLifecycleChanged/messages/orderLifecycleChangedMessage'

  settlementGroupStateChanged:
    action: receive
    channel:
      $ref: '#/channels/settlementGroupStateChanged'
    summary: Receive an owned settlement-group lifecycle update
    messages:
      - $ref: '#/channels/settlementGroupStateChanged/messages/settlementGroupStateChangedMessage'

components:
  messages:
    JoinMarketRequest:
      payload:
        type: object
        required:
          - marketId
        properties:
          marketId:
            type: string
            description: >
              The primitive market ID in the format "{conditionId}-{outcomeName}".

    LeaveMarketRequest:
      payload:
        type: object
        required:
          - marketId
        properties:
          marketId:
            type: string
            description: >
              The primitive market ID in the format "{conditionId}-{outcomeName}".

    OrderBookUpdatedMessage:
      payload:
        $ref: '#/components/schemas/OrderBookSnapshot'

    OrderAcceptedMessage:
      payload:
        $ref: '#/components/schemas/OrderAcceptedDelta'

    OrderCancelledMessage:
      payload:
        $ref: '#/components/schemas/OrderCancelledDelta'

    MatchedMessage:
      payload:
        $ref: '#/components/schemas/MatchedDelta'

    ConfirmedTradeRecordedMessage:
      payload:
        type: object
        additionalProperties: false
        required:
          - conditionId
          - latestConfirmedTrade
        properties:
          conditionId:
            type: string
          latestConfirmedTrade:
            $ref: '#/components/schemas/LatestConfirmedTrade'

    MarketStatusChangedMessage:
      payload:
        $ref: '#/components/schemas/MarketStatusChanged'

    JoinOrderRequest:
      payload:
        type: array
        minItems: 2
        maxItems: 2
        prefixItems:
          - type: string
            description: The market identifier that owns the order.
          - type: string
            format: uuid
            description: The owned order identifier.

    OrderLifecycleChangedMessage:
      payload:
        $ref: '#/components/schemas/OrderLifecycleChangedDelta'

    SettlementGroupStateChangedMessage:
      payload:
        $ref: '#/components/schemas/SettlementGroupStateChangedDelta'

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    CollateralSubunits:
      type: integer
      format: int64
      minimum: 1
      description: >
        Product collateral subunits in msat (1/1000 sat). Wire amount =
        collateral subunits.

    Probability:
      type: integer
      minimum: 1
      description: >
        Market price numerator `k`. Valid range is `1 <= k <= D - 1`, where
        `D` is the market's immutable `divisibility`. Immutable price
        denominator D is per-market. Current yes/no and categorical markets
        use D=1000 (0.1% precision). Numeric market creation and trading are
        currently disabled; D=1000000 (0.0001% precision) is reserved for a
        future numeric trade representation.

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell

    MatchPath:
      type: string
      enum:
        - Complementary
        - Mint

    BaseAsset:
      type: string
      enum:
        - sat
      description: >
        Product quote asset. The current product accepts only exact `sat`;
        product collateral is held in `msat`.

    TokenSide:
      type: string
      enum:
        - Outcome
        - Complement
      description: >
        Which token on the primitive outcome book is being traded. `Outcome`
        means the selected primitive outcome named by outcomeId; `Complement`
        means the one-vs-rest complement of that outcome.

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/CollateralSubunits'

    OrderBookSnapshot:
      type: object
      description: >
        Order book snapshot for market-detail rendering. When `depthLimit` is
        present, `bids` and `asks` contain at most that many top executable
        price levels per side; clients must not treat the snapshot as full
        depth.
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The primitive market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          type:
            - integer
            - 'null'
          description: Difference between best ask and best bid. Null if either side is empty.
        depthLimit:
          type:
            - integer
            - 'null'
          minimum: 1
          description: >
            Maximum number of top price levels included per side. Null or absent
            means the producer did not declare whether the snapshot is bounded.

    OrderAcceptedDelta:
      type: object
      required:
        - marketId
        - orderId
        - outcomeId
        - side
        - price
        - remainingAmountSubunits
      properties:
        marketId:
          type: string
        orderId:
          type: string
          format: uuid
        outcomeId:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'

    OrderCancelledDelta:
      type: object
      required:
        - marketId
        - orderId
      properties:
        marketId:
          type: string
        orderId:
          type: string
          format: uuid

    MatchedDelta:
      type: object
      description: >
        Public match delta broadcast to affected market groups. Canonical
        settlement amounts are required; consumers must use
        `quotePaymentSubunits`, `outcomeFaceAmountSubunits`, `baseAsset`,
        `collateralUnit`, `divisibility`, and `tokenSide`.
      required:
        - marketId
        - fillId
        - makerOrderId
        - takerOrderId
        - executionPrice
        - amountSubunits
        - path
        - matchedAt
        - baseAsset
        - collateralUnit
        - divisibility
        - quotePaymentSubunits
        - outcomeFaceAmountSubunits
        - tokenSide
      properties:
        marketId:
          type: string
        fillId:
          type: string
          format: uuid
        makerOrderId:
          type: string
          format: uuid
        takerOrderId:
          type: string
          format: uuid
        executionPrice:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        path:
          $ref: '#/components/schemas/MatchPath'
        matchedAt:
          type: string
          format: date-time
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: Required product base asset for the canonical settlement amount.
        collateralUnit:
          type: string
          const: msat
          description: Required collateral unit for every settlement amount.
        divisibility:
          type: integer
          format: int32
          enum: [1000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.
        quotePaymentSubunits:
          type: integer
          format: int64
          description: >
            Engine-computed quote payment in the market base-asset sub-unit.
            Authoritative with `baseAsset` and `divisibility`.
        outcomeFaceAmountSubunits:
          type: integer
          format: int64
          description: >
            Engine-computed conditional-token face amount in the market
            base-asset sub-unit.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
          description: Which token on the primitive outcome book was traded.

    LatestConfirmedTrade:
      type: object
      additionalProperties: false
      required:
        - primitiveOutcomeId
        - fillId
        - executedAt
        - eventOrder
        - priceTick
        - divisibility
        - faceAmountSubunits
      properties:
        primitiveOutcomeId:
          type: string
        fillId:
          type: string
          format: uuid
        executedAt:
          type: string
          format: date-time
        eventOrder:
          type: string
        priceTick:
          type: integer
          minimum: 1
        divisibility:
          type: integer
          format: int32
          enum: [1000, 1000000]
        faceAmountSubunits:
          type: integer
          format: int64
          minimum: 1

    MarketStatusChanged:
      type: object
      required:
        - conditionId
        - state
      properties:
        conditionId:
          type: string
          description: The condition identifier whose lifecycle changed.
        state:
          type: string
          enum: [open, closed]
          description: >
            New engine-side lifecycle state. `open` accepts new orders;
            `closed` does not.
        closedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Engine-side close timestamp. Null unless state is `closed`.
        finalOutcome:
          type:
            - string
            - 'null'
          description: >
            Winning outcome after an oracle attestation close. Null for
            deadline-only closes or non-resolving transitions.

    OrderLifecycleStatus:
      type: string
      enum:
        - resting
        - matched
        - partially_filled
        - filled
        - cancelled
        - expired
        - evicted_capacity
        - rejected_capacity
        - failed

    SettlementGroupStatus:
      type: string
      enum:
        - Prepared
        - SubmissionPending
        - Reconciling
        - Confirmed
        - DefinitivelyRejected
        - Refundable
        - ExpiredBeforeSubmission

    SettlementGroupSummary:
      type: object
      additionalProperties: false
      required:
        - groupId
        - status
        - revision
        - coalescingDeadline
        - frozenAt
      properties:
        groupId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SettlementGroupStatus'
        revision:
          type: integer
          format: int32
          minimum: 0
        coalescingDeadline:
          type: string
          format: date-time
        frozenAt:
          type:
            - string
            - 'null'
          format: date-time
          description: >
            Null for Prepared and ExpiredBeforeSubmission. Non-null for every
            lifecycle path that reached SubmissionPending.

    OrderLifecycleChangedDelta:
      type: object
      additionalProperties: false
      required:
        - orderId
        - marketId
        - status
        - remainingAmountSubunits
        - baseAsset
        - collateralUnit
        - divisibility
        - activeSettlementGroup
      properties:
        orderId:
          type: string
          format: uuid
        marketId:
          type: string
        status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        remainingAmountSubunits:
          type: integer
          format: int64
          minimum: 0
          description: Remaining unfilled collateral subunits; zero is terminal.
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        collateralUnit:
          type: string
          const: msat
        divisibility:
          type: integer
          format: int32
          enum: [1000, 1000000]
        activeSettlementGroup:
          oneOf:
            - $ref: '#/components/schemas/SettlementGroupSummary'
            - type: 'null'

    SettlementGroupStateChangedDelta:
      type: object
      additionalProperties: false
      required:
        - orderId
        - marketId
        - settlementGroup
      properties:
        orderId:
          type: string
          format: uuid
        marketId:
          type: string
        settlementGroup:
          $ref: '#/components/schemas/SettlementGroupSummary'
