asyncapi: 3.0.0
info:
  title: BitCaster Market Hub
  description: SignalR hub for real-time order book updates.
  version: 0.1.0
  license:
    name: MIT

servers:
  development:
    host: localhost:5000
    pathname: /hubs/market
    protocol: signalr
    description: Local development SignalR hub

channels:
  joinMarket:
    address: JoinMarket
    messages:
      joinMarketRequest:
        $ref: '#/components/messages/JoinMarketRequest'
    description: Client joins a market group to receive order book updates.

  leaveMarket:
    address: LeaveMarket
    messages:
      leaveMarketRequest:
        $ref: '#/components/messages/LeaveMarketRequest'
    description: Client leaves a market group.

  orderBookUpdated:
    address: OrderBookUpdated
    messages:
      orderBookUpdatedMessage:
        $ref: '#/components/messages/OrderBookUpdatedMessage'
    description: Server pushes an updated order book snapshot to the market group.

  orderAccepted:
    address: OrderAccepted
    messages:
      orderAcceptedMessage:
        $ref: '#/components/messages/OrderAcceptedMessage'
    description: Server pushes a public accepted-order delta to the market group.

  orderCancelled:
    address: OrderCancelled
    messages:
      orderCancelledMessage:
        $ref: '#/components/messages/OrderCancelledMessage'
    description: Server pushes a public cancellation delta to the market group.

  matched:
    address: Matched
    messages:
      matchedMessage:
        $ref: '#/components/messages/MatchedMessage'
    description: Server pushes a public match delta to affected market groups.

  depthChanged:
    address: DepthChanged
    messages:
      depthChangedMessage:
        $ref: '#/components/messages/DepthChangedMessage'
    description: Server pushes a compact depth delta to the market group.

  marketStatusChanged:
    address: MarketStatusChanged
    messages:
      marketStatusChangedMessage:
        $ref: '#/components/messages/MarketStatusChangedMessage'
    description: Server pushes lifecycle state changes to condition market groups.

operations:
  joinMarket:
    action: send
    channel:
      $ref: '#/channels/joinMarket'
    summary: Join a market group
    description: >
      Client invokes JoinMarket with a marketId. The server adds the connection
      to the market's SignalR group and immediately replies with the current
      OrderBookSnapshot via the OrderBookUpdated channel.
    messages:
      - $ref: '#/channels/joinMarket/messages/joinMarketRequest'

  leaveMarket:
    action: send
    channel:
      $ref: '#/channels/leaveMarket'
    summary: Leave a market group
    description: Client invokes LeaveMarket to stop receiving updates for a market.
    messages:
      - $ref: '#/channels/leaveMarket/messages/leaveMarketRequest'

  orderBookUpdated:
    action: receive
    channel:
      $ref: '#/channels/orderBookUpdated'
    summary: Receive order book update
    description: >
      Server pushes an OrderBookSnapshot to all clients in the market group
      whenever the order book changes (new order, cancellation, fill).
    messages:
      - $ref: '#/channels/orderBookUpdated/messages/orderBookUpdatedMessage'

  orderAccepted:
    action: receive
    channel:
      $ref: '#/channels/orderAccepted'
    summary: Receive accepted-order delta
    messages:
      - $ref: '#/channels/orderAccepted/messages/orderAcceptedMessage'

  orderCancelled:
    action: receive
    channel:
      $ref: '#/channels/orderCancelled'
    summary: Receive cancellation delta
    messages:
      - $ref: '#/channels/orderCancelled/messages/orderCancelledMessage'

  matched:
    action: receive
    channel:
      $ref: '#/channels/matched'
    summary: Receive match delta
    messages:
      - $ref: '#/channels/matched/messages/matchedMessage'

  depthChanged:
    action: receive
    channel:
      $ref: '#/channels/depthChanged'
    summary: Receive depth delta
    messages:
      - $ref: '#/channels/depthChanged/messages/depthChangedMessage'

  marketStatusChanged:
    action: receive
    channel:
      $ref: '#/channels/marketStatusChanged'
    summary: Receive market status delta
    messages:
      - $ref: '#/channels/marketStatusChanged/messages/marketStatusChangedMessage'

components:
  messages:
    JoinMarketRequest:
      payload:
        type: object
        required:
          - marketId
        properties:
          marketId:
            type: string
            description: >
              The market ID in the format "{conditionId}-{outcomeSet}".

    LeaveMarketRequest:
      payload:
        type: object
        required:
          - marketId
        properties:
          marketId:
            type: string
            description: >
              The market ID in the format "{conditionId}-{outcomeSet}".

    OrderBookUpdatedMessage:
      payload:
        $ref: '#/components/schemas/OrderBookSnapshot'

    OrderAcceptedMessage:
      payload:
        $ref: '#/components/schemas/OrderAcceptedDelta'

    OrderCancelledMessage:
      payload:
        $ref: '#/components/schemas/OrderCancelledDelta'

    MatchedMessage:
      payload:
        $ref: '#/components/schemas/MatchedDelta'

    DepthChangedMessage:
      payload:
        $ref: '#/components/schemas/DepthDelta'

    MarketStatusChangedMessage:
      payload:
        $ref: '#/components/schemas/MarketStatusChanged'

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    Probability:
      type: integer
      minimum: 1
      maximum: 99
      description: A probability price representing a percentage chance [1, 99].

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell

    MatchPath:
      type: string
      enum:
        - Complementary
        - Mint

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/Sats'

    OrderBookSnapshot:
      type: object
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The market ID in the format "{conditionId}-{outcomeSet}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          type:
            - integer
            - 'null'
          description: Difference between best ask and best bid. Null if either side is empty.

    OrderAcceptedDelta:
      type: object
      required:
        - marketId
        - orderId
        - outcomeId
        - side
        - price
        - remainingAmountSats
      properties:
        marketId:
          type: string
        orderId:
          type: string
          format: uuid
        outcomeId:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'

    OrderCancelledDelta:
      type: object
      required:
        - marketId
        - orderId
      properties:
        marketId:
          type: string
        orderId:
          type: string
          format: uuid

    MatchedDelta:
      type: object
      required:
        - marketId
        - tradeId
        - makerOrderId
        - takerOrderId
        - executionPrice
        - amountSats
        - path
        - matchedAt
      properties:
        marketId:
          type: string
        tradeId:
          type: string
          format: uuid
        makerOrderId:
          type: string
          format: uuid
        takerOrderId:
          type: string
          format: uuid
        executionPrice:
          $ref: '#/components/schemas/Probability'
        amountSats:
          $ref: '#/components/schemas/Sats'
        path:
          $ref: '#/components/schemas/MatchPath'
        matchedAt:
          type: string
          format: date-time

    DepthDelta:
      type: object
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
        spread:
          type:
            - integer
            - 'null'

    MarketStatusChanged:
      type: object
      required:
        - conditionId
        - state
      properties:
        conditionId:
          type: string
        state:
          type: string
        closedAt:
          type:
            - string
            - 'null'
          format: date-time
        finalOutcome:
          type:
            - string
            - 'null'
