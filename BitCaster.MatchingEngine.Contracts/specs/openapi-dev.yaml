openapi: 3.1.0
info:
  title: BitCaster Matching Engine — Development-only API
  description: >
    Dev/staging-only endpoints exposed by both the in-memory stub and the real
    matching engine when running in a non-production environment. These
    endpoints are intentionally excluded from the public contract
    (`openapi.yaml`) so that the production surface stays tight.
  version: 0.2.0
  license:
    name: MIT

servers:
  - url: http://localhost:5001
    description: Local development (via Aspire AppHost)

paths:
  /api/v1/markets/{marketId}/simulate-payment:
    post:
      operationId: simulatePayment
      summary: Simulate paying a bolt11 invoice (dev-only)
      description: >
        Pays the given bolt11 invoice using the market's LNBits wallet admin key.
        Only works with LNBits FakeWallet backend (internal invoices only).
      x-dev-only: true
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePaymentRequest'
      responses:
        '200':
          description: Payment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatePaymentResponse'
        '404':
          description: Market not found or no wallet provisioned
        '502':
          description: LNBits backend error

  /api/v1/_dev/markets/{marketId}/simulate-cpmm-funding:
    post:
      operationId: simulateCpmmFunding
      summary: Flip a CPMM pool into Active state with synthesized reserves (dev-only)
      description: >
        Bypasses the real LN-deposit + mint-swap flow by directly writing a
        per-outcome reserve map into the in-memory CPMM state and posting
        bootstrap maker orders under the `cpmm:{marketId}` sentinel user id.
        Used by the frontend E2E suite to seed a tradeable market in O(1)
        without running a mint, LNBits, or price-ladder derivation. The real
        server never exposes this endpoint.
      x-dev-only: true
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCpmmFundingRequest'
      responses:
        '200':
          description: Pool flipped to Active; bootstrap orders posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateCpmmFundingResponse'
        '400':
          description: Validation error (e.g. empty reserves, invalid bootstrap order)

components:
  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
      description: >
        The market to trade on, in the format "{conditionId}-{outcomeName}"
        (e.g. "deadbeef…abc-Alice").

  schemas:
    SimulatePaymentRequest:
      type: object
      required:
        - bolt11
      properties:
        bolt11:
          type: string
          description: The bolt11 invoice to pay.

    SimulatePaymentResponse:
      type: object
      required:
        - paid
      properties:
        paid:
          type: boolean
          description: Whether the payment was successful.

    SimulateCpmmFundingRequest:
      type: object
      required:
        - declaredSats
        - reservedSatsByOutcome
      properties:
        declaredSats:
          type: integer
          format: int64
          description: Total sats the creator declared at market creation.
        reservedSatsByOutcome:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: >
            Per-outcome reserve map — mirrors the real engine's CPMM pool
            after a successful creator deposit. Each value must be a positive
            integer (outcome-tokens held by the engine).
        bootstrapOrders:
          type: array
          description: >
            Optional resting maker orders to post under the
            `cpmm:{marketId}` sentinel user id so a subsequent taker order
            can match. Usually a single Sell order on the outcome the E2E
            intends to buy is enough.
          items:
            $ref: '#/components/schemas/CpmmBootstrapOrder'

    CpmmBootstrapOrder:
      type: object
      required:
        - outcome
        - side
        - price
        - amountSats
      properties:
        outcome:
          type: string
          description: Outcome name the order is posted against (e.g. "Yes").
        side:
          type: string
          enum: [Buy, Sell]
          description: Order side; CPMM bootstrap orders are typically Sell.
        price:
          type: integer
          description: Probability price in [1,99].
        amountSats:
          type: integer
          format: int64
          description: Total order size in satoshis.

    SimulateCpmmFundingResponse:
      type: object
      required:
        - marketId
        - status
        - declaredSats
        - reservedSatsByOutcome
        - bootstrapOrderIds
      properties:
        marketId:
          type: string
        status:
          type: string
          enum: [AwaitingFunding, Active, Frozen]
        declaredSats:
          type: integer
          format: int64
        reservedSatsByOutcome:
          type: object
          additionalProperties:
            type: integer
            format: int64
        bootstrapOrderIds:
          type: array
          items:
            type: string
            format: uuid
          description: Ids of posted bootstrap maker orders (empty if none requested).
