openapi: 3.1.0
info:
  title: BitCaster Matching Engine API
  description: REST API for the BitCaster prediction market matching engine.
  version: 0.2.0
  license:
    name: MIT

servers:
  - url: http://localhost:5001
    description: Local development (via Aspire AppHost)

paths:
  /api/v1/{marketId}/orders:
    post:
      operationId: submitOrder
      summary: Submit a new order
      description: Submit a limit or market order to the matching engine.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string

  /api/v1/{marketId}/orders/{orderId}:
    delete:
      operationId: cancelOrder
      summary: Cancel an existing order
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the order to cancel.
      responses:
        '200':
          description: Order cancelled
        '404':
          description: Order not found

  /api/v1/{marketId}/orderbook:
    get:
      operationId: getOrderBook
      summary: Get the current order book snapshot
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookSnapshot'

  /api/v1/{marketId}/liquidity:
    post:
      operationId: registerLiquidity
      summary: Register CPMM initial liquidity
      description: >
        Creates a CPMM (Constant Product Market Maker) pool for the given market
        and places limit orders on the CLOB to bootstrap liquidity.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLiquidityRequest'
      responses:
        '200':
          description: Liquidity registered and orders placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterLiquidityResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '409':
          description: CPMM pool already exists for this market
          content:
            application/json:
              schema:
                type: string

    get:
      operationId: getLiquidity
      summary: Get CPMM pool state
      description: Returns the current state of the CPMM liquidity pool for a market.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current pool state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityStateResponse'
        '404':
          description: No CPMM pool for this market

    delete:
      operationId: withdrawLiquidity
      summary: Withdraw CPMM liquidity
      description: >
        Cancels all active CPMM orders and withdraws the liquidity pool.
        Only the original provider can withdraw.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: providerId
          in: query
          required: true
          schema:
            type: string
          description: The provider ID that originally registered the liquidity.
      responses:
        '200':
          description: Liquidity withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawLiquidityResponse'
        '400':
          description: Authorization error (not the pool provider)
          content:
            application/json:
              schema:
                type: string
        '404':
          description: No CPMM pool for this market

components:
  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
      description: >
        The market to trade on, in the format "{conditionId}-{outcomeName}"
        (e.g. "deadbeef…abc-Alice"). Each outcome of a condition has its own
        independent binary order book. A marketId containing "|" is invalid.

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    Probability:
      type: integer
      minimum: 1
      maximum: 99
      description: A probability price representing a percentage chance [1, 99].

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell
      description: Direction of an order relative to the outcome token.

    OrderType:
      type: string
      enum:
        - Limit
        - Market
      description: Execution semantics of an order.

    TimeInForce:
      type: string
      enum:
        - GTC
        - FOK
        - FAK
      description: >
        Time-in-force policy. GTC = Good-Till-Cancel (rests on book),
        FOK = Fill-Or-Kill (reject if not fully filled),
        FAK = Fill-And-Kill (cancel remaining after partial fill).

    MatchPath:
      type: string
      enum:
        - Direct
        - Complementary
      description: How two orders were matched together.

    Fill:
      type: object
      required:
        - id
        - takerOrderId
        - makerOrderId
        - amountSats
        - executionPrice
        - path
        - filledAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique fill identifier.
        takerOrderId:
          type: string
          format: uuid
          description: The incoming (aggressor) order that triggered this fill.
        makerOrderId:
          type: string
          format: uuid
          description: The resting order that was matched against.
        amountSats:
          $ref: '#/components/schemas/Sats'
        executionPrice:
          $ref: '#/components/schemas/Probability'
        path:
          $ref: '#/components/schemas/MatchPath'
        filledAt:
          type: string
          format: date-time
          description: Timestamp when this fill was executed.

    SubmitOrderRequest:
      type: object
      required:
        - outcomeId
        - side
        - price
        - amountSats
        - userId
      properties:
        outcomeId:
          type: string
          description: The outcome to trade (e.g. "Alice", "YES").
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSats:
          $ref: '#/components/schemas/Sats'
        userId:
          type: string
          description: Opaque user identifier (e.g. Nostr pubkey hex).
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
          default: GTC

    SubmitOrderResponse:
      type: object
      required:
        - orderId
        - status
        - remainingAmountSats
        - fills
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned to this order.
        status:
          type: string
          description: >
            One of: "filled", "partially_filled", "resting", "cancelled".
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: List of fills produced by this order. Empty if no matches.

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/Sats'
      description: A single price level in the order book depth.

    OrderBookSnapshot:
      type: object
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          oneOf:
            - type: integer
            - type: 'null'
          description: Difference between best ask and best bid. Null if either side is empty.

    RegisterLiquidityRequest:
      type: object
      required:
        - liquiditySats
        - providerId
      properties:
        liquiditySats:
          type: integer
          format: int64
          minimum: 1
          description: Total liquidity to deposit in satoshis.
        providerId:
          type: string
          description: Identifier of the liquidity provider.
        initialProbability:
          type: integer
          minimum: 1
          maximum: 99
          default: 50
          description: Initial implied probability for the market [1, 99].

    RegisterLiquidityResponse:
      type: object
      required:
        - marketId
        - reserveA
        - reserveB
        - impliedProbability
        - ordersPlaced
      properties:
        marketId:
          type: string
        reserveA:
          type: integer
          format: int64
          description: Reserve for outcome A (YES/HI) after pool creation.
        reserveB:
          type: integer
          format: int64
          description: Reserve for outcome B (NO/LO) after pool creation.
        impliedProbability:
          type: integer
          minimum: 1
          maximum: 99
          description: Implied probability derived from reserves.
        ordersPlaced:
          type: array
          items:
            $ref: '#/components/schemas/LiquidityOrderDto'
          description: List of limit orders placed on the CLOB.

    LiquidityOrderDto:
      type: object
      required:
        - orderId
        - outcomeId
        - side
        - price
        - amountSats
      properties:
        orderId:
          type: string
          format: uuid
        outcomeId:
          type: string
        side:
          type: string
        price:
          type: integer
          minimum: 1
          maximum: 99
        amountSats:
          type: integer
          format: int64

    LiquidityStateResponse:
      type: object
      required:
        - marketId
        - reserveA
        - reserveB
        - impliedProbability
        - totalLiquiditySats
        - activeOrders
      properties:
        marketId:
          type: string
        reserveA:
          type: integer
          format: int64
        reserveB:
          type: integer
          format: int64
        impliedProbability:
          type: integer
          minimum: 1
          maximum: 99
        totalLiquiditySats:
          type: integer
          format: int64
        activeOrders:
          type: integer
          description: Number of active CPMM orders on the CLOB.

    WithdrawLiquidityResponse:
      type: object
      required:
        - cancelledOrders
        - remainingReserveA
        - remainingReserveB
      properties:
        cancelledOrders:
          type: integer
          description: Number of CPMM orders cancelled from the CLOB.
        remainingReserveA:
          type: integer
          format: int64
        remainingReserveB:
          type: integer
          format: int64
