openapi: 3.1.0
info:
  title: BitCaster Matching Engine API
  description: REST API for the BitCaster prediction market matching engine.
  version: 0.2.0
  license:
    name: MIT

servers:
  - url: http://localhost:5001
    description: Local development (via Aspire AppHost)

paths:
  /api/v1/markets/{conditionId}:
    post:
      operationId: createMarket
      summary: Register a new market on the matching engine
      security:
        - nip98: []
      description: >
        Validates the condition exists in the mint, creates market order books,
        and optionally stores a thumbnail.
        The authenticated pubkey from the NIP-98 header is recorded as the
        market creator — no creator field in the request body is needed.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
              properties:
                metadata:
                  type: string
                  description: >
                    JSON-encoded CreateMarketRequest object containing market
                    title, description, outcomes, liquidity, and category tags.
                thumbnail:
                  type: string
                  format: binary
                  description: Optional thumbnail image (JPEG, PNG, or WebP, max 5 MB).
      responses:
        '200':
          description: Market created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMarketResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication
        '409':
          description: Market already exists for this condition
          content:
            application/json:
              schema:
                type: string

  /api/v1/markets/{conditionId}/oracle-attestation:
    post:
      operationId: submitOracleAttestation
      summary: Submit a signed oracle attestation directly to the engine
      description: >
        Accepts a Nostr kind-89 DLC oracle attestation event and closes any
        open market identified by conditionId when the event and embedded
        kormir/rust-dlc attestation verify against that market's registered
        oracle. Nostr relay publication is optional: this endpoint is the
        direct closure path for bitCaster markets. The payload is
        self-authenticating, so no NIP-98 header is required.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OracleNostrEvent'
      responses:
        '200':
          description: >
            Attestation accepted. Result is "Closed", "AlreadyClosed", or
            "DuplicateReplay".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleAttestationResponse'
        '400':
          description: >
            The submitted event is not a valid kind-89 oracle attestation, or
            its signatures/payload do not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleAttestationResponse'
        '404':
          description: >
            The attestation verified, but no open market is registered for the
            attesting oracle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleAttestationResponse'

  /api/v1/markets/{conditionId}/price-history:
    get:
      operationId: getMarketPriceHistory
      summary: Fetch primitive outcome price history for a market
      description: >
        Returns primitive outcome price points grouped by primitive outcome id.
        A newly registered market includes an initial zero-volume anchor point
        (`source = initial`) sourced from the creator probabilities. Initial
        anchors act as a left-edge carry-forward value and are clamped to the
        requested timeframe boundary when needed; settled trade ticks
        (`source = fill`) are added only when settlement commits and are
        filtered to the requested timeframe. Compound outcome-set matches are
        projected only when settlement commits, and the response never uses
        compound outcome ids.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum:
              - 1h
              - 24h
              - 7d
              - 30d
              - all
            default: 7d
      responses:
        '200':
          description: Primitive outcome price history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPriceHistoryResponse'
        '400':
          description: Invalid condition id or timeframe

  /api/v1/markets/{conditionId}/comments:
    get:
      operationId: getMarketComments
      summary: Fetch verified trade comments for a market
      description: >
        Returns engine-indexed comments attached to orders in this condition
        after those orders have produced at least one settled fill. The
        response is condition-keyed and returns the public kind-1 author
        pubkey while intentionally omitting order ids, fill ids, ephemeral
        pubkeys, and counterparty ids.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: Verified market comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCommentsResponse'
        '400':
          description: Invalid condition id

  /api/v1/conditions/{conditionId}/attestation:
    get:
      operationId: getConditionAttestation
      summary: Fetch the verified oracle witness for a closed condition
      description: >
        Returns the oracle witness persisted when the engine closed the market
        from a verified DLC oracle attestation. Clients use this witness as
        input to the mint's `POST /v1/redeem_outcome` endpoint. The mint still
        verifies the witness before paying out; this endpoint is a convenience
        cache for already-closed bitCaster conditions, not the payout authority.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: Verified oracle witness for the resolved condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionAttestationResponse'
        '400':
          description: Invalid condition id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionAttestationProblem'
        '404':
          description: >
            Market not found, market not closed by oracle resolution, or no
            redeemable oracle witness is stored for the closed market.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionAttestationProblem'

  /api/v1/conditions/{conditionId}/orders/batch:
    post:
      operationId: batchSubmitOrders
      summary: Submit multiple orders for one condition
      security:
        - nip98: []
      description: >
        Applies order items in request order across visible books that share
        conditionId. Each item returns an independent result; envelope, auth,
        route, closed-market, and rate-limit failures still use HTTP errors.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSubmitOrdersRequest'
      responses:
        '200':
          description: Per-item batch submit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitOrdersResponse'
        '400':
          description: Invalid batch envelope or route mismatch
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Condition not registered
        '409':
          description: Market is closed or batch conflicted with book state
        '429':
          description: Item-weighted rate limit exceeded

  /api/v1/conditions/{conditionId}/orders/cancel-batch:
    post:
      operationId: batchCancelOrders
      summary: Cancel multiple orders for one condition
      security:
        - nip98: []
      description: >
        Cancels order ids under conditionId with privacy-preserving notCanceled
        failures. The response does not disclose whether an uncanceled order
        exists but belongs to another user.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCancelOrdersRequest'
      responses:
        '200':
          description: Batch cancel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCancelOrdersResponse'
        '400':
          description: Invalid batch envelope
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Condition not registered
        '429':
          description: Item-weighted rate limit exceeded

  /api/v1/{marketId}/orders:
    get:
      operationId: listRestingOrders
      summary: List the authenticated user's resting orders
      security:
        - nip98: []
      description: >
        Returns live resting orders in this market owned by the authenticated
        user. Used by clients that need to rebuild local order-tracking state
        after a restart.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Resting orders owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRestingOrdersResponse'
        '401':
          description: Missing or invalid NIP-98 authentication

    post:
      operationId: submitOrder
      summary: Submit a new order
      security:
        - nip98: []
      description: Submit a limit or market order to the matching engine.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication

  /api/v1/orders/mine:
    get:
      operationId: listMyOrders
      summary: List authenticated user's orders for a condition
      security:
        - nip98: []
      description: >
        Returns the caller's live resting orders plus bounded recent order
        history for the requested condition. The conditionId query parameter
        is required to avoid global user-order scans.
      parameters:
        - name: conditionId
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Caller-owned orders for the condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMyOrdersResponse'
        '400':
          description: Missing or invalid conditionId
        '401':
          description: Missing or invalid NIP-98 authentication

  /api/v1/trades/{tradeId}/ephemeral-pubkey:
    post:
      operationId: submitTradeEphemeralPubkey
      summary: Submit match-time ephemeral pubkey for a pending trade
      security:
        - nip98: []
      description: >
        Submits the caller's compressed secp256k1 ephemeral pubkey for a
        pending matched trade. The conditionId query parameter identifies the
        condition-local order book that currently owns the pending match.
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: conditionId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEphemeralPubkeyRequest'
      responses:
        '200':
          description: Ephemeral pubkey accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEphemeralPubkeyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Trade not found or caller is not a party
        '409':
          description: Pubkey already differs or submission deadline expired

  /api/v1/{marketId}/orders/{orderId}:
    get:
      operationId: getOrderStatus
      summary: Fetch the current state of an order
      security:
        - nip98: []
      description: >
        Returns the order's live status, remaining/filled amounts, and the
        list of fills produced so far. Clients poll this endpoint to observe
        async state changes (fills, cancellation, expiry) without holding an
        open connection. Only the order's owner (matching the authenticated
        pubkey) may query its status.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The order's unique identifier.
      responses:
        '200':
          description: Current order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Order not found

    delete:
      operationId: cancelOrder
      summary: Cancel an existing order
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the order to cancel.
      responses:
        '200':
          description: Order cancelled
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Order not found

  /api/v1/{marketId}/orderbook:
    get:
      operationId: getOrderBook
      summary: Get the current order book snapshot
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookSnapshot'

  /api/v1/{marketId}/liquidity:
    get:
      operationId: getLiquidity
      summary: Get liquidity state
      description: Returns the current public liquidity state for a market.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current liquidity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityStateResponse'
        '404':
          description: No liquidity state for this market

  /api/v1/{marketId}/metadata:
    get:
      operationId: getMarketMetadata
      summary: Get market metadata
      description: >
        Returns aggregated metadata for a market including trading volume,
        trade count, unique trader count, and liquidity.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Market metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMetadataSnapshot'

  /api/v1/{conditionId}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Get the thumbnail image for a condition
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: The thumbnail image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: No thumbnail for this condition

  /api/v1/markets/{conditionId}/deposit/ecash:
    post:
      operationId: requestEcashDeposit
      summary: Submit an ecash payment for market liquidity
      security:
        - nip98: []
      description: >
        Submits an ecash deposit for asynchronous proof verification and
        crediting. The client supplies a durable `depositId` before selecting
        or sending proofs and reuses it for exact retries and status polling.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEcashDepositRequest'
      responses:
        '200':
          description: Deposit recorded; verification proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEcashDepositResponse'
        '400':
          description: Validation error (e.g. malformed proofs token, non-positive amount)
        '401':
          description: Missing or invalid NIP-98 authentication
        '403':
          description: Market is closed and this is not an exact retry of an existing deposit
        '404':
          description: Market not found
        '409':
          description: Deposit identifier is already bound to a different request
        '429':
          description: Per-pubkey deposit-request rate limit exceeded
        '502':
          description: Wallet-service forwarding failed; retry the exact request and deposit id

  /api/v1/markets/{conditionId}/deposit/{depositId}:
    get:
      operationId: getDepositStatus
      summary: Read the current state of a deposit
      security:
        - nip98: []
      description: >
        Owner-scoped read of a single deposit's lifecycle and immutable
        durable-recipient tuple. Bearer proof material is deliberately
        excluded. A caller that does not own the deposit receives 404.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
        - name: depositId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Deposit identifier returned by the request endpoint.
      responses:
        '200':
          description: Deposit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDepositResponseDto'
        '404':
          description: No deposit with this id for this condition and owner
        '401':
          description: Missing or invalid authentication

  /api/v1/participation-score:
    get:
      operationId: getParticipationScore
      summary: Read the authenticated user's participation Score
      security:
        - nip98: []
      description: >
        Returns the caller's non-withdrawable participation Score balance and
        current match-debit policy. Score is a sat-denominated engine-use fee
        balance, separate from market collateral units.
      responses:
        '200':
          description: Participation Score state for the authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationScoreResponse'
        '401':
          description: Missing or invalid NIP-98 authentication

  /api/v1/participation-score/payments/{paymentId}:
    get:
      operationId: getParticipationScorePayment
      summary: Read one durable participation Score payment
      security:
        - nip98: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exact credited payment tuple owned by the authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationScorePaymentStatusResponse'
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Payment not found or owned by another account

  /api/v1/participation-score/ecash:
    post:
      operationId: payParticipationScoreEcash
      summary: Pay ecash to top up participation Score
      security:
        - nip98: []
      description: >
        Pays a regular sat ecash token into the global Engine fee account.
        The fee is non-refundable and credits participation Score for the
        authenticated account. The supplied token amount must exactly
        match `amountSats`; this endpoint never credits a market account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayParticipationScoreEcashRequest'
      responses:
        '200':
          description: Ecash accepted and Score credited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayParticipationScoreEcashResponse'
        '202':
          description: Exact payment is durably pending; query its owner-scoped status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayParticipationScoreEcashResponse'
        '400':
          description: Validation error (e.g. malformed token or non-positive amount)
        '401':
          description: Missing or invalid NIP-98 authentication
        '429':
          description: Per-pubkey payment-request rate limit exceeded
        '502':
          description: Wallet-service payment error

  /api/v1/creators/{pubkey}/markets:
    get:
      operationId: listCreatorMarkets
      summary: List markets created by a given Nostr pubkey
      description: >
        Returns every market whose creator (authenticated via NIP-98 at
        registration time) matches the supplied pubkey, along with aggregated
        volume data so the creator dashboard can render totals without
        additional round-trips.
      parameters:
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: Nostr pubkey (hex) of the market creator.
      responses:
        '200':
          description: List of markets created by this pubkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorMarketsResponse'

  /api/v1/markets/query:
    get:
      operationId: queryMarkets
      summary: Catalogue proxy — list markets with filters, sort, and pagination
      description: >
        Returns the public market catalogue with matching-engine market state,
        mint condition data, and trading summary fields. This is the read
        endpoint the markets list page (`/markets`) and discovery surfaces
        consume.

        Anonymous by default. NIP-98 is OPTIONAL — when present, the request
        is authenticated and routed to a higher per-pubkey rate-limit bucket;
        when absent, the per-IP bucket applies. Authentication does NOT change
        the response shape or visibility — every market visible to an anonymous
        caller is also visible to an authenticated caller and vice versa.

        The response combines condition metadata (`outcomes`, `creatorPubkey`,
        `deadline`, and oracle attestation/close metadata) with trading state
        (`state`, `volume*`, `lastTradedPrice`, and `createdAt`). A market
        missing either side of that public data is omitted from the catalogue
        until both are available.
      security:
        - {}
        - nip98: []
      parameters:
        - name: tag
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            uniqueItems: false
          style: form
          explode: true
          description: >
            Repeatable category tag filter (e.g. `?tag=politics&tag=tech`).
            A market matches when at least one of its category tags matches
            at least one supplied tag (OR semantics across the supplied tags).
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [Open, Closed, All]
            default: Open
          description: >
            State filter against the matching engine's lifecycle state.
            Default is `Open`. Use `All` to include both Open and Closed
            markets in a single response. The match is case-insensitive on
            the wire (`open` works the same as `Open`).
        - name: creator_pubkey
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: >
            Restrict the result to markets whose creator pubkey matches.
            64-character lowercase hex Nostr pubkey. Different from
            `/api/v1/creators/{pubkey}/markets` — that endpoint returns the
            creator-dashboard volume rollup; this filter returns the full
            catalogue response.
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of conditionIds to bulk-fetch (e.g.
            `?ids=abc,def,123`). Returns only the named markets that match the
            other filters. Capped at 100 ids per request — exceeding the cap
            is a 400.
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >
            Full-text market search query. When present, results are ordered by
            relevance. The active `tag`, `state`, `creator_pubkey`, and `ids`
            filters also constrain the search. Capped at 200 normalized
            characters.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [Trending, Popular, New]
            default: Trending
          description: >
            Sort dimension. `Trending` orders by 24h trading volume descending;
            `Popular` orders by 30d trading volume descending; `New` orders
            by RegisterMarket timestamp descending. Ties on the sort dimension
            break by `conditionId` ascending so paginated streams remain
            deterministic.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination token returned in `nextCursor` from a previous
            page. The engine HMAC-signs cursors before returning them and
            verifies the signature before reading the underlying boundary —
            tampered or unsigned cursors are 400. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: >
            Page size cap. Default 20, hard cap 50 — exceeding the cap is a
            400. Page sizes below 1 are also a 400.
      responses:
        '200':
          description: Paginated catalogue of markets matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCatalogueResponse'
        '400':
          description: >
            Invalid query parameters — typo'd `state`/`sort` value, malformed
            `creator_pubkey`, `ids` over the 100-cap, `page_size` outside
            `[1, 50]`, or a tampered/malformed `cursor`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: >
            NIP-98 token was supplied but rejected (e.g. expired, signature
            mismatch, body-payload mismatch). Anonymous callers do NOT see 401
            from this route.
        '429':
          description: >
            Rate limit exceeded. Anonymous callers share a per-IP bucket;
            NIP-98-authenticated callers have their own per-pubkey bucket
            with a higher permit ceiling. The engine returns this when the
            applicable bucket is empty.

components:
  securitySchemes:
    nip98:
      type: http
      scheme: Nostr
      description: >
        NIP-98 HTTP Auth. The client signs a Nostr kind-27235 event containing
        the request URL and HTTP method, then sends it as
        `Authorization: Nostr <base64-encoded-event>`. The server verifies the
        BIP-340 Schnorr signature and extracts the signer's pubkey as the
        authenticated identity. See https://github.com/nostr-protocol/nips/blob/master/98.md

  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
      description: >
        The primitive outcome book to trade on, in the format
        "{conditionId}-{outcomeName}" (e.g. "deadbeef…abc-Alice"). Public
        market IDs never contain finite outcome-set separators such as "|";
        use SubmitOrderRequest.tokenSide to choose the primitive outcome token
        or its one-vs-rest complement. Binary YES/NO markets expose only the
        YES route ("{conditionId}-YES"); NO is traded as tokenSide=Complement
        on that YES route, and "{conditionId}-NO" is not a valid market ID.

    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: string
      description: >
        The condition identifier (hex string derived from the oracle announcement).

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    CollateralSubunits:
      type: integer
      format: int64
      minimum: 0
      description: >
        Collateral subunits — msat (1/1000 sat) for sat-denominated markets,
        cents for USD-denominated markets. Wire amount = collateral subunits
        per ADR-025. Request fields enforce minimum 1 at validation;
        response fields (remainingAmountSubunits, filledAmountSubunits)
        may be 0 for filled/cancelled orders.

    Probability:
      type: integer
      minimum: 1
      description: >
        Market price numerator `k`. Valid range is `1 <= k <= D - 1`, where
        `D` is the market's immutable `divisibility`. Immutable price
        denominator D is per-market: sat markets use D=10000 (0.01%
        precision), USD markets use D=1000 (0.1% precision), numeric sat
        markets use D=1000000 (0.0001% precision).

    BaseAsset:
      type: string
      enum: [sat, usd, jpy]
      description: >
        Market quote/collateral base asset. `sat` and `usd` are accepted for
        market registration. `usd`: BTC-backed; deposits are priced as BTC
        Lightning invoices at quote time. Collateral is held in msat for `sat`
        markets and cents (`usd`) for `usd` markets. `jpy` is reserved.

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell
      description: Direction of an order relative to the outcome token.

    TokenSide:
      type: string
      enum:
        - Outcome
        - Complement
      description: >
        Which token on the primitive outcome book is being traded. `Outcome`
        means the selected primitive outcome named by outcomeId; `Complement`
        means the one-vs-rest complement of that outcome.

        Note on binary YES/NO markets: only the YES route is public. Trade YES
        with tokenSide=Outcome on cond-YES, and trade NO with
        tokenSide=Complement on cond-YES. Categorical markets (3+ outcomes)
        also expose atomic outcome routes only; complement collections are
        accessed via TokenSide: Complement on the corresponding atomic route.

    OrderType:
      type: string
      enum:
        - Limit
        - Market
      description: Execution semantics of an order.

    TimeInForce:
      type: string
      enum:
        - GTC
        - FOK
        - FAK
      description: >
        Time-in-force policy. GTC = Good-Till-Cancel (rests on book),
        FOK = Fill-Or-Kill (reject if not fully filled),
        FAK = Fill-And-Kill (cancel remaining after partial fill).

    MatchPath:
      type: string
      enum:
        - Complementary
        - Mint
      description: >
        How two orders were matched together. Terminology mirrors Polymarket
        CTF Exchange V2: `Complementary` pairs a Buy against a Sell of the same
        outcome (no split required); `Mint` pairs two Buys for complementary
        outcome sets and the maker supplies the complementary CTF side from
        exact inventory, primitive complement legs, or an at-match collateral
        split. The
        `Merge` path (Sell vs Sell) is not yet supported in bitCaster.

    FillStatus:
      type: string
      enum:
        - Matched
        - Filled
        - Failed
      description: >
        Lifecycle status of a fill-shaped order execution row. `Matched`
        means atomic-swap settlement is still pending; `Filled` means
        settlement committed; `Failed` means the atomic-swap session reached
        a terminal failure and should no longer be retried.

    OracleNostrEvent:
      type: object
      required:
        - id
        - pubkey
        - createdAt
        - kind
        - tags
        - content
        - sig
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: NIP-01 event id of the kind-89 attestation.
        pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: X-only BIP-340/Nostr public key of the oracle.
        createdAt:
          type: integer
          format: int64
          description: NIP-01 created_at timestamp in Unix seconds.
        kind:
          type: integer
          enum:
            - 89
          description: Nostr event kind for DLC oracle attestations.
        tags:
          type: array
          description: NIP-01 tags committed into the event id. NIP-88 attestations include an e-tag pointing to the kind-88 announcement event id.
          items:
            type: array
            items:
              type: string
        content:
          type: string
          description: Base64-encoded DLC oracle_attestation payload.
        sig:
          type: string
          pattern: '^[0-9a-fA-F]{128}$'
          description: BIP-340 Schnorr signature over the NIP-01 event id.

    OracleAttestationResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - Closed
            - AlreadyClosed
            - DuplicateReplay
            - WrongKind
            - InvalidSignature
            - InvalidPayload
            - NoMatchingMarket
          description: Engine processing result for the submitted attestation.

    ConditionAttestationResponse:
      type: object
      required:
        - conditionId
        - attestedOutcome
        - oracleWitness
      properties:
        conditionId:
          type: string
          description: bitCaster condition id for the closed market.
        attestedOutcome:
          type: string
          description: The single outcome attested by the DLC oracle.
        oracleWitness:
          $ref: '#/components/schemas/OracleWitness'

    ConditionAttestationProblem:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - InvalidConditionId
            - MarketNotFound
            - AttestationNotAvailable

    OracleWitness:
      type: object
      required:
        - oracle_sigs
      properties:
        oracle_sigs:
          type: array
          items:
            $ref: '#/components/schemas/OracleWitnessSig'

    OracleWitnessSig:
      type: object
      required:
        - oracle_pubkey
        - oracle_sig
        - outcome
      properties:
        oracle_pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: X-only BIP-340 oracle public key.
        oracle_sig:
          type: string
          pattern: '^[0-9a-fA-F]{128}$'
          description: Oracle signature over the attested outcome.
        outcome:
          type: string
          description: Outcome string signed by the oracle.

    Fill:
      type: object
      description: >
        One leg of a match: the taker's incoming order crossing a single maker.
        Canonical settlement amounts are carried by `quotePaymentSubunits`,
        `outcomeFaceAmountSubunits`, `baseAsset`, `divisibility`, and `tokenSide`.
        `amountSubunits` is the conditional-token face amount in market
        collateral subunits (msat for sat markets, cents for USD markets).
        `quotePaymentSubunits + baseAsset + divisibility` is the authoritative
        quote payment.
      required:
        - id
        - takerOrderId
        - makerOrderId
        - amountSubunits
        - executionPrice
        - path
        - filledAt
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique fill identifier.
        takerOrderId:
          type: string
          format: uuid
          description: The incoming (aggressor) order that triggered this fill.
        makerOrderId:
          type: string
          format: uuid
          description: The resting order that was matched against.
        amountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          description: >
             Conditional-token face amount matched for settlement in market
             collateral subunits (msat for sat markets, cents for USD markets).
        executionPrice:
          $ref: '#/components/schemas/Probability'
        path:
          $ref: '#/components/schemas/MatchPath'
        status:
          $ref: '#/components/schemas/FillStatus'
        baseAsset:
          allOf:
            - $ref: '#/components/schemas/BaseAsset'
          default: sat
          description: >
            Base asset for the canonical settlement amount. Optional for
            backward compatibility; omitting it implies the legacy `sat` base
            asset.
        divisibility:
          type: integer
          format: int32
          minimum: 2
          default: 10000
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).
        quotePaymentSubunits:
          type: integer
          format: int64
          nullable: true
          description: >
            Engine-computed quote payment in the market base-asset sub-unit.
            This field plus `baseAsset` and `divisibility` is the
            authoritative quote payment. Present for new trade-start fills;
            omitted or null for older replay data.
        outcomeFaceAmountSubunits:
          type: integer
          format: int64
          nullable: true
          description: >
            Engine-computed conditional-token face amount in the market
            base-asset sub-unit. Present for new trade-start fills; omitted
            or null for older replay data.
        tokenSide:
          allOf:
            - $ref: '#/components/schemas/TokenSide'
          default: Outcome
          description: >
            Which token on the primitive outcome book was traded for the
            order that produced this fill. Optional for backward
            compatibility; omitting it implies `Outcome`.
        filledAt:
          type: string
          format: date-time
          description: Timestamp when this fill was executed.
        tradeId:
          type: string
          format: uuid
          description: >
            Atomic-swap trade session identifier for this fill. Present when
            the client must join TradeHub to settle; omitted only for legacy
            fills that do not have a corresponding TradeHub session.

    SubmitOrderRequest:
      type: object
      required:
        - outcomeId
        - tokenSide
        - side
        - price
        - amountSubunits
        - clientOrderId
      properties:
        outcomeId:
          type: string
          description: >
            The primitive outcome to trade (e.g. "Alice" or "YES"). Must match
            the outcomeName segment of marketId and must not contain "|".
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          description: >
            Limit-order size as conditional-token face amount. Must be
            divisible by the market's whole-share face value, independent of
            `divisibility`. Sat markets use D=10000 (10000 msat = 10 sats); USD markets
            use D=1000 (1000 cents = $10.00). The whole-share face value is D.
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
          default: GTC
        clientOrderId:
          type: string
          description: Client-supplied idempotency key scoped to the authenticated pubkey and condition.
        comment:
          oneOf:
            - $ref: '#/components/schemas/NostrKind1Event'
            - type: 'null'
          description: >
            Optional signed Nostr kind-1 event to index as a verified trade
            comment once this order produces a fill. The event pubkey must
            match the NIP-98 submitter and include an `r` tag for the market
            detail URL.

    NostrKind1Event:
      type: object
      required:
        - id
        - pubkey
        - createdAt
        - kind
        - tags
        - content
        - sig
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        pubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdAt:
          type: integer
          format: int64
          description: NIP-01 created_at Unix timestamp.
        kind:
          type: integer
          enum:
            - 1
        tags:
          type: array
          maxItems: 16
          items:
            type: array
            items:
              type: string
        content:
          type: string
          maxLength: 280
        sig:
          type: string
          pattern: '^[0-9a-f]{128}$'

    OrderStatusResponse:
      type: object
      required:
        - orderId
        - marketId
        - status
        - remainingAmountSubunits
        - filledAmountSubunits
        - fills
        - tokenSide
        - baseAsset
        - divisibility
      properties:
        orderId:
          type: string
          format: uuid
          description: The order's unique identifier.
        marketId:
          type: string
          description: The market this order belongs to.
        status:
          type: string
          description: >
            One of: "resting" (on book, unmatched), "matched" (reserved for
            atomic-swap settlement), "partially_filled", "filled",
            "cancelled", "failed".
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        filledAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
          description: >
            Conditional-token face amount already consumed by committed fills
            or currently matched atomic-swap sessions. A provisional mint match
            is exposed here before final settlement so clients can notify
            makers and start the atomic-swap handshake.
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: >
            All fills and active or terminal atomic-swap sessions produced
            against this order so far.
        tradeId:
          type: string
          format: uuid
          nullable: true
          description: >
            Pending atomic-swap trade id when status is `matched` and the
            engine is waiting for ephemeral pubkey submission.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Deadline for pending ephemeral pubkey submission.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        baseAsset:
          allOf:
            - $ref: '#/components/schemas/BaseAsset'
          default: sat
          description: Base asset context for amount and price fields.
        divisibility:
          type: integer
          format: int32
          minimum: 2
          default: 10000
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).

    RestingOrderResponse:
      type: object
      required:
        - orderId
        - marketId
        - outcomeId
        - side
        - price
        - remainingAmountSubunits
        - amountSubunits
        - timeInForce
        - placedAt
        - tokenSide
        - baseAsset
        - divisibility
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned by the matching engine.
        marketId:
          type: string
          description: The market this order belongs to.
        outcomeId:
          type: string
          description: The primitive route outcome this order trades against.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        placedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        baseAsset:
          allOf:
            - $ref: '#/components/schemas/BaseAsset'
          default: sat
          description: Base asset context for amount and price fields.
        divisibility:
          type: integer
          format: int32
          minimum: 2
          default: 10000
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).

    ListRestingOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/RestingOrderResponse'

    OrderEntry:
      type: object
      required:
        - orderId
        - marketId
        - conditionId
        - side
        - price
        - amountSubunits
        - remainingAmountSubunits
        - tokenSide
        - status
        - placedAt
      properties:
        orderId:
          type: string
          format: uuid
        marketId:
          type: string
        conditionId:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        status:
          type: string
          enum: [Resting, Filled, Cancelled, Matched]
        placedAt:
          type: string
          format: date-time
        filledAt:
          type: string
          format: date-time
          nullable: true
        tradeId:
          type: string
          format: uuid
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        pubkeySubmitted:
          type: boolean
          nullable: true
        clientOrderId:
          type: string
          nullable: true

    ListMyOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderEntry'
        nextCursor:
          type: string
          nullable: true

    SubmitOrderResponse:
      type: object
      required:
        - orderId
        - status
        - remainingAmountSubunits
        - fills
        - pendingPubkeySubmissions
        - baseAsset
        - divisibility
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned to this order.
        status:
          type: string
          description: >
            One of: "filled", "matched" (reserved for atomic-swap
            settlement), "partially_filled", "resting", "cancelled",
            "failed".
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: List of fills produced by this order. Empty if no matches.
        pendingPubkeySubmissions:
          type: array
          items:
            $ref: '#/components/schemas/PendingPubkeySubmission'
        baseAsset:
          allOf:
            - $ref: '#/components/schemas/BaseAsset'
          default: sat
          description: Base asset context for amount and price fields.
        divisibility:
          type: integer
          format: int32
          minimum: 2
          default: 10000
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).

    BatchSubmitOrdersRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchSubmitOrderRequestItem'

    PendingPubkeySubmission:
      type: object
      required:
        - tradeId
        - role
        - fillAmount
        - deadline
      properties:
        tradeId:
          type: string
          format: uuid
        role:
          type: string
          enum: [maker, taker]
        fillAmount:
          $ref: '#/components/schemas/CollateralSubunits'
        deadline:
          type: string
          format: date-time

    SubmitEphemeralPubkeyRequest:
      type: object
      required:
        - ephemeralPubkey
      properties:
        ephemeralPubkey:
          type: string
          description: 33-byte compressed secp256k1 public key as lowercase hex.
          pattern: '^(02|03)[0-9a-fA-F]{64}$'

    SubmitEphemeralPubkeyResponse:
      type: object
      required:
        - tradeId
        - role
        - bothReceived
      properties:
        tradeId:
          type: string
          format: uuid
        role:
          type: string
          enum: [maker, taker]
        bothReceived:
          type: boolean

    BatchSubmitOrderRequestItem:
      type: object
      required:
        - marketId
        - outcomeId
        - tokenSide
        - side
        - price
        - amountSubunits
        - clientOrderId
      properties:
        clientOrderId:
          type: string
          description: Client-supplied idempotency key scoped to the authenticated pubkey and condition.
        marketId:
          type: string
          description: Visible market id for this item. Must belong to the route conditionId.
        outcomeId:
          type: string
          description: Primitive outcome segment for marketId.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
          default: GTC
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time

    BatchSubmitOrdersResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchSubmitOrderResult'

    BatchSubmitOrderResult:
      type: object
      required:
        - requestIndex
        - success
        - marketId
        - status
        - remainingAmountSubunits
        - fills
        - baseAsset
        - divisibility
      properties:
        requestIndex:
          type: integer
          format: int32
          minimum: 0
        clientOrderId:
          type:
            - string
            - 'null'
        success:
          type: boolean
        marketId:
          type: string
        orderId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
        pendingPubkeySubmissions:
          type: array
          items:
            $ref: '#/components/schemas/PendingPubkeySubmission'
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          format: int32
          minimum: 2
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).
        errorCode:
          oneOf:
            - $ref: '#/components/schemas/BatchSubmitOrderErrorCode'
            - type: 'null'
        errorMessage:
          type:
            - string
            - 'null'

    BatchSubmitOrderErrorCode:
      type: string
      enum:
        - invalidMarket
        - invalidOutcome
        - invalidTokenSide
        - invalidSide
        - invalidPrice
        - invalidAmount
        - invalidTimeInForce
        - duplicateClientOrderId
        - unsupportedOrder
        - bookRejected

    BatchCancelOrdersRequest:
      type: object
      required:
        - orderIds
      properties:
        orderIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid

    BatchCancelOrdersResponse:
      type: object
      required:
        - canceled
        - notCanceled
      properties:
        canceled:
          type: array
          items:
            type: string
            format: uuid
        notCanceled:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BatchCancelOrderFailure'

    BatchCancelOrderFailure:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          $ref: '#/components/schemas/BatchCancelOrderErrorCode'
        errorMessage:
          type: string

    BatchCancelOrderErrorCode:
      type: string
      enum:
        - notFoundOrNotActiveOrNotAuthorized
        - duplicateOrderId
        - invalidOrderId
        - bookRejected

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/CollateralSubunits'
      description: A single price level in the order book depth.

    OrderBookSnapshot:
      type: object
      description: >
        Order book snapshot for market-detail rendering. When `depthLimit` is
        present, `bids` and `asks` contain at most that many top executable
        price levels per side; clients must not treat the snapshot as full
        depth.
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          oneOf:
            - type: integer
            - type: 'null'
          description: Difference between best ask and best bid. Null if either side is empty.
        depthLimit:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: >
            Maximum number of top price levels included per side. Null or absent
            means the producer did not declare whether the snapshot is bounded.

    MarketStatusChanged:
      type: object
      description: >
        Lifecycle-change notification pushed over the market hub when a
        condition's market transitions state (e.g. open -> closed). Sent to
        every per-outcome market group of the condition. Carries only
        wire-visible, public lifecycle data.
      required:
        - conditionId
        - state
      properties:
        conditionId:
          type: string
          description: The condition identifier whose lifecycle changed.
        state:
          type: string
          enum: [open, closed]
          description: >
            New engine-side lifecycle state. `open` accepts new orders;
            `closed` does not.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Engine-side close timestamp. Null unless the new state is `closed`.
        finalOutcome:
          type: string
          nullable: true
          description: >
            Winning outcome known to the engine after an oracle attestation
            close. Null for deadline-only closes or non-resolving transitions.

    CreateMarketOutcome:
      type: object
      required:
        - name
        - probability
      properties:
        name:
          type: string
          description: Outcome label (e.g. "Yes", "Alice").
        probability:
          type: integer
          minimum: 1
          maximum: 99
          description: Initial implied probability for this outcome [1, 99].

    CreateMarketRequest:
      type: object
      description: >
        JSON payload embedded in the multipart `metadata` field of the
        createMarket endpoint.
      required:
        - title
        - description
        - outcomes
      properties:
        title:
          type: string
          description: Human-readable market title.
        description:
          type: string
          description: Detailed market description.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/CreateMarketOutcome'
          minItems: 2
          description: The outcomes for the market (at least 2).
        outcomeType:
          type: string
          enum: [yesno, categorical, numeric]
          description: >
            Market outcome type. Numeric creation is disabled until finite-bin
            metadata is supported end-to-end.
        liquiditySats:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >
            Deprecated pre-create liquidity field. Market-maker funding is
            collected after creation through the funding flow; create requests
            should send `0`.
        baseAsset:
          allOf:
            - $ref: '#/components/schemas/BaseAsset'
          default: sat
          description: >
            Immutable market base asset. Accepted values: `sat` and `usd`.
            `jpy` is reserved.
        categoryTags:
          type: array
          items:
            type: string
          description: Optional category tags for the market.
        oracleAnnouncementHex:
          type: string
          nullable: true
          description: >
            Hex-encoded DLC oracle announcement TLV registered with the mint
            for this condition. The engine persists its oracle pubkey, DLC
            event id, and maturity time so direct oracle attestations can
            close the market.

    CreateMarketResponse:
      type: object
      required:
        - conditionId
        - marketsCreated
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered for.
        marketsCreated:
          type: array
          items:
            type: string
          description: >
            List of per-outcome market IDs created
            (format: "{conditionId}-{outcomeName}").
        thumbnailUrl:
          oneOf:
            - type: string
            - type: 'null'
          description: URL to the uploaded thumbnail, or null if none was provided.
        divisibility:
          type: integer
          format: int32
          minimum: 2
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).

    MarketPriceHistoryPoint:
      type: object
      required:
        - timestamp
        - price
        - volumeSubunits
        - source
      properties:
        timestamp:
          type: string
          format: date-time
        price:
          type: integer
          minimum: 1
          description: >
            Market price numerator `k`. Valid range is `1 <= k <= D - 1`,
            where `D` is the market's immutable `divisibility`. Current markets
            use D=10000 (0.01% price precision).
        volumeSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Volume represented in the market's collateral/share subunits.
            Initial anchor points always carry zero volume.
        source:
          type: string
          enum: [initial, fill]
          description: >
            `initial` is the creator-probability anchor and is clamped to the
            selected timeframe boundary when used as carry-forward context.
            `fill` is a settlement-committed trade tick inside the selected
            timeframe.

    MarketOutcomePriceHistory:
      type: object
      required:
        - outcomeId
        - data
      properties:
        outcomeId:
          type: string
          description: Primitive outcome id. Compound outcome ids are not returned.
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketPriceHistoryPoint'

    MarketPriceHistoryResponse:
      type: object
      required:
        - conditionId
        - timeframe
        - outcomes
      properties:
        conditionId:
          type: string
        timeframe:
          type: string
          enum:
            - 1h
            - 24h
            - 7d
            - 30d
            - all
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MarketOutcomePriceHistory'

    MarketComment:
      type: object
      required:
        - commentId
        - content
        - createdAt
        - authorPubkey
      properties:
        commentId:
          type: string
          format: uuid
          description: Opaque stable comment identifier.
        content:
          type: string
          maxLength: 280
        createdAt:
          type: string
          format: date-time
          description: Timestamp from the signed Nostr kind-1 comment event.
        authorPubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Nostr pubkey that signed the comment.

    MarketCommentsResponse:
      type: object
      required:
        - conditionId
        - comments
      properties:
        conditionId:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/MarketComment'

    SwapFailureKind:
      type: string
      enum:
        - PartialLockHeld
        - InsufficientInventory
        - MintError
        - EngineRejected

    SwapFailure:
      type: object
      required:
        - kind
        - detail
      properties:
        kind:
          $ref: '#/components/schemas/SwapFailureKind'
        refundLocktime:
          type: integer
          format: int64
          description: Unix seconds; present when kind is PartialLockHeld.
        affectedKeysets:
          type: array
          items:
            type: string
          description: Primitive outcome/keyset legs affected by a partial lock.
        detail:
          type: string
          description: Local diagnostic detail; redact from telemetry.

    LiquidityStateResponse:
      type: object
      required:
        - marketId
        - reserveA
        - reserveB
        - impliedProbability
        - baseAsset
        - divisibility
        - restingOrderLiquiditySubunits
        - completeSetLiquiditySubunits
        - totalLiquiditySubunits
        - activeOrders
      properties:
        marketId:
          type: string
        reserveA:
          type: integer
          format: int64
        reserveB:
          type: integer
          format: int64
        impliedProbability:
          type: integer
          minimum: 1
          maximum: 99
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).
        restingOrderLiquiditySubunits:
          type: integer
          format: int64
          description: Liquidity represented by currently resting bot orders, in market-base subunits.
        completeSetLiquiditySubunits:
          type: integer
          format: int64
          description: Conservative value of free complete-set inventory, in market-base subunits.
        totalLiquiditySubunits:
          type: integer
          format: int64
          description: Total public liquidity in market-base subunits.
        activeOrders:
          type: integer
          description: Number of active liquidity orders.

    MarketMetadataSnapshot:
      type: object
      required:
        - marketId
        - totalVolumeSubunits
        - totalTrades
        - totalLiquiditySubunits
      properties:
        marketId:
          type: string
          description: The market ID.
        totalVolumeSubunits:
          type: integer
          format: int64
          description: Total trading volume in market collateral subunits across all fills.
        totalTrades:
          type: integer
          description: Total number of fills (trades) executed.
        totalLiquiditySubunits:
          type: integer
          format: int64
          description: Total liquidity deposited in market collateral subunits.

    CreatorMarketEntry:
      type: object
      required:
        - conditionId
        - totalVolumeSubunits
        - createdAt
        - state
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered under.
        totalVolumeSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Aggregated trading volume in market collateral subunits across every per-outcome
            market belonging to this condition.
        createdAt:
          type: string
          format: date-time
          description: When this market was registered with the matching engine.
        state:
          type: string
          enum:
            - open
            - closed
          description: >
            Engine-side lifecycle state. `open` accepts new orders; `closed`
            does not.

    CreatorMarketsResponse:
      type: object
      required:
        - pubkey
        - markets
      properties:
        pubkey:
          type: string
          description: The creator pubkey this response belongs to (echoed from the path).
        markets:
          type: array
          items:
            $ref: '#/components/schemas/CreatorMarketEntry'
          description: >
            Markets created by this pubkey. May be empty if the creator has
            not registered any markets yet.

    DepositState:
      type: string
      enum:
        - requested
        - paid
        - credited
        - failed
      description: >
        Lifecycle state of a single deposit. `requested` → ecash submission
        accepted, awaiting proof verification. `paid` → payment
        confirmed and crediting is in progress. `credited` → the market account
        was credited (terminal-success and the only state that authorizes a
        client to delete the submitted proofs). `failed` → the latest attempt
        failed; an ecash client may retry the exact same deposit id, normalized
        request, and token so recovery can continue without double-crediting.

    DepositMethod:
      type: string
      enum:
        - ecash
      description: Deposit payment method. The current protocol accepts ecash only.

    RequestEcashDepositRequest:
      type: object
      required:
        - depositId
        - accountSubject
        - amountSubunits
        - proofsToken
        - mintUrl
        - unit
        - divisibility
      properties:
        accountSubject:
          type: string
          minLength: 1
          maxLength: 512
          description: Scheme-neutral authenticated account subject bound to this exact deposit.
        depositId:
          type: string
          format: uuid
          description: >
            Client-generated idempotency identifier. Retries must reuse this
            identifier with the exact same normalized request and ecash token.
        amountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          description: >
            Asserted value of the supplied ecash proofs in
            market-collateral base subunits. The engine derives the unit from
            the registered market.
        unit:
          type: string
          enum:
            - sat
            - msat
            - usd
          description: Canonical Cashu token unit bound to the supplied proofs.
        divisibility:
          type: integer
          format: int32
          minimum: 2
          description: >
            Exact market price divisibility associated with the supplied unit.
            It must match the registered market's effective divisibility.
        proofsToken:
          type: string
          description: >
            Opaque ecash token (Cashu V4 token blob). Proofs and amount are
            verified before crediting.
        mintUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Canonical HTTPS Cashu mint URL bound to the supplied proofs.
        creatorPubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Nostr public key (hex) of the market creator
        fundAmm:
          type: boolean
          default: false
          description: Fund the automated market-maker for this market. The deposit becomes the bot quoting budget and is NOT withdrawable. If the market resolves, any residual budget becomes operator income.

    RequestEcashDepositResponse:
      type: object
      required:
        - depositId
        - state
      properties:
        depositId:
          type: string
          format: uuid
          description: Identifier for polling the deposit's lifecycle state.
        state:
          $ref: '#/components/schemas/DepositState'

    ParticipationScoreResponse:
      type: object
      required:
        - accountSubject
        - balance
        - purchasedTotal
        - consumedTotal
        - penaltyTotal
        - matchDebitScore
        - enabled
      properties:
        accountSubject:
          type: string
          minLength: 1
          maxLength: 512
          description: Scheme-agnostic authenticated account identifier whose Score is returned.
        balance:
          type: integer
          format: int64
          description: Current participation Score balance. May be negative after soft match/penalty debits.
        purchasedTotal:
          type: integer
          format: int64
          minimum: 0
          description: Total Score purchased by this account.
        consumedTotal:
          type: integer
          format: int64
          minimum: 0
          description: Total Score consumed by successful match debits.
        penaltyTotal:
          type: integer
          format: int64
          minimum: 0
          description: Total Score consumed by settlement-negligence penalties.
        matchDebitScore:
          type: integer
          format: int64
          minimum: 1
          description: Configured Score debit charged to the taker when a match lands.
        enabled:
          type: boolean
          description: Whether match-time Score debit is enabled by the engine.

    ParticipationScorePaymentStatusResponse:
      type: object
      required:
        - schemaVersion
        - paymentId
        - status
        - accountSubject
        - recipientKind
        - purpose
        - destinationId
        - mintUrl
        - unit
        - amountSats
        - tokenDigest
        - encodedTokenBytes
        - receiptOperationId
        - receivedAt
        - creditedScore
        - businessEventId
        - creditedAt
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [credited]
        accountSubject:
          type: string
          minLength: 1
          maxLength: 512
        recipientKind:
          type: string
          enum: [matching-engine]
        purpose:
          type: string
          enum: [participation-score]
        destinationId:
          type: string
          enum: [participation-score]
        mintUrl:
          type: string
          format: uri
        unit:
          type: string
          enum: [sat]
        amountSats:
          type: integer
          format: int64
          minimum: 1
        creditedScore:
          type: integer
          format: int64
          minimum: 1
        tokenDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        encodedTokenBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 65536
        receiptOperationId:
          type: string
          minLength: 50
          maxLength: 50
          pattern: '^score-receipt/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        receivedAt:
          type: string
          format: date-time
        businessEventId:
          type: string
          format: uuid
        creditedAt:
          type: string
          format: date-time

    PayParticipationScoreEcashRequest:
      type: object
      required:
        - accountSubject
        - amountSats
        - proofsToken
      properties:
        accountSubject:
          type: string
          minLength: 1
          maxLength: 512
          description: Scheme-neutral authenticated account subject bound to this exact payment.
        amountSats:
          allOf:
            - $ref: '#/components/schemas/Sats'
          minimum: 1
          description: Exact sat amount carried by the supplied regular ecash token.
        proofsToken:
          type: string
          description: Opaque Cashu token paid as a non-refundable Engine fee.
        paymentId:
          type: string
          format: uuid
          description: Optional caller-supplied idempotency id for retrying the same ecash payment.

    PayParticipationScoreEcashResponse:
      type: object
      required:
        - paymentId
        - status
        - amountSats
      properties:
        paymentId:
          type: string
          format: uuid
          description: Idempotency id assigned to this Score payment.
        status:
          type: string
          enum:
            - pending
            - credited
          description: Durable payment state.
        amountSats:
          allOf:
            - $ref: '#/components/schemas/Sats'
          minimum: 1
          description: Ecash amount accepted as engine fee.
        creditedScore:
          type: integer
          format: int64
          minimum: 1
          description: Score credited for this payment.
        creditedAt:
          type: string
          format: date-time
          description: Time wallet-service accepted and credited the engine-fee payment.

    GetDepositResponseDto:
      type: object
      required:
        - schemaVersion
        - depositId
        - conditionId
        - accountSubject
        - recipientKind
        - purpose
        - destinationId
        - mintUrl
        - unit
        - creditPolicy
        - productBinding
        - tokenDigest
        - encodedTokenBytes
        - receiptOperationId
        - receivedAt
        - state
        - method
        - amountSubunits
        - creditedAmountSubunits
        - receiveFeeAmountSubunits
        - businessEventId
        - creditedAt
        - requestedAt
        - updatedAt
        - failureReason
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        depositId:
          type: string
          format: uuid
        conditionId:
          type: string
          description: Condition the deposit funds.
        accountSubject:
          type: string
          minLength: 1
          maxLength: 512
        recipientKind:
          type: string
          enum:
            - matching-engine
        purpose:
          type: string
          enum:
            - market-funding
        destinationId:
          type: string
          description: Exact condition id receiving this market funding.
        mintUrl:
          type: string
          format: uri
          maxLength: 2048
        unit:
          type: string
          enum:
            - sat
            - msat
            - usd
        creditPolicy:
          type: string
          enum:
            - net-of-receive-fee
        productBinding:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 binding of the destination-specific market-funding product fields.
        tokenDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        encodedTokenBytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 65536
        receiptOperationId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        receivedAt:
          type: string
          format: date-time
          nullable: true
        state:
          $ref: '#/components/schemas/DepositState'
        method:
          $ref: '#/components/schemas/DepositMethod'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
          description: Immutable gross amount asserted by the original request.
        creditedAmountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          nullable: true
          description: >
            Actual redeemed proof value credited after mint input fees. Null
            until the deposit reaches credited state and never greater than
            amountSubunits.
        receiveFeeAmountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          nullable: true
          description: Requested amount minus credited amount after mint fees.
        businessEventId:
          type: string
          nullable: true
          maxLength: 512
        creditedAt:
          type: string
          format: date-time
          nullable: true
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Most recent state-change timestamp.
        failureReason:
          type: string
          nullable: true
          description: Populated only when `state == Failed`.

    MarketCatalogueEntry:
      type: object
      required:
        - conditionId
        - outcomes
        - state
        - createdAt
        - volume24hSubunits
        - volume30dSubunits
        - liquiditySubunits
        - ammBotBudgetSubunits
        - volumeLifetimeSubunits
        - categoryTags
        - lastSuccessfulRefreshAt
        - baseAsset
        - divisibility
        - initialProbabilities
      properties:
        conditionId:
          type: string
          description: >
            The condition identifier (hex string derived from the oracle
            announcement). Stable identifier for the market.
        outcomes:
          type: array
          description: >
            Outcome names sourced from the mintd condition snapshot. Singleton
            outcome books use `marketId = "{conditionId}-{outcomeName}"`;
            the one-vs-rest complement is selected on order submission with
            `tokenSide = "Complement"` rather than a compound public market ID.
          items:
            type: string
        title:
          type: string
          nullable: true
          description: >
            Optional human-readable title from market registration. Null when
            the creator did not supply one.
        description:
          type: string
          nullable: true
          description: >
            Detailed market description supplied by the creator at
            registration time. Market detail pages render this as the
            resolution criteria text.
        thumbnailUrl:
          type: string
          nullable: true
          description: >
            Optional thumbnail URL. Null when no thumbnail was uploaded.
        creatorPubkey:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
          description: >
            Creator's Nostr pubkey (64-char lowercase hex), captured at
            registration time via NIP-98. Null on legacy markets that
            predate creator tracking.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: >
            Oracle attestation deadline carried from the mintd condition
            snapshot. The market auto-closes at this instant when the kind-89
            attestation has not yet been observed.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Engine-side close timestamp. Null while the market is open. Closed
            market detail pages use this value as the resolution date; deadline
            remains the scheduled oracle maturity time.
        finalOutcome:
          type: string
          nullable: true
          description: >
            Winning outcome known to the engine after an oracle attestation
            close. Null for deadline-only closes or markets that have not yet
            resolved.
        state:
          type: string
          enum: [open, closed]
          description: >
            Engine-side lifecycle state. `open` accepts new orders; `closed`
            does not. Source of truth is the matching engine's lifecycle state,
            NOT mintd's attestation status.
        createdAt:
          type: string
          format: date-time
          description: >
            When the market was registered with the matching engine.
        volume24hSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Trading volume over the last 24 hours in the market collateral's
            base subunits: msat for sat markets, cents (`usd`) for USD markets.
            Drives the `Trending` sort dimension.
        volume30dSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Trading volume over the last 30 days in the market collateral's
            base subunits: msat for sat markets, cents (`usd`) for USD markets.
            Drives the `Popular` sort dimension.
        liquiditySubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Total face amount of currently-resting orders across the market's
            order books, denominated in the market collateral's base subunits:
            msat for sat markets, cents (`usd`) for USD markets.
        ammBotBudgetSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Static initial budget deposited to the LMSR bot at funding time,
            denominated in the market collateral's base subunits (msat for sat
            markets, cents for USD markets). Operator-owned, non-withdrawable,
            immutable after funding (ADR-024 §2 P46 amendment). Not a live
            residual and not orderbook depth.
        volumeLifetimeSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Cumulative settled collateral face amount of all fills in the
            market's history.
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          format: int32
          minimum: 2
          description: >
            Immutable price denominator `D`, server-determined. Enum markets
            use per-market D: sat markets use D=10000 (0.01% price precision,
            one whole share = 10000 msat = 10 sats); USD markets use D=1000
            (0.1% price precision, one whole share = 1000 cents = $10.00).
        lastTradedPrice:
          type: number
          nullable: true
          description: >
            Most recent execution price as a decimal ratio in `[0, 1]`, null
            if the market has never traded. Runtime order, fill, orderbook, and
            price-history price fields use integer numerators against the
            market's `divisibility`; this catalogue summary keeps the legacy
            ratio form for sorting/display compatibility.
        initialProbabilities:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 1
            maximum: 99
          description: >
            Creator-specified registration-time probability per atomic outcome,
            expressed as integer percentages that sum to 100. Clients use this
            as the default market price before any trade has established a live
            last-traded price.
        categoryTags:
          type: array
          items:
            type: string
          description: >
            Category tags supplied at market registration. Filterable via
            the `tag` query parameter.
        lastSuccessfulRefreshAt:
          type: string
          format: date-time
          description: >
            When the engine last successfully pulled the mintd condition
            snapshot used to populate this entry's mintd-sourced fields.
            Mirrored on every entry so callers can render staleness
            indicators per market without an additional request.

    MarketCatalogueResponse:
      type: object
      required:
        - markets
        - lastSuccessfulRefreshAt
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketCatalogueEntry'
          description: >
            Page of markets matching the supplied filters, ordered by the
            requested `sort` dimension. Empty when no markets match.
        nextCursor:
          type: string
          nullable: true
          description: >
            Opaque (HMAC-signed) pagination cursor for the next page. Null
            when this is the last page. Pass back as `?cursor=...` to
            continue.
        lastSuccessfulRefreshAt:
          type: string
          format: date-time
          description: >
            Top-level mirror of the mintd-mirror's most recent successful
            refresh time. Useful for rendering a single staleness banner
            covering the whole catalogue when the mintd poller has been
            failing.

    ProblemDetails:
      type: object
      description: >
        RFC 7807 problem details. The matching engine returns this shape on
        4xx and 5xx responses where additional context helps the caller
        recover.
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code generated for this occurrence.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying the specific occurrence.
