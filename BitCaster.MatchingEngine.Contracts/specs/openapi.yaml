openapi: 3.1.0
info:
  title: BitCaster Matching Engine API
  description: REST API for the BitCaster prediction market matching engine.
  version: 0.2.0
  license:
    name: MIT

servers:
  - url: http://localhost:5001
    description: Local development (via Aspire AppHost)

paths:
  /api/v1/markets/{conditionId}:
    post:
      operationId: createMarket
      summary: Register a new market on the matching engine
      security:
        - nip98: []
      description: >
        Validates the condition exists in the mint, creates market order books,
        and optionally stores a thumbnail.
        The authenticated pubkey from the NIP-98 header is recorded as the
        market creator — no creator field in the request body is needed.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
              properties:
                metadata:
                  type: string
                  description: >
                    JSON-encoded CreateMarketRequest object containing market
                    title, description, outcomes, liquidity, and category tags.
                thumbnail:
                  type: string
                  format: binary
                  description: Optional thumbnail image (JPEG, PNG, or WebP, max 5 MB).
      responses:
        '200':
          description: Market created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMarketResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication
        '409':
          description: Market already exists for this condition
          content:
            application/json:
              schema:
                type: string

  /api/v1/markets/{conditionId}/oracle-attestation:
    post:
      operationId: submitOracleAttestation
      summary: Submit a signed oracle attestation directly to the engine
      description: >
        Accepts a Nostr kind-89 DLC oracle attestation event and closes any
        open market identified by conditionId when the event and embedded
        kormir/rust-dlc attestation verify against that market's registered
        oracle. Nostr relay publication is optional: this endpoint is the
        direct closure path for bitCaster markets. The payload is
        self-authenticating, so no NIP-98 header is required.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OracleNostrEvent'
      responses:
        '200':
          description: >
            Attestation accepted. Result is "Closed", "AlreadyClosed", or
            "DuplicateReplay".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleAttestationResponse'
        '400':
          description: >
            The submitted event is not a valid kind-89 oracle attestation, or
            its signatures/payload do not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleAttestationResponse'
        '404':
          description: >
            The attestation verified, but no open market is registered for the
            attesting oracle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleAttestationResponse'

  /api/v1/markets/{conditionId}/price-history:
    get:
      operationId: getMarketPriceHistory
      summary: Fetch primitive outcome price history for a market
      description: >
        Returns primitive outcome price points grouped by primitive outcome id.
        A newly registered market includes an initial zero-volume anchor point
        (`source = initial`) sourced from the creator probabilities. Initial
        anchors act as a left-edge carry-forward value and are clamped to the
        requested timeframe boundary when needed; settled trade ticks
        (`source = fill`) are added only when settlement commits and are
        filtered to the requested timeframe. Compound outcome-set matches are
        projected only when settlement commits, and the response never uses
        compound outcome ids.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum:
              - 1h
              - 24h
              - 7d
              - 30d
              - all
            default: 7d
      responses:
        '200':
          description: Primitive outcome price history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPriceHistoryResponse'
        '400':
          description: Invalid condition id or timeframe

  /api/v1/markets/{conditionId}/comments:
    get:
      operationId: getMarketComments
      summary: Fetch verified trade comments for a market
      description: >
        Returns engine-indexed comments attached to orders in this condition
        after those orders have produced at least one settled fill. The
        response is condition-keyed and returns the public kind-1 author
        pubkey while intentionally omitting order ids, fill ids, ephemeral
        pubkeys, and counterparty ids.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: Verified market comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCommentsResponse'
        '400':
          description: Invalid condition id

  /api/v1/conditions/{conditionId}/attestation:
    get:
      operationId: getConditionAttestation
      summary: Fetch the verified oracle witness for a closed condition
      description: >
        Returns the oracle witness persisted when the engine closed the market
        from a verified DLC oracle attestation. Clients use this witness as
        input to the mint's `POST /v1/redeem_outcome` endpoint. The mint still
        verifies the witness before paying out; this endpoint is a convenience
        cache for already-closed bitCaster conditions, not the payout authority.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: Verified oracle witness for the resolved condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionAttestationResponse'
        '400':
          description: Invalid condition id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionAttestationProblem'
        '404':
          description: >
            Market not found, market not closed by oracle resolution, or no
            redeemable oracle witness is stored for the closed market.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionAttestationProblem'

  /api/v1/conditions/{conditionId}/orders/batch:
    post:
      operationId: batchSubmitOrders
      summary: Submit multiple orders for one condition
      security:
        - nip98: []
      description: >
        Applies current settlement-capability references in request order
        across visible books that share conditionId. The server loads every
        immutable order term from each durable DCB binding; the authenticated
        owner and route condition must exactly match the prebound intent.
        References are not bearer authority and foreign, stale, or non-current
        references fail closed. An exact retry by the same authenticated owner
        for the same order, reference, and fingerprint returns its prior
        accepted admission result even if the capability has since become
        selected or terminal. Each item returns an independent result;
        envelope, auth, closed-market, and rate-limit failures still use HTTP
        errors.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSubmitOrdersRequest'
      responses:
        '200':
          description: Per-item batch submit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitOrdersResponse'
        '400':
          description: >
            Malformed batch envelope or malformed condition path. A resolved
            per-item condition mismatch returns a `routeMismatch` failure
            result instead of HTTP 400.
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Condition not registered
        '409':
          description: Market is closed or batch conflicted with book state
        '429':
          description: Item-weighted rate limit exceeded

  /api/v1/conditions/{conditionId}/orders/cancel-batch:
    post:
      operationId: batchCancelOrders
      summary: Cancel multiple orders for one condition
      security:
        - nip98: []
      description: >
        Cancels order ids under conditionId with privacy-preserving notCanceled
        failures. The response does not disclose whether an uncanceled order
        exists but belongs to another user.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCancelOrdersRequest'
      responses:
        '200':
          description: Batch cancel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCancelOrdersResponse'
        '400':
          description: Invalid batch envelope
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Condition not registered
        '429':
          description: Item-weighted rate limit exceeded

  /api/v1/{marketId}/orders:
    get:
      operationId: listRestingOrders
      summary: List the authenticated user's resting orders
      security:
        - nip98: []
      description: >
        Returns live resting orders in this market owned by the authenticated
        user. Used by clients that need to rebuild local order-tracking state
        after a restart.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Resting orders owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRestingOrdersResponse'
        '401':
          description: Missing or invalid NIP-98 authentication

    post:
      operationId: submitOrder
      summary: Submit a new order
      security:
        - nip98: []
      description: >
        Submits the current settlement capability referenced by the request.
        The server loads every immutable order term from the durable DCB
        binding; the authenticated owner and route market must exactly match
        that prebound intent. The reference is not bearer authority and is
        rejected when it is foreign, stale, or no longer current. An exact
        retry by the same authenticated owner for the same order, reference,
        and fingerprint returns the prior accepted admission result even if
        the capability has since become selected or terminal.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: >
            Settlement capability is absent, belongs to another authenticated
            owner, or its binding digest does not match.
        '409':
          description: >
            Route market does not match the bound intent, or the capability is
            stale, expired, selected, or otherwise not current and no matching
            previously accepted admission exists. An exact accepted replay
            returns that prior result instead of this conflict.
        '503':
          description: Settlement capability authority is unavailable.

  /api/v1/orders/mine:
    get:
      operationId: listMyOrders
      summary: List authenticated user's orders for a condition
      security:
        - nip98: []
      description: >
        Returns the caller's live resting orders plus bounded recent order
        history for the requested condition. The conditionId query parameter
        is required to avoid global user-order scans.
      parameters:
        - name: conditionId
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Caller-owned orders for the condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMyOrdersResponse'
        '400':
          description: Missing or invalid conditionId
        '401':
          description: Missing or invalid NIP-98 authentication

  /api/v1/trades/{tradeId}/ephemeral-pubkey:
    post:
      operationId: submitTradeEphemeralPubkey
      summary: Submit match-time ephemeral pubkey for a pending trade
      security:
        - nip98: []
      description: >
        Submits the caller's compressed secp256k1 ephemeral pubkey for a
        pending matched trade. The conditionId query parameter identifies the
        condition-local order book that currently owns the pending match.
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: conditionId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEphemeralPubkeyRequest'
      responses:
        '200':
          description: Ephemeral pubkey accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEphemeralPubkeyResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Trade not found or caller is not a party
        '409':
          description: Pubkey already differs or submission deadline expired

  /api/v1/{marketId}/orders/{orderId}:
    get:
      operationId: getOrderStatus
      summary: Fetch the current state of an order
      security:
        - nip98: []
      description: >
        Returns the order's live status, remaining/filled amounts, and the
        list of fills produced so far. Clients poll this endpoint to observe
        async state changes (fills, cancellation, expiry) without holding an
        open connection. Only the order's owner (matching the authenticated
        pubkey) may query its status.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The order's unique identifier.
      responses:
        '200':
          description: Current order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Order not found

    delete:
      operationId: cancelOrder
      summary: Cancel an existing order
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the order to cancel.
      responses:
        '200':
          description: Order cancelled
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Order not found

  /api/v1/{marketId}/orders/{orderId}/continuation/decline:
    post:
      operationId: declineOrderContinuation
      summary: Decline one suspended residual continuation
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineOrderContinuationRequest'
      responses:
        '200':
          description: Continuation is durably declined. Exact replay is idempotent.
        '401':
          description: Missing or invalid authentication.
        '404':
          description: Order or continuation is absent.
        '409':
          description: Stale revision or continuation already consumed.

  /api/v1/{marketId}/orderbook:
    get:
      operationId: getOrderBook
      summary: Get the current order book snapshot
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookSnapshot'

  /api/v1/{marketId}/liquidity:
    get:
      operationId: getLiquidity
      summary: Get liquidity state
      description: Returns the current public liquidity state for a market.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current liquidity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityStateResponse'
        '404':
          description: No liquidity state for this market

  /api/v1/{marketId}/metadata:
    get:
      operationId: getMarketMetadata
      summary: Get market metadata
      description: >
        Returns aggregated metadata for a market including trading volume,
        trade count, unique trader count, and liquidity.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Market metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMetadataSnapshot'

  /api/v1/{conditionId}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Get the thumbnail image for a condition
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: The thumbnail image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: No thumbnail for this condition

  /api/v1/markets/{conditionId}/deposit/ecash:
    post:
      operationId: requestEcashDeposit
      summary: Submit an ecash payment for market liquidity
      security:
        - nip98: []
      description: >
        Submits an ecash deposit for asynchronous proof verification and
        crediting. Use the returned `depositId` to poll for state transitions
        via the GET endpoint.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEcashDepositRequest'
      responses:
        '200':
          description: Deposit recorded; verification proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEcashDepositResponse'
        '400':
          description: Validation error (e.g. malformed proofs token, non-positive amount)
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Market not found
        '429':
          description: Per-pubkey deposit-request rate limit exceeded

  /api/v1/markets/{conditionId}/deposit/{depositId}:
    get:
      operationId: getDepositStatus
      summary: Read the current state of a deposit
      description: >
        Polling-friendly read of a single deposit's lifecycle state. Bearer
        payment instruments (bolt11) and proof material are deliberately
        excluded from the response — they appear only in the original
        request response. Public; no authentication required.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
        - name: depositId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Deposit identifier returned by the request endpoint.
      responses:
        '200':
          description: Deposit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDepositResponseDto'
        '404':
          description: No deposit with this id for this condition

  /api/v1/participation-score:
    get:
      operationId: getParticipationScore
      summary: Read the authenticated user's participation Score
      security:
        - nip98: []
      description: >
        Returns the caller's non-withdrawable participation Score balance and
        current match-debit policy. Score is a sat-denominated engine-use fee
        balance, separate from market collateral units.
      responses:
        '200':
          description: Participation Score state for the authenticated pubkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationScoreResponse'
        '401':
          description: Missing or invalid NIP-98 authentication

  /api/v1/participation-score/ecash:
    post:
      operationId: payParticipationScoreEcash
      summary: Pay ecash to top up participation Score
      security:
        - nip98: []
      description: >
        Pays a regular sat ecash token into the global Engine fee account.
        The fee is non-refundable and credits participation Score for the
        authenticated Nostr pubkey. The supplied token amount must exactly
        match `amountSats`; this endpoint never credits a market account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayParticipationScoreEcashRequest'
      responses:
        '200':
          description: Ecash accepted and Score credited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayParticipationScoreEcashResponse'
        '400':
          description: Validation error (e.g. malformed token or non-positive amount)
        '401':
          description: Missing or invalid NIP-98 authentication
        '429':
          description: Per-pubkey payment-request rate limit exceeded
        '502':
          description: Wallet-service payment error

  /api/v1/creators/{pubkey}/markets:
    get:
      operationId: listCreatorMarkets
      summary: List markets created by a given Nostr pubkey
      description: >
        Returns every market whose creator (authenticated via NIP-98 at
        registration time) matches the supplied pubkey, along with aggregated
        volume data so the creator dashboard can render totals without
        additional round-trips.
      parameters:
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: Nostr pubkey (hex) of the market creator.
      responses:
        '200':
          description: List of markets created by this pubkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorMarketsResponse'

  /api/v1/markets/query:
    get:
      operationId: queryMarkets
      summary: Catalogue proxy — list markets with filters, sort, and pagination
      description: >
        Returns the public market catalogue with matching-engine market state,
        mint condition data, and trading summary fields. This is the read
        endpoint the markets list page (`/markets`) and discovery surfaces
        consume.

        Anonymous by default. NIP-98 is OPTIONAL — when present, the request
        is authenticated and routed to a higher per-pubkey rate-limit bucket;
        when absent, the per-IP bucket applies. Authentication does NOT change
        the response shape or visibility — every market visible to an anonymous
        caller is also visible to an authenticated caller and vice versa.

        The response combines condition metadata (`outcomes`, `creatorPubkey`,
        `deadline`, and oracle attestation/close metadata) with trading state
        (`state`, `volume*`, `lastTradedPrice`, and `createdAt`). A market
        missing either side of that public data is omitted from the catalogue
        until both are available.
      security:
        - {}
        - nip98: []
      parameters:
        - name: tag
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            uniqueItems: false
          style: form
          explode: true
          description: >
            Repeatable category tag filter (e.g. `?tag=politics&tag=tech`).
            A market matches when at least one of its category tags matches
            at least one supplied tag (OR semantics across the supplied tags).
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [Open, Closed, All]
            default: Open
          description: >
            State filter against the matching engine's lifecycle state.
            Default is `Open`. Use `All` to include both Open and Closed
            markets in a single response. The match is case-insensitive on
            the wire (`open` works the same as `Open`).
        - name: creator_pubkey
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: >
            Restrict the result to markets whose creator pubkey matches.
            64-character lowercase hex Nostr pubkey. Different from
            `/api/v1/creators/{pubkey}/markets` — that endpoint returns the
            creator-dashboard volume rollup; this filter returns the full
            catalogue response.
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of conditionIds to bulk-fetch (e.g.
            `?ids=abc,def,123`). Returns only the named markets that match the
            other filters. Capped at 100 ids per request — exceeding the cap
            is a 400.
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >
            Full-text market search query. When present, results are ordered by
            relevance. The active `tag`, `state`, `creator_pubkey`, and `ids`
            filters also constrain the search. Capped at 200 normalized
            characters.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [Trending, Popular, New]
            default: Trending
          description: >
            Sort dimension. `Trending` orders by 24h trading volume descending;
            `Popular` orders by 30d trading volume descending; `New` orders
            by RegisterMarket timestamp descending. Ties on the sort dimension
            break by `conditionId` ascending so paginated streams remain
            deterministic.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination token returned in `nextCursor` from a previous
            page. The engine HMAC-signs cursors before returning them and
            verifies the signature before reading the underlying boundary —
            tampered or unsigned cursors are 400. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: >
            Page size cap. Default 20, hard cap 50 — exceeding the cap is a
            400. Page sizes below 1 are also a 400.
      responses:
        '200':
          description: Paginated catalogue of markets matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCatalogueResponse'
        '400':
          description: >
            Invalid query parameters — typo'd `state`/`sort` value, malformed
            `creator_pubkey`, `ids` over the 100-cap, `page_size` outside
            `[1, 50]`, or a tampered/malformed `cursor`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: >
            NIP-98 token was supplied but rejected (e.g. expired, signature
            mismatch, body-payload mismatch). Anonymous callers do NOT see 401
            from this route.
        '429':
          description: >
            Rate limit exceeded. Anonymous callers share a per-IP bucket;
            NIP-98-authenticated callers have their own per-pubkey bucket
            with a higher permit ceiling. The engine returns this when the
            applicable bucket is empty.

  /api/v1/settlement-capabilities:
    post:
      operationId: createSettlementCapability
      summary: Validate and bind one range-settlement authorization
      security:
        - nip98: []
      description: >
        Stages one canonical NUT-CTF range-settlement artifact, validates its
        mint authority, reserves its exact input proofs, and binds it durably
        to the authenticated subject's order identity before returning. The
        artifact is a sensitive bearer capability containing conditioned proof
        secrets and public blinded outputs, but never refund private keys,
        output secrets, or blinding factors. A successful or
        response-uncertain attempt must be retried byte-identically. Once the
        key is durably associated with an artifact, changing any artifact or
        order-binding field fails closed. A definitive rejection before
        staging stores no key association.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementCapabilityRequest'
      responses:
        '200':
          description: Capability validated, input-reserved, and durably bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCapabilityResponse'
        '400':
          description: Malformed, noncanonical, expired, or unsupported artifact.
        '401':
          description: Missing or invalid authentication.
        '409':
          description: >
            Idempotency conflict, reused input proof, mismatched order binding,
            or capability lifecycle conflict.
        '413':
          description: Artifact or request exceeds the advertised byte/count limits.
        '429':
          description: Per-subject capability admission is saturated.
        '503':
          description: Mint validation or durable capability authority is unavailable.

  /api/v1/asset-monitoring/reports:
    post:
      operationId: submitAssetMonitoringReport
      summary: Submit one complete display-only asset holdings report
      security:
        - nip98: []
      description: >
        Accepts one complete best-effort holdings snapshot for the authenticated
        account and canonical wallet id. The engine does not verify proof
        ownership and does not accept a seed signature or backup state. An
        exact retry of the latest report returns no content. Reusing the latest
        report id with different content, or using an invalid interval or wallet
        lifecycle, returns a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetMonitoringReportRequest'
      responses:
        '204':
          description: Report accepted or exact latest-report retry accepted.
        '400':
          description: Malformed, noncanonical, or out-of-bound report field.
        '401':
          description: Missing or invalid authentication.
        '409':
          description: Latest-report idempotency or wallet interval lifecycle conflict.
        '413':
          description: Request exceeds the 1 MiB report limit.
        '429':
          description: Authenticated-subject report rate limit exceeded.

  /api/v1/asset-monitoring/summary:
    get:
      operationId: getAssetMonitoringSummary
      summary: Read the active wallet asset-monitoring summary
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/AssetMonitoringWalletId'
      responses:
        '200':
          description: Bounded active-wallet monitoring summary.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AssetMonitoringNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMonitoringSummaryResponse'
        '400':
          description: Malformed wallet id.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Missing or invalid authentication.
        '409':
          description: Wallet is not active for the authenticated account.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
        '503':
          description: The active event-store provider has no bounded monitoring reader.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/asset-monitoring/assets:
    get:
      operationId: getAssetMonitoringAssets
      summary: Read one page of active wallet monitored assets
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/AssetMonitoringWalletId'
        - name: pageSize
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Canonically ordered bounded active-wallet asset page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AssetMonitoringNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMonitoringAssetsResponse'
        '400':
          description: Malformed wallet id, page size, or cursor.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Missing or invalid authentication.
        '409':
          description: Wallet is not active for the authenticated account.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
        '503':
          description: The active event-store provider has no bounded monitoring reader.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/asset-monitoring/history:
    get:
      operationId: getAssetMonitoringHistory
      summary: Read bounded estimated active wallet value history
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/AssetMonitoringWalletId'
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [1D, 1W, 1M, ALL]
            default: 1D
      responses:
        '200':
          description: At most 300 deterministic value points from compact active-interval facts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AssetMonitoringNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMonitoringHistoryResponse'
        '400':
          description: Malformed wallet id or timeframe.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Missing or invalid authentication.
        '409':
          description: Wallet is not active for the authenticated account.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
        '503':
          description: The active event-store provider has no bounded monitoring reader.
          headers: { Cache-Control: { $ref: '#/components/headers/AssetMonitoringNoStore' } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/settlement-capabilities/policy:
    get:
      operationId: getSettlementCapabilityAdmissionPolicy
      summary: Read the current range-settlement admission policy
      security:
        - nip98: []
      description: >
        Returns the coordinator public key that every newly created bitCaster
        PAY_TO_UNLOCK authorization must bind. Clients fetch this authenticated
        policy before creating or reauthorizing a range operation. Historical
        operations retain their persisted coordinator key.
      responses:
        '200':
          description: Current coordinator-bound settlement admission policy.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
              description: The admission key must not be served from a cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCapabilityAdmissionPolicyResponse'
        '401':
          description: Missing or invalid authentication.
        '503':
          description: Settlement admission policy is unavailable.

  /api/v1/settlement-capabilities/{artifactId}:
    get:
      operationId: getSettlementCapability
      summary: Read one owned settlement-capability lifecycle
      security:
        - nip98: []
      description: >
        Returns lifecycle facts only when the capability belongs to the
        authenticated subject and the supplied binding digest matches. A
        reference or digest is not bearer authorization.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bindingDigest
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Sha256Digest'
      responses:
        '200':
          description: Owner-filtered capability lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCapabilityResponse'
        '401':
          description: Missing or invalid authentication.
        '404':
          description: Capability is absent, foreign, or has a different binding digest.

  /api/v1/settlement-capability-results/{resultId}:
    get:
      operationId: getSettlementCapabilityResult
      summary: Retrieve one owned settlement result envelope
      security:
        - nip98: []
      parameters:
        - name: resultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authenticated result envelope for the capability owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCapabilityResultResponse'
        '401':
          description: Missing or invalid authentication.
        '404':
          description: Result is absent or belongs to another subject.

  /api/v1/settlement-capability-results/by-operation:
    get:
      operationId: getSettlementCapabilityResultByOperation
      summary: Retrieve one owned result by durable SDK operation id
      security:
        - nip98: []
      parameters:
        - name: operationId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Authenticated result envelope for the capability owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCapabilityResultResponse'
        '401':
          description: Missing or invalid authentication.
        '404':
          description: Result is absent or belongs to another subject.

  /api/v1/settlement-capability-results/{resultId}/acknowledgement:
    post:
      operationId: acknowledgeSettlementCapabilityResult
      summary: Acknowledge durable local commit of a settlement result
      security:
        - nip98: []
      description: >
        Advances acknowledgement only after the owner has durably committed
        the exact recovered outputs and SDK operation transition. Repeating
        the same expected version is idempotent; stale or foreign authority
        fails closed.
      parameters:
        - name: resultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeSettlementCapabilityResultRequest'
      responses:
        '200':
          description: Result acknowledgement recorded or already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCapabilityResultResponse'
        '400':
          description: Invalid expected version.
        '401':
          description: Missing or invalid authentication.
        '404':
          description: Result is absent or belongs to another subject.
        '409':
          description: Result lifecycle version conflict.

components:
  securitySchemes:
    nip98:
      type: http
      scheme: Nostr
      description: >
        NIP-98 HTTP Auth. The client signs a Nostr kind-27235 event containing
        the request URL and HTTP method, then sends it as
        `Authorization: Nostr <base64-encoded-event>`. The server verifies the
        BIP-340 Schnorr signature and extracts the signer's pubkey as the
        authenticated identity. See https://github.com/nostr-protocol/nips/blob/master/98.md

  headers:
    AssetMonitoringNoStore:
      description: The authenticated private response must not be stored.
      schema:
        type: string
        enum: [no-store]

  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
      description: >
        The primitive outcome book to trade on, in the format
        "{conditionId}-{outcomeName}" (e.g. "deadbeef…abc-Alice"). Public
        market IDs never contain finite outcome-set separators such as "|";
        use SettlementOrderIntent.tokenSide during capability creation to
        choose the primitive outcome token or its one-vs-rest complement.
        Binary YES/NO markets expose only the YES route
        ("{conditionId}-YES"); NO is traded as tokenSide=Complement on that
        YES route, and "{conditionId}-NO" is not a valid market ID.

    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: string
      description: >
        The condition identifier (hex string derived from the oracle announcement).

    AssetMonitoringWalletId:
      name: walletId
      in: query
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      description: Canonical local durable wallet identifier.

  schemas:
    Sha256Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Canonical lowercase SHA-256 digest.

    AssetMonitoringUnit:
      type: string
      enum: [sat, msat]
      description: >
        Canonical Cashu unit for a monitored asset or its display base asset.

    AssetMonitoringAssetKind:
      type: string
      enum: [collateral, conditional]
      description: Canonical monitored-asset identity kind.

    AssetMonitoringAssetReference:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AssetMonitoringCollateralAssetReference'
        - $ref: '#/components/schemas/AssetMonitoringConditionalAssetReference'

    AssetMonitoringCollateralAssetReference:
      type: object
      additionalProperties: false
      required:
        - canonicalMintUrl
        - kind
        - cashuUnit
        - displayBaseAsset
      properties:
        canonicalMintUrl:
          type: string
          format: uri
          maxLength: 512
          description: Canonical mint URL. It has no trailing slash.
        kind:
          type: string
          enum: [collateral]
        cashuUnit:
          $ref: '#/components/schemas/AssetMonitoringUnit'
        displayBaseAsset:
          $ref: '#/components/schemas/AssetMonitoringUnit'

    AssetMonitoringConditionalAssetReference:
      type: object
      additionalProperties: false
      required:
        - canonicalMintUrl
        - kind
        - cashuUnit
        - displayBaseAsset
        - conditionId
        - parentConditionId
        - outcomeUniverseDigest
        - internalOutcomeSetId
      properties:
        canonicalMintUrl:
          type: string
          format: uri
          maxLength: 512
          description: Canonical mint URL. It has no trailing slash.
        kind:
          type: string
          enum: [conditional]
        cashuUnit:
          $ref: '#/components/schemas/AssetMonitoringUnit'
        displayBaseAsset:
          $ref: '#/components/schemas/AssetMonitoringUnit'
        conditionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[0-9A-Fa-f]+$'
        parentConditionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[0-9A-Fa-f]+$'
        outcomeUniverseDigest:
          $ref: '#/components/schemas/Sha256Digest'
        internalOutcomeSetId:
          type: string
          minLength: 1
          maxLength: 1024

    AssetMonitoringRecoveryCounterInterval:
      type: object
      additionalProperties: false
      required: [start, count]
      properties:
        start:
          type: integer
          format: int32
          minimum: 0
        count:
          type: integer
          format: int32
          minimum: 1

    AssetMonitoringRecoveryHint:
      type: object
      additionalProperties: false
      required: [keysetIds, counterIntervals]
      properties:
        keysetIds:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^(00[0-9a-f]{14}|0[12][0-9a-f]{64})$'
        counterIntervals:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AssetMonitoringRecoveryCounterInterval'

    AssetMonitoringReportedHolding:
      type: object
      additionalProperties: false
      required: [asset, availableSubunits, pendingOutgoingSubunits]
      properties:
        asset:
          $ref: '#/components/schemas/AssetMonitoringAssetReference'
        availableSubunits:
          type: integer
          format: int64
          minimum: 0
        pendingOutgoingSubunits:
          type: integer
          format: int64
          minimum: 0
        recoveryHint:
          oneOf:
            - $ref: '#/components/schemas/AssetMonitoringRecoveryHint'
            - type: 'null'

    AssetMonitoringReportRequest:
      type: object
      additionalProperties: false
      required: [walletId, reportId, startsNewInterval, holdings]
      properties:
        walletId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Canonical local durable wallet identifier.
        reportId:
          type: string
          format: uuid
          description: Client-generated report identifier for exact retry handling.
        startsNewInterval:
          type: boolean
          description: True for the first report and for a wallet switch.
        holdings:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AssetMonitoringReportedHolding'

    AssetMonitoringValuationStatus:
      type: string
      enum: [valued, unvalued]

    AssetMonitoringAssetResponse:
      type: object
      additionalProperties: false
      required: [asset, availableSubunits, pendingOutgoingSubunits, valuationStatus, recoveryHint]
      properties:
        asset: { $ref: '#/components/schemas/AssetMonitoringAssetReference' }
        availableSubunits: { type: integer, format: int64, minimum: 0 }
        pendingOutgoingSubunits: { type: integer, format: int64, minimum: 0 }
        availableValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }
        pendingOutgoingValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }
        estimatedValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }
        valuationStatus: { $ref: '#/components/schemas/AssetMonitoringValuationStatus' }
        recoveryHint:
          oneOf:
            - $ref: '#/components/schemas/AssetMonitoringRecoveryHint'
            - type: 'null'

    AssetMonitoringSummaryResponse:
      type: object
      additionalProperties: false
      required: [collateralUnit, availableValueMsat, pendingOutgoingValueMsat, estimatedTotalValueMsat, unvaluedAssetCount, unvaluedAvailableSubunits, unvaluedPendingOutgoingSubunits, valuationRevision, stale, incomplete, building]
      properties:
        collateralUnit: { type: string, enum: [msat] }
        availableValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }
        pendingOutgoingValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }
        estimatedTotalValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }
        unvaluedAssetCount: { type: integer, format: int32, minimum: 0 }
        unvaluedAvailableSubunits: { type: [integer, 'null'], format: int64, minimum: 0 }
        unvaluedPendingOutgoingSubunits: { type: [integer, 'null'], format: int64, minimum: 0 }
        asOf: { type: [string, 'null'], format: date-time }
        intervalRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        coverageBoundary: { type: [string, 'null'] }
        valuationRevision: { type: string, minLength: 1 }
        stale: { type: boolean }
        incomplete: { type: boolean }
        building: { type: boolean }

    AssetMonitoringAssetsResponse:
      type: object
      additionalProperties: false
      required: [assets, valuationRevision, stale, incomplete, building]
      properties:
        assets:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AssetMonitoringAssetResponse' }
        nextCursor: { type: [string, 'null'] }
        asOf: { type: [string, 'null'], format: date-time }
        intervalRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        coverageBoundary: { type: [string, 'null'] }
        valuationRevision: { type: string, minLength: 1 }
        stale: { type: boolean }
        incomplete: { type: boolean }
        building: { type: boolean }

    AssetMonitoringHistoryPointResponse:
      type: object
      additionalProperties: false
      required: [asOf, estimatedTotalValueMsat]
      properties:
        asOf: { type: string, format: date-time }
        estimatedTotalValueMsat: { type: [integer, 'null'], format: int64, minimum: 0 }

    AssetMonitoringHistoryResponse:
      type: object
      additionalProperties: false
      required: [timeframe, points, valuationRevision, stale, incomplete, building]
      properties:
        timeframe: { type: string, enum: [1D, 1W, 1M, ALL] }
        points:
          type: array
          maxItems: 300
          items: { $ref: '#/components/schemas/AssetMonitoringHistoryPointResponse' }
        asOf: { type: [string, 'null'], format: date-time }
        intervalRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        coverageBoundary: { type: [string, 'null'] }
        valuationRevision: { type: string, minLength: 1 }
        stale: { type: boolean }
        incomplete: { type: boolean }
        building: { type: boolean }

    SettlementCapabilityReference:
      type: object
      additionalProperties: false
      required:
        - artifactId
        - bindingDigest
      properties:
        artifactId:
          type: string
          format: uuid
        bindingDigest:
          $ref: '#/components/schemas/Sha256Digest'

    SettlementCapabilityState:
      type: string
      enum:
        - staged
        - bindingPending
        - bound
        - selected
        - uncertain
        - terminal
        - quarantined

    SettlementOrderContinuationReference:
      type: object
      additionalProperties: false
      required:
        - predecessorOrderId
        - settlementGroupId
        - settlementGroupRevision
        - continuationRevision
      properties:
        predecessorOrderId:
          type: string
          format: uuid
        settlementGroupId:
          type: string
          format: uuid
        settlementGroupRevision:
          type: integer
          format: int32
          minimum: 1
        continuationRevision:
          type: integer
          format: int64
          minimum: 1

    OrderContinuationState:
      type: object
      additionalProperties: false
      required:
        - settlementGroupId
        - settlementGroupRevision
        - revision
        - status
      properties:
        settlementGroupId:
          type: string
          format: uuid
        settlementGroupRevision:
          type: integer
          format: int32
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
            - open
            - consumed
            - declined

    DeclineOrderContinuationRequest:
      type: object
      additionalProperties: false
      required:
        - expectedContinuationRevision
      properties:
        expectedContinuationRevision:
          type: integer
          format: int64
          minimum: 1

    SettlementOrderIntent:
      type: object
      additionalProperties: false
      required:
        - outcomeId
        - tokenSide
        - side
        - price
        - amountSubunits
        - minimumFillAmountSubunits
        - baseAsset
        - collateralUnit
        - timeInForce
        - expiresAt
      description: >
        Immutable economic order terms authenticated by the settlement
        capability binding. Later order submission supplies only the resulting
        capability reference; the server loads these terms from the current
        durable DCB binding.
      properties:
        outcomeId:
          type: string
          minLength: 1
          maxLength: 191
          pattern: '^[^|]+$'
          description: >
            Primitive outcome segment of the top-level marketId. It must not
            contain a finite outcome-set separator such as "|".
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          minimum: 1
          description: >
            Conditional-token face amount in the market collateral sub-unit.
        minimumFillAmountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          minimum: 1
          description: >
            Minimum aggregate conditional-token face amount that this order
            accepts in one matching round. It must not exceed amountSubunits
            and must be a whole tradable unit for the market divisibility.
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: >
            Required explicit quote asset. No default is implied.
        collateralUnit:
          $ref: '#/components/schemas/CollateralUnit'
          description: >
            Required explicit collateral unit. No default is implied.
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
          description: >
            GTD requires a non-null expiresAt. GTC, FOK, and FAK forbid
            expiresAt.
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: >
            Non-null for GTD intent and exactly null for every other
            time-in-force value. Requiring the field gives the authenticated
            intent one canonical wire representation.

    CreateSettlementCapabilityRequest:
      type: object
      additionalProperties: false
      required:
        - stageIdempotencyKey
        - clientOrderId
        - marketId
        - orderIntent
        - continuation
        - artifact
      properties:
        stageIdempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Client-generated idempotency key for this exact artifact and order
            binding. It is scoped to the authenticated subject. Successful or
            response-uncertain attempts must retry the exact request; a
            definitive rejection before staging stores no key association.
        clientOrderId:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Stable client order identity used to derive the server order id.
            Reusing it with a different authorization fingerprint conflicts.
        marketId:
          type: string
          minLength: 66
          maxLength: 256
          pattern: '^[0-9a-f]{64}-[^|]+$'
          description: Primitive outcome market id in `{conditionId}-{outcomeName}` form.
        orderIntent:
          $ref: '#/components/schemas/SettlementOrderIntent'
          description: >
            Economic order terms to authenticate in the durable capability
            binding. Once the stage idempotency key is durably associated,
            reusing it with different terms conflicts.
        continuation:
          oneOf:
            - $ref: '#/components/schemas/SettlementOrderContinuationReference'
            - type: 'null'
          description: >
            Exactly null for an initial order. A fresh successor binds the
            confirmed predecessor continuation right and consumes it
            atomically when the capability is bound.
        artifact:
          type: string
          format: byte
          minLength: 4
          maxLength: 349528
          description: >
            Base64 encoding of at most 262144 canonical JSON bytes produced by
            the shared SDK settlement-capability artifact encoder.

    SettlementCapabilityResponse:
      type: object
      additionalProperties: false
      required:
        - reference
        - orderId
        - clientOrderId
        - marketId
        - artifactDigest
        - state
        - version
        - authorizationExpiresAt
        - stageExpiresAt
        - settlementGroup
      properties:
        reference:
          $ref: '#/components/schemas/SettlementCapabilityReference'
        orderId:
          type: string
          format: uuid
        clientOrderId:
          type: string
        marketId:
          type: string
        artifactDigest:
          $ref: '#/components/schemas/Sha256Digest'
        state:
          $ref: '#/components/schemas/SettlementCapabilityState'
        version:
          type: integer
          format: int64
          minimum: 0
        authorizationExpiresAt:
          type: string
          format: date-time
        stageExpiresAt:
          type: string
          format: date-time
        settlementGroup:
          oneOf:
            - $ref: '#/components/schemas/SettlementGroupSummary'
            - type: 'null'
          description: >
            Current or terminal group that selected this capability, or null
            before selection.

    SettlementCapabilityAdmissionPolicyResponse:
      type: object
      additionalProperties: false
      required:
        - coordinatorPubkey
      properties:
        coordinatorPubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          minLength: 64
          maxLength: 64
          description: >
            Current environment BIP-340 x-only coordinator public key. Every
            input proof in a newly admitted bitCaster PAY_TO_UNLOCK artifact
            must bind this exact key.

    SettlementCapabilityResultResponse:
      type: object
      additionalProperties: false
      required:
        - resultId
        - reference
        - operationId
        - requestDigest
        - envelopeDigest
        - envelope
        - createdAt
        - version
        - settlementGroup
      properties:
        resultId:
          type: string
          format: uuid
        reference:
          $ref: '#/components/schemas/SettlementCapabilityReference'
        operationId:
          type: string
          minLength: 1
          maxLength: 128
        requestDigest:
          $ref: '#/components/schemas/Sha256Digest'
        envelopeDigest:
          $ref: '#/components/schemas/Sha256Digest'
        envelope:
          type: string
          format: byte
          maxLength: 349528
          description: >
            Base64-encoded canonical owner result envelope. It contains the
            selected bitmap and mint signatures but no unblinding material.
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
            - string
            - 'null'
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        settlementGroup:
          $ref: '#/components/schemas/SettlementGroupSummary'
          description: Atomic group that produced this owner result envelope.

    AcknowledgeSettlementCapabilityResultRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0

    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    CollateralSubunits:
      type: integer
      format: int64
      minimum: 0
      description: >
        Product collateral subunits in msat (1/1000 sat). Wire amount =
        collateral subunits. Request fields enforce minimum 1 at validation;
        response fields (remainingAmountSubunits, filledAmountSubunits) may be
        0 for filled/cancelled orders.

    Probability:
      type: integer
      minimum: 1
      description: >
        Market price numerator `k`. Valid range is `1 <= k <= D - 1`, where
        `D` is the market's immutable `divisibility`. Immutable price
        denominator D is per-market: categorical markets use D=10000 (0.01%
        precision), while future numeric markets use D=1000000 (0.0001%
        precision).

    BaseAsset:
      type: string
      enum: [sat]
      description: >
        Product quote asset. The current product accepts only exact `sat`;
        product collateral is held in `msat`.

    CollateralUnit:
      type: string
      enum: [msat]
      description: >
        Product collateral unit. The current product accepts only exact
        `msat`; callers must provide it explicitly where required.

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell
      description: Direction of an order relative to the outcome token.

    TokenSide:
      type: string
      enum:
        - Outcome
        - Complement
      description: >
        Which token on the primitive outcome book is being traded. `Outcome`
        means the selected primitive outcome named by outcomeId; `Complement`
        means the one-vs-rest complement of that outcome.

        Note on binary YES/NO markets: only the YES route is public. Trade YES
        with tokenSide=Outcome on cond-YES, and trade NO with
        tokenSide=Complement on cond-YES. Categorical markets (3+ outcomes)
        also expose atomic outcome routes only; complement collections are
        accessed via TokenSide: Complement on the corresponding atomic route.

    OrderType:
      type: string
      enum:
        - Limit
        - Market
      description: Execution semantics of an order.

    TimeInForce:
      type: string
      enum:
        - GTC
        - FOK
        - FAK
        - GTD
      description: >
        Time-in-force policy. GTC = Good-Till-Cancel (rests on book),
        FOK = Fill-Or-Kill (reject if not fully filled),
        FAK = Fill-And-Kill (cancel remaining after partial fill), GTD =
        Good-Till-Date. GTD requires a non-null `expiresAt`; GTC, FOK, and FAK
        forbid `expiresAt`.

    OrderLifecycleStatus:
      type: string
      enum:
        - resting
        - matched
        - partially_filled
        - awaiting_authorization
        - filled
        - cancelled
        - expired
        - evicted_capacity
        - rejected_capacity
        - failed
      description: >
        Closed public order lifecycle. `awaiting_authorization` means an
        unfilled resting remainder is intentionally non-matchable until its
        owner durably binds a replacement one-shot range authorization.

    SettlementGroupStatus:
      type: string
      enum:
        - Prepared
        - SubmissionPending
        - Reconciling
        - Confirmed
        - DefinitivelyRejected
        - Refundable
        - ExpiredBeforeSubmission
      description: >
        Public atomic settlement-group lifecycle. `Prepared` is the bounded
        coalescing state. `SubmissionPending` means the group is frozen and its
        exact request authority was durably committed before mint I/O.

    SettlementGroupSummary:
      type: object
      additionalProperties: false
      required:
        - groupId
        - status
        - revision
        - coalescingDeadline
        - frozenAt
      properties:
        groupId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SettlementGroupStatus'
        revision:
          type: integer
          format: int32
          minimum: 0
        coalescingDeadline:
          type: string
          format: date-time
        frozenAt:
          type:
            - string
            - 'null'
          format: date-time
          description: >
            Null for `Prepared` and for `ExpiredBeforeSubmission`, which
            transitions directly from `Prepared` without mint submission.
            Non-null for every lifecycle path that reached
            `SubmissionPending`, and preserved through later transitions.

    MatchPath:
      type: string
      enum:
        - Complementary
        - Mint
      description: >
        How two orders were matched together. Terminology mirrors Polymarket
        CTF Exchange V2: `Complementary` pairs a Buy against a Sell of the same
        outcome (no split required); `Mint` pairs two Buys for complementary
        outcome sets and the maker supplies the complementary CTF side from
        exact inventory, primitive complement legs, or an at-match collateral
        split. The
        `Merge` path (Sell vs Sell) is not yet supported in bitCaster.

    FillStatus:
      type: string
      enum:
        - Matched
        - Filled
        - Failed
      description: >
        Lifecycle status of a fill-shaped order execution row. `Matched`
        means its atomic mint settlement group is not yet confirmed; `Filled`
        means settlement committed; `Failed` means the group was definitively
        rejected and this fill will not be retried.

    OracleNostrEvent:
      type: object
      required:
        - id
        - pubkey
        - createdAt
        - kind
        - tags
        - content
        - sig
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: NIP-01 event id of the kind-89 attestation.
        pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: X-only BIP-340/Nostr public key of the oracle.
        createdAt:
          type: integer
          format: int64
          description: NIP-01 created_at timestamp in Unix seconds.
        kind:
          type: integer
          enum:
            - 89
          description: Nostr event kind for DLC oracle attestations.
        tags:
          type: array
          description: NIP-01 tags committed into the event id. NIP-88 attestations include an e-tag pointing to the kind-88 announcement event id.
          items:
            type: array
            items:
              type: string
        content:
          type: string
          description: Base64-encoded DLC oracle_attestation payload.
        sig:
          type: string
          pattern: '^[0-9a-fA-F]{128}$'
          description: BIP-340 Schnorr signature over the NIP-01 event id.

    OracleAttestationResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - Closed
            - AlreadyClosed
            - DuplicateReplay
            - WrongKind
            - InvalidSignature
            - InvalidPayload
            - NoMatchingMarket
          description: Engine processing result for the submitted attestation.

    ConditionAttestationResponse:
      type: object
      required:
        - conditionId
        - attestedOutcome
        - oracleWitness
        - registeredAuthority
      properties:
        conditionId:
          type: string
          description: bitCaster condition id for the closed market.
        attestedOutcome:
          type: string
          description: The single outcome attested by the DLC oracle.
        oracleWitness:
          $ref: '#/components/schemas/OracleWitness'
        registeredAuthority:
          $ref: '#/components/schemas/RegisteredConditionAuthority'

    RegisteredConditionAuthority:
      type: object
      required:
        - eventId
        - outcomes
        - threshold
        - oracles
      properties:
        eventId:
          type: string
        outcomes:
          type: array
          minItems: 1
          items:
            type: string
        threshold:
          type: integer
          minimum: 1
        oracles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RegisteredConditionOracle'

    RegisteredConditionOracle:
      type: object
      required:
        - oraclePublicKey
        - noncePoint
        - announcementIdentity
      properties:
        oraclePublicKey:
          type: string
          pattern: '^[0-9a-f]{64}$'
        noncePoint:
          type: string
          pattern: '^[0-9a-f]{64}$'
        announcementIdentity:
          type: string
          pattern: '^[0-9a-f]{64}$'

    ConditionAttestationProblem:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - InvalidConditionId
            - MarketNotFound
            - AttestationNotAvailable

    OracleWitness:
      type: object
      required:
        - oracle_sigs
      properties:
        oracle_sigs:
          type: array
          items:
            $ref: '#/components/schemas/OracleWitnessSig'

    OracleWitnessSig:
      type: object
      required:
        - oracle_pubkey
        - oracle_sig
        - outcome
      properties:
        oracle_pubkey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: X-only BIP-340 oracle public key.
        oracle_sig:
          type: string
          pattern: '^[0-9a-fA-F]{128}$'
          description: Oracle signature over the attested outcome.
        outcome:
          type: string
          description: Outcome string signed by the oracle.

    Fill:
      type: object
      additionalProperties: false
      description: >
        One leg of a match: the taker's incoming order crossing a single maker.
        Canonical settlement amounts are carried by `quotePaymentSubunits`,
        `outcomeFaceAmountSubunits`, `baseAsset`, `divisibility`, and `tokenSide`.
        `amountSubunits` is the conditional-token face amount in market
        collateral subunits (msat).
        `quotePaymentSubunits + baseAsset + divisibility` is the authoritative
        quote payment.
      required:
        - id
        - takerOrderId
        - makerOrderId
        - amountSubunits
        - executionPrice
        - path
        - filledAt
        - status
        - baseAsset
        - divisibility
        - quotePaymentSubunits
        - outcomeFaceAmountSubunits
        - tokenSide
        - settlementGroup
      properties:
        id:
          type: string
          format: uuid
          description: Unique fill identifier.
        takerOrderId:
          type: string
          format: uuid
          description: The incoming (aggressor) order that triggered this fill.
        makerOrderId:
          type: string
          format: uuid
          description: The resting order that was matched against.
        amountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          description: >
             Conditional-token face amount matched for settlement in market
             collateral subunits (msat).
        executionPrice:
          $ref: '#/components/schemas/Probability'
        path:
          $ref: '#/components/schemas/MatchPath'
        status:
          $ref: '#/components/schemas/FillStatus'
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: Required product base asset for the canonical settlement amount.
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.
        quotePaymentSubunits:
          type: integer
          format: int64
          description: >
            Engine-computed quote payment in the market base-asset sub-unit.
            This field plus `baseAsset` and `divisibility` is the
            authoritative quote payment.
        outcomeFaceAmountSubunits:
          type: integer
          format: int64
          description: >
            Engine-computed conditional-token face amount in the market
            base-asset sub-unit.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
          description: >
            Which token on the primitive outcome book was traded for the
            order that produced this fill.
        filledAt:
          type: string
          format: date-time
          description: Timestamp when this fill was executed.
        settlementGroup:
          $ref: '#/components/schemas/SettlementGroupSummary'
          description: >
            Atomic settlement group that durably owns this fill reservation.
        tradeId:
          type: string
          format: uuid
          description: >
            Atomic-swap trade session identifier for this fill. Present when
            the client must join TradeHub to settle; omitted only for legacy
            fills that do not have a corresponding TradeHub session.

    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required:
        - settlementCapability
        - comment
      description: >
        Reference-only order submission. The server loads all immutable order
        identity and economic terms from the current durable DCB binding. The
        authenticated owner and route market must exactly match that prebound
        intent. This reference is not bearer authority.
      properties:
        settlementCapability:
          $ref: '#/components/schemas/SettlementCapabilityReference'
          description: >
            Current capability binding to submit. Possession does not authorize
            use: the server verifies ownership, route identity, and current DCB
            authorization state.
        comment:
          oneOf:
            - $ref: '#/components/schemas/NostrKind1Event'
            - type: 'null'
          description: >
            Optional signed Nostr kind-1 event to index as a verified trade
            comment once this order produces a fill. The event pubkey must
            match the NIP-98 submitter and include an `r` tag for the market
            detail URL.
        walletId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Display-only wallet attribution. It does not authorize custody or settlement.
    NostrKind1Event:
      type: object
      required:
        - id
        - pubkey
        - createdAt
        - kind
        - tags
        - content
        - sig
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        pubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdAt:
          type: integer
          format: int64
          description: NIP-01 created_at Unix timestamp.
        kind:
          type: integer
          enum:
            - 1
        tags:
          type: array
          maxItems: 16
          items:
            type: array
            items:
              type: string
        content:
          type: string
          maxLength: 280
        sig:
          type: string
          pattern: '^[0-9a-f]{128}$'

    OrderStatusResponse:
      type: object
      additionalProperties: false
      required:
        - orderId
        - marketId
        - status
        - remainingAmountSubunits
        - filledAmountSubunits
        - fills
        - amountSubunits
        - outcomeId
        - side
        - price
        - placedAt
        - timeInForce
        - tokenSide
        - baseAsset
        - divisibility
        - activeSettlementGroup
        - continuation
      properties:
        orderId:
          type: string
          format: uuid
          description: The order's unique identifier.
        marketId:
          type: string
          description: The market this order belongs to.
        status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        filledAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
          description: >
            Conditional-token face amount already consumed by committed fills
            or reserved by a nonterminal atomic settlement group.
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: >
            All fills and active or terminal atomic settlement groups produced
            against this order so far.
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
          description: The order's original conditional-token face amount.
        outcomeId:
          type: string
          description: The primitive route outcome this order trades against.
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        placedAt:
          type: string
          format: date-time
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        expiresAt:
          type: string
          format: date-time
          nullable: true
        tradeId:
          type: string
          format: uuid
          nullable: true
          description: >
            Legacy HTLC trade identifier retained until Phase 12 removes the
            superseded protocol surface.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Deadline for pending ephemeral pubkey submission.
        activeSettlementGroup:
          oneOf:
            - $ref: '#/components/schemas/SettlementGroupSummary'
            - type: 'null'
          description: >
            Current nonterminal settlement group for this order, or null when
            no group currently owns an unconfirmed fill.
        continuation:
          oneOf:
            - $ref: '#/components/schemas/OrderContinuationState'
            - type: 'null'
          description: >
            Current durable residual-continuation state. It is non-null only
            after a confirmed partial resting-order settlement.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: Base asset context for amount and price fields.
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.

    RestingOrderResponse:
      type: object
      required:
        - orderId
        - marketId
        - outcomeId
        - side
        - price
        - remainingAmountSubunits
        - amountSubunits
        - timeInForce
        - placedAt
        - tokenSide
        - baseAsset
        - divisibility
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned by the matching engine.
        marketId:
          type: string
          description: The market this order belongs to.
        outcomeId:
          type: string
          description: The primitive route outcome this order trades against.
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        placedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: Base asset context for amount and price fields.
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.

    ListRestingOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/RestingOrderResponse'

    OrderEntry:
      type: object
      additionalProperties: false
      required:
        - orderId
        - marketId
        - conditionId
        - baseAsset
        - divisibility
        - side
        - price
        - amountSubunits
        - remainingAmountSubunits
        - tokenSide
        - status
        - placedAt
        - activeSettlementGroup
      properties:
        orderId:
          type: string
          format: uuid
        marketId:
          type: string
        conditionId:
          type: string
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        tokenSide:
          $ref: '#/components/schemas/TokenSide'
        status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        placedAt:
          type: string
          format: date-time
        filledAt:
          type: string
          format: date-time
          nullable: true
        tradeId:
          type: string
          format: uuid
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        pubkeySubmitted:
          type: boolean
          nullable: true
        clientOrderId:
          type: string
          nullable: true
        activeSettlementGroup:
          oneOf:
            - $ref: '#/components/schemas/SettlementGroupSummary'
            - type: 'null'
          description: >
            Current nonterminal settlement group for this order, or null.

    ListMyOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderEntry'
        nextCursor:
          type: string
          nullable: true

    SubmitOrderResponse:
      type: object
      additionalProperties: false
      required:
        - orderId
        - status
        - remainingAmountSubunits
        - fills
        - pendingPubkeySubmissions
        - baseAsset
        - divisibility
        - activeSettlementGroup
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned to this order.
        status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: List of fills produced by this order. Empty if no matches.
        pendingPubkeySubmissions:
          type: array
          items:
            $ref: '#/components/schemas/PendingPubkeySubmission'
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: Base asset context for amount and price fields.
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
        activeSettlementGroup:
          oneOf:
            - $ref: '#/components/schemas/SettlementGroupSummary'
            - type: 'null'
          description: >
            Current nonterminal settlement group for this order, or null.

    BatchSubmitOrdersRequest:
      type: object
      additionalProperties: false
      required:
        - orders
      properties:
        orders:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchSubmitOrderRequestItem'

    PendingPubkeySubmission:
      type: object
      required:
        - tradeId
        - role
        - fillAmount
        - deadline
      properties:
        tradeId:
          type: string
          format: uuid
        role:
          type: string
          enum: [maker, taker]
        fillAmount:
          $ref: '#/components/schemas/CollateralSubunits'
        deadline:
          type: string
          format: date-time

    SubmitEphemeralPubkeyRequest:
      type: object
      required:
        - ephemeralPubkey
      properties:
        ephemeralPubkey:
          type: string
          description: 33-byte compressed secp256k1 public key as lowercase hex.
          pattern: '^(02|03)[0-9a-fA-F]{64}$'

    SubmitEphemeralPubkeyResponse:
      type: object
      required:
        - tradeId
        - role
        - bothReceived
      properties:
        tradeId:
          type: string
          format: uuid
        role:
          type: string
          enum: [maker, taker]
        bothReceived:
          type: boolean

    BatchSubmitOrderRequestItem:
      type: object
      additionalProperties: false
      required:
        - settlementCapability
      description: >
        Reference-only batch item. The server loads every immutable order fact
        from the current durable DCB binding. Possession of the reference is
        not bearer authority; ownership, route condition, and current
        authorization are verified.
      properties:
        settlementCapability:
          $ref: '#/components/schemas/SettlementCapabilityReference'
        walletId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Display-only wallet attribution. It does not authorize custody or settlement.
    BatchSubmitOrdersResponse:
      type: object
      additionalProperties: false
      required:
        - accepted
        - rejected
      description: >
        Every request item appears exactly once in either `accepted` or
        `rejected`. Consumers may reconstruct request order by sorting both
        arrays by `requestIndex`.
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/BatchSubmitOrderSuccess'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/BatchSubmitOrderFailure'

    BatchSubmitOrderSuccess:
      type: object
      additionalProperties: false
      description: >
        Accepted admission result with binding-owned order and execution facts.
      required:
        - requestIndex
        - clientOrderId
        - marketId
        - orderId
        - status
        - remainingAmountSubunits
        - fills
        - pendingPubkeySubmissions
        - baseAsset
        - divisibility
        - activeSettlementGroup
      properties:
        requestIndex:
          type: integer
          format: int32
          minimum: 0
        clientOrderId:
          type: string
        marketId:
          type: string
        orderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderLifecycleStatus'
        remainingAmountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
        pendingPubkeySubmissions:
          type: array
          items:
            $ref: '#/components/schemas/PendingPubkeySubmission'
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.
        activeSettlementGroup:
          oneOf:
            - $ref: '#/components/schemas/SettlementGroupSummary'
            - type: 'null'
          description: >
            Current nonterminal settlement group for this order, or null.

    BatchSubmitOrderFailure:
      type: object
      additionalProperties: false
      description: >
        Per-item admission failure. This variant exposes no binding-owned
        identity, market, order, amount, fill, asset, divisibility, or
        free-form dependency details.
      required:
        - requestIndex
        - errorCode
      properties:
        requestIndex:
          type: integer
          format: int32
          minimum: 0
        errorCode:
          $ref: '#/components/schemas/BatchSubmitOrderErrorCode'

    BatchSubmitOrderErrorCode:
      type: string
      enum:
        - capabilityNotFound
        - capabilityNotCurrent
        - routeMismatch
        - authorityUnavailable
        - participationScoreRequired
        - marketClosed
        - bookRejected
      description: >
        `capabilityNotFound` covers absent, foreign, or digest-mismatched
        references. `capabilityNotCurrent` covers stale, expired, selected, or
        otherwise non-current capabilities only when no matching accepted
        admission exists. An exact authenticated owner, order, reference, and
        fingerprint replay returns its prior accepted admission result even if
        the capability later became selected or terminal.

    BatchCancelOrdersRequest:
      type: object
      required:
        - orderIds
      properties:
        orderIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid

    BatchCancelOrdersResponse:
      type: object
      required:
        - canceled
        - notCanceled
      properties:
        canceled:
          type: array
          items:
            type: string
            format: uuid
        notCanceled:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BatchCancelOrderFailure'

    BatchCancelOrderFailure:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          $ref: '#/components/schemas/BatchCancelOrderErrorCode'
        errorMessage:
          type: string

    BatchCancelOrderErrorCode:
      type: string
      enum:
        - notFoundOrNotActiveOrNotAuthorized
        - duplicateOrderId
        - invalidOrderId
        - bookRejected

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/CollateralSubunits'
      description: A single price level in the order book depth.

    OrderBookSnapshot:
      type: object
      description: >
        Order book snapshot for market-detail rendering. When `depthLimit` is
        present, `bids` and `asks` contain at most that many top executable
        price levels per side; clients must not treat the snapshot as full
        depth.
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          oneOf:
            - type: integer
            - type: 'null'
          description: Difference between best ask and best bid. Null if either side is empty.
        depthLimit:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: >
            Maximum number of top price levels included per side. Null or absent
            means the producer did not declare whether the snapshot is bounded.

    MarketStatusChanged:
      type: object
      description: >
        Lifecycle-change notification pushed over the market hub when a
        condition's market transitions state (e.g. open -> closed). Sent to
        every per-outcome market group of the condition. Carries only
        wire-visible, public lifecycle data.
      required:
        - conditionId
        - state
      properties:
        conditionId:
          type: string
          description: The condition identifier whose lifecycle changed.
        state:
          type: string
          enum: [open, closed]
          description: >
            New engine-side lifecycle state. `open` accepts new orders;
            `closed` does not.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Engine-side close timestamp. Null unless the new state is `closed`.
        finalOutcome:
          type: string
          nullable: true
          description: >
            Winning outcome known to the engine after an oracle attestation
            close. Null for deadline-only closes or non-resolving transitions.

    CreateMarketOutcome:
      type: object
      required:
        - name
        - probability
      properties:
        name:
          type: string
          description: Outcome label (e.g. "Yes", "Alice").
        probability:
          type: integer
          minimum: 1
          maximum: 99
          description: Initial implied probability for this outcome [1, 99].

    CreateMarketRequest:
      type: object
      description: >
        JSON payload embedded in the multipart `metadata` field of the
        createMarket endpoint.
      required:
        - title
        - description
        - outcomes
        - baseAsset
      properties:
        title:
          type: string
          description: Human-readable market title.
        description:
          type: string
          description: Detailed market description.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/CreateMarketOutcome'
          minItems: 2
          maxItems: 8
          description: The outcomes for the market (2 through 8).
        outcomeType:
          type: string
          enum: [yesno, categorical, numeric]
          description: >
            Market outcome type. Numeric creation is disabled until finite-bin
            metadata is supported end-to-end.
        liquiditySats:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >
            Deprecated pre-create liquidity field. Market-maker funding is
            collected after creation through the funding flow; create requests
            should send `0`.
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: >
            Required immutable product base asset. Must be exact `sat`.
        categoryTags:
          type: array
          items:
            type: string
          description: Optional category tags for the market.
        oracleAnnouncementHex:
          type: string
          nullable: true
          description: >
            Hex-encoded DLC oracle announcement TLV registered with the mint
            for this condition. The engine persists its oracle pubkey, DLC
            event id, and maturity time so direct oracle attestations can
            close the market.

    CreateMarketResponse:
      type: object
      required:
        - conditionId
        - marketsCreated
        - baseAsset
        - divisibility
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered for.
        marketsCreated:
          type: array
          items:
            type: string
          description: >
            List of per-outcome market IDs created
            (format: "{conditionId}-{outcomeName}").
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
          description: Required immutable product base asset. Always exact `sat`.
        thumbnailUrl:
          oneOf:
            - type: string
            - type: 'null'
          description: URL to the uploaded thumbnail, or null if none was provided.
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.

    MarketPriceHistoryPoint:
      type: object
      required:
        - timestamp
        - price
        - volumeSubunits
        - source
      properties:
        timestamp:
          type: string
          format: date-time
        price:
          type: integer
          minimum: 1
          description: >
            Market price numerator `k`. Valid range is `1 <= k <= D - 1`,
            where `D` is the market's immutable `divisibility`. Current markets
            use D=10000 (0.01% price precision).
        volumeSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Volume represented in the market's collateral/share subunits.
            Initial anchor points always carry zero volume.
        source:
          type: string
          enum: [initial, fill]
          description: >
            `initial` is the creator-probability anchor and is clamped to the
            selected timeframe boundary when used as carry-forward context.
            `fill` is a settlement-committed trade tick inside the selected
            timeframe.

    MarketOutcomePriceHistory:
      type: object
      required:
        - outcomeId
        - data
      properties:
        outcomeId:
          type: string
          description: Primitive outcome id. Compound outcome ids are not returned.
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketPriceHistoryPoint'

    MarketPriceHistoryResponse:
      type: object
      required:
        - conditionId
        - timeframe
        - outcomes
      properties:
        conditionId:
          type: string
        timeframe:
          type: string
          enum:
            - 1h
            - 24h
            - 7d
            - 30d
            - all
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MarketOutcomePriceHistory'

    MarketComment:
      type: object
      required:
        - commentId
        - content
        - createdAt
        - authorPubkey
      properties:
        commentId:
          type: string
          format: uuid
          description: Opaque stable comment identifier.
        content:
          type: string
          maxLength: 280
        createdAt:
          type: string
          format: date-time
          description: Timestamp from the signed Nostr kind-1 comment event.
        authorPubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Nostr pubkey that signed the comment.

    MarketCommentsResponse:
      type: object
      required:
        - conditionId
        - comments
      properties:
        conditionId:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/MarketComment'

    SwapFailureKind:
      type: string
      enum:
        - PartialLockHeld
        - InsufficientInventory
        - MintError
        - EngineRejected

    SwapFailure:
      type: object
      required:
        - kind
        - detail
      properties:
        kind:
          $ref: '#/components/schemas/SwapFailureKind'
        refundLocktime:
          type: integer
          format: int64
          description: Unix seconds; present when kind is PartialLockHeld.
        affectedKeysets:
          type: array
          items:
            type: string
          description: Primitive outcome/keyset legs affected by a partial lock.
        detail:
          type: string
          description: Local diagnostic detail; redact from telemetry.

    LiquidityStateResponse:
      type: object
      required:
        - marketId
        - reserveA
        - reserveB
        - impliedProbability
        - baseAsset
        - divisibility
        - restingOrderLiquiditySubunits
        - completeSetLiquiditySubunits
        - totalLiquiditySubunits
        - activeOrders
      properties:
        marketId:
          type: string
        reserveA:
          type: integer
          format: int64
        reserveB:
          type: integer
          format: int64
        impliedProbability:
          type: integer
          minimum: 1
          maximum: 99
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.
        restingOrderLiquiditySubunits:
          type: integer
          format: int64
          description: Liquidity represented by currently resting bot orders, in market-base subunits.
        completeSetLiquiditySubunits:
          type: integer
          format: int64
          description: Conservative value of free complete-set inventory, in market-base subunits.
        totalLiquiditySubunits:
          type: integer
          format: int64
          description: Total public liquidity in market-base subunits.
        activeOrders:
          type: integer
          description: Number of active liquidity orders.

    MarketMetadataSnapshot:
      type: object
      required:
        - marketId
        - totalVolumeSubunits
        - totalTrades
        - totalLiquiditySubunits
      properties:
        marketId:
          type: string
          description: The market ID.
        totalVolumeSubunits:
          type: integer
          format: int64
          description: Total trading volume in market collateral subunits across all fills.
        totalTrades:
          type: integer
          description: Total number of fills (trades) executed.
        totalLiquiditySubunits:
          type: integer
          format: int64
          description: Total liquidity deposited in market collateral subunits.

    CreatorMarketEntry:
      type: object
      required:
        - conditionId
        - totalVolumeSubunits
        - createdAt
        - state
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered under.
        totalVolumeSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Aggregated trading volume in market collateral subunits across every per-outcome
            market belonging to this condition.
        createdAt:
          type: string
          format: date-time
          description: When this market was registered with the matching engine.
        state:
          type: string
          enum:
            - open
            - closed
          description: >
            Engine-side lifecycle state. `open` accepts new orders; `closed`
            does not.

    CreatorMarketsResponse:
      type: object
      required:
        - pubkey
        - markets
      properties:
        pubkey:
          type: string
          description: The creator pubkey this response belongs to (echoed from the path).
        markets:
          type: array
          items:
            $ref: '#/components/schemas/CreatorMarketEntry'
          description: >
            Markets created by this pubkey. May be empty if the creator has
            not registered any markets yet.

    DepositState:
      type: string
      enum:
        - requested
        - paid
        - credited
        - failed
      description: >
        Lifecycle state of a single deposit. `requested` → invoice issued or
        ecash submission accepted, awaiting payment proof. `paid` → payment
        confirmed and crediting is in progress. `credited` → the market account
        was credited (terminal-success). `failed` → invoice expired, ecash
        rejected, or crediting failed (terminal-failure).

    DepositMethod:
      type: string
      enum:
        - lightningInvoice
        - ecash
      description: How the funder is paying the deposit.

    RequestEcashDepositRequest:
      type: object
      required:
        - amountSubunits
        - unit
        - divisibility
        - proofsToken
      properties:
        amountSubunits:
          allOf:
            - $ref: '#/components/schemas/CollateralSubunits'
          description: >
            Asserted value of the supplied ecash proofs in
            market-collateral base subunits. The engine derives the unit from
            the registered market.
        unit:
          type: string
          enum: [msat]
          description: Exact Cashu product-collateral unit for the supplied proofs.
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: Exact market divisibility associated with the supplied proofs.
        proofsToken:
          type: string
          description: >
            Opaque ecash token (Cashu V4 token blob). Proofs and amount are
            verified before crediting.
        creatorPubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Nostr public key (hex) of the market creator
        fundAmm:
          type: boolean
          default: false
          description: Fund the automated market-maker for this market. The deposit becomes the bot quoting budget and is NOT withdrawable. If the market resolves, any residual budget becomes operator income.

    RequestEcashDepositResponse:
      type: object
      required:
        - depositId
        - state
      properties:
        depositId:
          type: string
          format: uuid
          description: Identifier for polling the deposit's lifecycle state.
        state:
          $ref: '#/components/schemas/DepositState'

    ParticipationScoreResponse:
      type: object
      required:
        - pubkey
        - balance
        - purchasedTotal
        - consumedTotal
        - penaltyTotal
        - matchDebitScore
        - enabled
      properties:
        pubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Authenticated Nostr pubkey whose Score is returned.
        balance:
          type: integer
          format: int64
          description: Current participation Score balance. May be negative after soft match/penalty debits.
        purchasedTotal:
          type: integer
          format: int64
          minimum: 0
          description: Total Score purchased by this pubkey.
        consumedTotal:
          type: integer
          format: int64
          minimum: 0
          description: Total Score consumed by successful match debits.
        penaltyTotal:
          type: integer
          format: int64
          minimum: 0
          description: Total Score consumed by settlement-negligence penalties.
        matchDebitScore:
          type: integer
          format: int64
          minimum: 1
          description: Configured Score debit charged to the taker when a match lands.
        enabled:
          type: boolean
          description: Whether match-time Score debit is enabled by the engine.

    PayParticipationScoreEcashRequest:
      type: object
      required:
        - amountSats
        - proofsToken
      properties:
        amountSats:
          allOf:
            - $ref: '#/components/schemas/Sats'
          minimum: 1
          description: Exact sat amount carried by the supplied regular ecash token.
        proofsToken:
          type: string
          description: Opaque Cashu token paid as a non-refundable Engine fee.
        paymentId:
          type: string
          format: uuid
          description: Optional caller-supplied idempotency id for retrying the same ecash payment.

    PayParticipationScoreEcashResponse:
      type: object
      required:
        - paymentId
        - status
        - amountSats
        - creditedScore
        - creditedAt
      properties:
        paymentId:
          type: string
          format: uuid
          description: Idempotency id assigned to this Score payment.
        status:
          type: string
          enum:
            - credited
          description: Terminal success state for the synchronous ecash payment flow.
        amountSats:
          allOf:
            - $ref: '#/components/schemas/Sats'
          minimum: 1
          description: Ecash amount accepted as engine fee.
        creditedScore:
          type: integer
          format: int64
          minimum: 1
          description: Score credited for this payment.
        creditedAt:
          type: string
          format: date-time
          description: Time wallet-service accepted and credited the engine-fee payment.

    GetDepositResponseDto:
      type: object
      required:
        - depositId
        - conditionId
        - state
        - method
        - amountSubunits
        - requestedAt
        - updatedAt
      properties:
        depositId:
          type: string
          format: uuid
        conditionId:
          type: string
          description: Condition the deposit funds.
        state:
          $ref: '#/components/schemas/DepositState'
        method:
          $ref: '#/components/schemas/DepositMethod'
        amountSubunits:
          $ref: '#/components/schemas/CollateralSubunits'
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Most recent state-change timestamp.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: For LN deposits, when the bolt11 stops being payable.
        failureReason:
          type: string
          nullable: true
          description: Populated only when `state == Failed`.

    MarketCatalogueEntry:
      type: object
      required:
        - conditionId
        - outcomes
        - state
        - createdAt
        - volume24hSubunits
        - volume30dSubunits
        - liquiditySubunits
        - ammBotBudgetSubunits
        - volumeLifetimeSubunits
        - categoryTags
        - lastSuccessfulRefreshAt
        - baseAsset
        - divisibility
        - initialProbabilities
      properties:
        conditionId:
          type: string
          description: >
            The condition identifier (hex string derived from the oracle
            announcement). Stable identifier for the market.
        outcomes:
          type: array
          description: >
            Outcome names sourced from the mintd condition snapshot. Singleton
            outcome books use `marketId = "{conditionId}-{outcomeName}"`;
            the one-vs-rest complement is selected on order submission with
            `tokenSide = "Complement"` rather than a compound public market ID.
          items:
            type: string
        title:
          type: string
          nullable: true
          description: >
            Optional human-readable title from market registration. Null when
            the creator did not supply one.
        description:
          type: string
          nullable: true
          description: >
            Detailed market description supplied by the creator at
            registration time. Market detail pages render this as the
            resolution criteria text.
        thumbnailUrl:
          type: string
          nullable: true
          description: >
            Optional thumbnail URL. Null when no thumbnail was uploaded.
        creatorPubkey:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
          description: >
            Creator's Nostr pubkey (64-char lowercase hex), captured at
            registration time via NIP-98. Null on legacy markets that
            predate creator tracking.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: >
            Oracle attestation deadline carried from the mintd condition
            snapshot. The market auto-closes at this instant when the kind-89
            attestation has not yet been observed.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Engine-side close timestamp. Null while the market is open. Closed
            market detail pages use this value as the resolution date; deadline
            remains the scheduled oracle maturity time.
        finalOutcome:
          type: string
          nullable: true
          description: >
            Winning outcome known to the engine after an oracle attestation
            close. Null for deadline-only closes or markets that have not yet
            resolved.
        state:
          type: string
          enum: [open, closed]
          description: >
            Engine-side lifecycle state. `open` accepts new orders; `closed`
            does not. Source of truth is the matching engine's lifecycle state,
            NOT mintd's attestation status.
        createdAt:
          type: string
          format: date-time
          description: >
            When the market was registered with the matching engine.
        volume24hSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Trading volume over the last 24 hours in the market collateral's
            base subunits (msat). Drives the `Trending` sort dimension.
        volume30dSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Trading volume over the last 30 days in the market collateral's
            base subunits (msat). Drives the `Popular` sort dimension.
        liquiditySubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Total face amount of currently-resting orders across the market's
            order books, denominated in product collateral subunits (msat).
        ammBotBudgetSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Static initial budget deposited to the LMSR bot at funding time,
            denominated in product collateral subunits (msat).
            Operator-owned, non-withdrawable, and immutable after funding.
            Not a live residual and not orderbook depth.
        volumeLifetimeSubunits:
          type: integer
          format: int64
          minimum: 0
          description: >
            Cumulative settled collateral face amount of all fills in the
            market's history.
        baseAsset:
          $ref: '#/components/schemas/BaseAsset'
        divisibility:
          type: integer
          format: int32
          enum: [10000, 1000000]
          description: >
            Immutable price denominator `D`, server-determined.
        lastTradedPrice:
          type: number
          nullable: true
          description: >
            Most recent execution price as a decimal ratio in `[0, 1]`, null
            if the market has never traded. Runtime order, fill, orderbook, and
            price-history price fields use integer numerators against the
            market's `divisibility`; this catalogue summary keeps the legacy
            ratio form for sorting/display compatibility.
        initialProbabilities:
          type: object
          additionalProperties:
            type: integer
            format: int32
            minimum: 1
            maximum: 99
          description: >
            Creator-specified registration-time probability per atomic outcome,
            expressed as integer percentages that sum to 100. Clients use this
            as the default market price before any trade has established a live
            last-traded price.
        categoryTags:
          type: array
          items:
            type: string
          description: >
            Category tags supplied at market registration. Filterable via
            the `tag` query parameter.
        lastSuccessfulRefreshAt:
          type: string
          format: date-time
          description: >
            When the engine last successfully pulled the mintd condition
            snapshot used to populate this entry's mintd-sourced fields.
            Mirrored on every entry so callers can render staleness
            indicators per market without an additional request.

    MarketCatalogueResponse:
      type: object
      required:
        - markets
        - lastSuccessfulRefreshAt
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketCatalogueEntry'
          description: >
            Page of markets matching the supplied filters, ordered by the
            requested `sort` dimension. Empty when no markets match.
        nextCursor:
          type: string
          nullable: true
          description: >
            Opaque (HMAC-signed) pagination cursor for the next page. Null
            when this is the last page. Pass back as `?cursor=...` to
            continue.
        lastSuccessfulRefreshAt:
          type: string
          format: date-time
          description: >
            Top-level mirror of the mintd-mirror's most recent successful
            refresh time. Useful for rendering a single staleness banner
            covering the whole catalogue when the mintd poller has been
            failing.

    ProblemDetails:
      type: object
      description: >
        RFC 7807 problem details. The matching engine returns this shape on
        4xx and 5xx responses where additional context helps the caller
        recover.
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code generated for this occurrence.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying the specific occurrence.
