openapi: 3.1.0
info:
  title: BitCaster Matching Engine API
  description: REST API for the BitCaster prediction market matching engine.
  version: 0.2.0
  license:
    name: MIT

servers:
  - url: http://localhost:5001
    description: Local development (via Aspire AppHost)

paths:
  /api/v1/markets/{conditionId}:
    post:
      operationId: createMarket
      summary: Register a new market on the matching engine
      security:
        - nip98: []
      description: >
        Validates the condition exists in the mint, creates market order books,
        and optionally stores a thumbnail.
        The authenticated pubkey from the NIP-98 header is recorded as the
        market creator — no creator field in the request body is needed.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
              properties:
                metadata:
                  type: string
                  description: >
                    JSON-encoded CreateMarketRequest object containing market
                    title, description, outcomes, liquidity, and category tags.
                thumbnail:
                  type: string
                  format: binary
                  description: Optional thumbnail image (JPEG, PNG, or WebP, max 5 MB).
      responses:
        '200':
          description: Market created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMarketResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication
        '409':
          description: Market already exists for this condition
          content:
            application/json:
              schema:
                type: string

  /api/v1/{marketId}/orders:
    get:
      operationId: listRestingOrders
      summary: List the authenticated user's resting orders
      security:
        - nip98: []
      description: >
        Returns live resting orders in this market owned by the authenticated
        user. Used by clients that need to rebuild local order-tracking state
        after a restart.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Resting orders owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRestingOrdersResponse'
        '401':
          description: Missing or invalid NIP-98 authentication

    post:
      operationId: submitOrder
      summary: Submit a new order
      security:
        - nip98: []
      description: Submit a limit or market order to the matching engine.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Missing or invalid NIP-98 authentication

  /api/v1/{marketId}/orders/{orderId}:
    get:
      operationId: getOrderStatus
      summary: Fetch the current state of an order
      security:
        - nip98: []
      description: >
        Returns the order's live status, remaining/filled amounts, and the
        list of fills produced so far. Clients poll this endpoint to observe
        async state changes (fills, cancellation, expiry) without holding an
        open connection. Only the order's owner (matching the authenticated
        pubkey) may query its status.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The order's unique identifier.
      responses:
        '200':
          description: Current order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Order not found

    delete:
      operationId: cancelOrder
      summary: Cancel an existing order
      security:
        - nip98: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the order to cancel.
      responses:
        '200':
          description: Order cancelled
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Order not found

  /api/v1/{marketId}/orderbook:
    get:
      operationId: getOrderBook
      summary: Get the current order book snapshot
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookSnapshot'

  /api/v1/{marketId}/liquidity:
    get:
      operationId: getLiquidity
      summary: Get liquidity state
      description: Returns the current public liquidity state for a market.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current liquidity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityStateResponse'
        '404':
          description: No liquidity state for this market

  /api/v1/{marketId}/metadata:
    get:
      operationId: getMarketMetadata
      summary: Get market metadata
      description: >
        Returns aggregated metadata for a market including trading volume,
        trade count, unique trader count, and liquidity.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Market metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMetadataSnapshot'

  /api/v1/{conditionId}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Get the thumbnail image for a condition
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: The thumbnail image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: No thumbnail for this condition

  /api/v1/markets/{conditionId}/deposit/ln-invoice:
    post:
      operationId: requestLnInvoiceDeposit
      summary: Request a Lightning invoice for market liquidity
      security:
        - nip98: []
      description: >
        Issues a bolt11 invoice payable to the market's funding account. Once
        the invoice is paid, the deposit advances asynchronously through the
        deposit lifecycle until the market account is credited. The bolt11
        string is returned only in this response — the polling endpoint
        deliberately omits bearer material.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestLnInvoiceDepositRequest'
      responses:
        '200':
          description: Invoice issued; deposit recorded in `Requested` state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLnInvoiceDepositResponse'
        '400':
          description: Validation error (e.g. non-positive amount)
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Market not found
        '429':
          description: Per-pubkey deposit-request rate limit exceeded
        '502':
          description: Lightning invoice provider error

  /api/v1/markets/{conditionId}/deposit/ecash:
    post:
      operationId: requestEcashDeposit
      summary: Submit an ecash payment for market liquidity
      security:
        - nip98: []
      description: >
        Submits an ecash deposit for asynchronous proof verification and
        crediting. Use the returned `depositId` to poll for state transitions
        via the GET endpoint.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEcashDepositRequest'
      responses:
        '200':
          description: Deposit recorded; verification proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEcashDepositResponse'
        '400':
          description: Validation error (e.g. malformed proofs token, non-positive amount)
        '401':
          description: Missing or invalid NIP-98 authentication
        '404':
          description: Market not found
        '429':
          description: Per-pubkey deposit-request rate limit exceeded

  /api/v1/markets/{conditionId}/deposit/{depositId}:
    get:
      operationId: getDepositStatus
      summary: Read the current state of a deposit
      description: >
        Polling-friendly read of a single deposit's lifecycle state. Bearer
        payment instruments (bolt11) and proof material are deliberately
        excluded from the response — they appear only in the original
        request response. Public; no authentication required.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
        - name: depositId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Deposit identifier returned by the request endpoint.
      responses:
        '200':
          description: Deposit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDepositResponseDto'
        '404':
          description: No deposit with this id for this condition

  /api/v1/creators/{pubkey}/markets:
    get:
      operationId: listCreatorMarkets
      summary: List markets created by a given Nostr pubkey
      description: >
        Returns every market whose creator (authenticated via NIP-98 at
        registration time) matches the supplied pubkey, along with aggregated
        volume data so the creator dashboard can render totals without
        additional round-trips.
      parameters:
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: Nostr pubkey (hex) of the market creator.
      responses:
        '200':
          description: List of markets created by this pubkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorMarketsResponse'

  /api/v1/markets/query:
    get:
      operationId: queryMarkets
      summary: Catalogue proxy — list markets with filters, sort, and pagination
      description: >
        Returns the public market catalogue with matching-engine market state,
        mint condition data, and trading summary fields. This is the read
        endpoint the markets list page (`/markets`) and discovery surfaces
        consume.

        Anonymous by default. NIP-98 is OPTIONAL — when present, the request
        is authenticated and routed to a higher per-pubkey rate-limit bucket;
        when absent, the per-IP bucket applies. Authentication does NOT change
        the response shape or visibility — every market visible to an anonymous
        caller is also visible to an authenticated caller and vice versa.

        The response combines condition metadata (`outcomes`, `creatorPubkey`,
        `deadline`, and oracle attestation/close metadata) with trading state
        (`state`, `volume*`, `lastTradedPrice`, and `createdAt`). A market
        missing either side of that public data is omitted from the catalogue
        until both are available.
      security:
        - {}
        - nip98: []
      parameters:
        - name: tag
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            uniqueItems: false
          style: form
          explode: true
          description: >
            Repeatable category tag filter (e.g. `?tag=politics&tag=tech`).
            A market matches when at least one of its category tags matches
            at least one supplied tag (OR semantics across the supplied tags).
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [Open, Closed, All]
            default: Open
          description: >
            State filter against the matching engine's lifecycle state.
            Default is `Open`. Use `All` to include both Open and Closed
            markets in a single response. The match is case-insensitive on
            the wire (`open` works the same as `Open`).
        - name: creator_pubkey
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: >
            Restrict the result to markets whose creator pubkey matches.
            64-character lowercase hex Nostr pubkey. Different from
            `/api/v1/creators/{pubkey}/markets` — that endpoint returns the
            creator-dashboard volume rollup; this filter returns the full
            catalogue response.
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of conditionIds to bulk-fetch (e.g.
            `?ids=abc,def,123`). Returns only the named markets that match the
            other filters. Capped at 100 ids per request — exceeding the cap
            is a 400.
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >
            Full-text market search query. When present, results are ordered by
            relevance. The active `tag`, `state`, `creator_pubkey`, and `ids`
            filters also constrain the search. Capped at 200 normalized
            characters.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [Trending, Popular, New]
            default: Trending
          description: >
            Sort dimension. `Trending` orders by 24h trading volume descending;
            `Popular` orders by 30d trading volume descending; `New` orders
            by RegisterMarket timestamp descending. Ties on the sort dimension
            break by `conditionId` ascending so paginated streams remain
            deterministic.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque pagination token returned in `nextCursor` from a previous
            page. The engine HMAC-signs cursors before returning them and
            verifies the signature before reading the underlying boundary —
            tampered or unsigned cursors are 400. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: >
            Page size cap. Default 20, hard cap 50 — exceeding the cap is a
            400. Page sizes below 1 are also a 400.
      responses:
        '200':
          description: Paginated catalogue of markets matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCatalogueResponse'
        '400':
          description: >
            Invalid query parameters — typo'd `state`/`sort` value, malformed
            `creator_pubkey`, `ids` over the 100-cap, `page_size` outside
            `[1, 50]`, or a tampered/malformed `cursor`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: >
            NIP-98 token was supplied but rejected (e.g. expired, signature
            mismatch, body-payload mismatch). Anonymous callers do NOT see 401
            from this route.
        '429':
          description: >
            Rate limit exceeded. Anonymous callers share a per-IP bucket;
            NIP-98-authenticated callers have their own per-pubkey bucket
            with a higher permit ceiling. The engine returns this when the
            applicable bucket is empty.

components:
  securitySchemes:
    nip98:
      type: http
      scheme: Nostr
      description: >
        NIP-98 HTTP Auth. The client signs a Nostr kind-27235 event containing
        the request URL and HTTP method, then sends it as
        `Authorization: Nostr <base64-encoded-event>`. The server verifies the
        BIP-340 Schnorr signature and extracts the signer's pubkey as the
        authenticated identity. See https://github.com/nostr-protocol/nips/blob/master/98.md

  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
      description: >
        The market to trade on, in the format "{conditionId}-{outcomeName}"
        (e.g. "deadbeef…abc-Alice"). Each outcome of a condition has its own
        independent binary order book. A marketId containing "|" is invalid.

    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: string
      description: >
        The condition identifier (hex string derived from the oracle announcement).

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    Probability:
      type: integer
      minimum: 1
      maximum: 99
      description: A probability price representing a percentage chance [1, 99].

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell
      description: Direction of an order relative to the outcome token.

    OrderType:
      type: string
      enum:
        - Limit
        - Market
      description: Execution semantics of an order.

    TimeInForce:
      type: string
      enum:
        - GTC
        - FOK
        - FAK
      description: >
        Time-in-force policy. GTC = Good-Till-Cancel (rests on book),
        FOK = Fill-Or-Kill (reject if not fully filled),
        FAK = Fill-And-Kill (cancel remaining after partial fill).

    MatchPath:
      type: string
      enum:
        - Direct
        - Complementary
      description: How two orders were matched together.

    Fill:
      type: object
      required:
        - id
        - takerOrderId
        - makerOrderId
        - amountSats
        - executionPrice
        - path
        - filledAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique fill identifier.
        takerOrderId:
          type: string
          format: uuid
          description: The incoming (aggressor) order that triggered this fill.
        makerOrderId:
          type: string
          format: uuid
          description: The resting order that was matched against.
        amountSats:
          allOf:
            - $ref: '#/components/schemas/Sats'
          description: >
            Filled conditional-token face amount. For direct atomic swaps the
            buyer's quote payment is derived from this amount and the execution
            price.
        executionPrice:
          $ref: '#/components/schemas/Probability'
        path:
          $ref: '#/components/schemas/MatchPath'
        filledAt:
          type: string
          format: date-time
          description: Timestamp when this fill was executed.
        tradeId:
          type: string
          format: uuid
          description: >
            Atomic-swap trade session identifier for this fill. Present on
            direct-match fills that require TradeHub settlement; omitted on
            complementary fills and legacy fills that do not have a corresponding
            TradeHub session.
        makerEphemeralPubkey:
          type: string
          pattern: '^[0-9a-fA-F]{66}$'
          description: >
            Hex-encoded compressed secp256k1 pubkey of the maker order's
            ephemeral key. Present on direct-match fills so the taker can
            derive the ECDH shared secret with the maker without an extra
            round-trip through the engine. Null on complementary-match fills
            and on fills against orders that did not declare an ephemeral
            pubkey (e.g. legacy automated-liquidity orders).

    SubmitOrderRequest:
      type: object
      required:
        - outcomeId
        - side
        - price
        - amountSats
        - ephemeralPubkey
      properties:
        outcomeId:
          type: string
          description: The outcome to trade (e.g. "Alice", "YES").
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSats:
          allOf:
            - $ref: '#/components/schemas/Sats'
          description: >
            Limit-order size as conditional-token face amount. First release
            requires this to be divisible by 100 sats so integer-cent prices
            produce exact quote payments.
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
          default: GTC
        ephemeralPubkey:
          type: string
          pattern: '^[0-9a-fA-F]{66}$'
          description: >
            Hex-encoded compressed secp256k1 pubkey (33 bytes, 66 hex chars)
            generated by the client per-order. Used by the matching engine to
            route the counterparty's encrypted atomic-swap messages back to
            this order's submitter. The corresponding private key stays on the
            client and is the only thing that can decrypt and sign swap
            payloads — the engine never sees it.

    OrderStatusResponse:
      type: object
      required:
        - orderId
        - marketId
        - status
        - remainingAmountSats
        - filledAmountSats
        - fills
      properties:
        orderId:
          type: string
          format: uuid
          description: The order's unique identifier.
        marketId:
          type: string
          description: The market this order belongs to.
        status:
          type: string
          description: >
            One of: "resting" (on book, unmatched), "partially_filled",
            "filled", "cancelled".
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'
        filledAmountSats:
          $ref: '#/components/schemas/Sats'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: All fills produced against this order so far.

    RestingOrderResponse:
      type: object
      required:
        - orderId
        - marketId
        - outcomeId
        - side
        - price
        - remainingAmountSats
        - amountSats
        - timeInForce
        - placedAt
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned by the matching engine.
        marketId:
          type: string
          description: The market this order belongs to.
        outcomeId:
          type: string
          description: The outcome this order trades.
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'
        amountSats:
          $ref: '#/components/schemas/Sats'
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        placedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        ephemeralPubkey:
          type: string
          nullable: true
          pattern: '^[0-9a-fA-F]{66}$'
          description: Order-level ephemeral pubkey supplied at submit time.

    ListRestingOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/RestingOrderResponse'

    SubmitOrderResponse:
      type: object
      required:
        - orderId
        - status
        - remainingAmountSats
        - fills
        - ephemeralPubkey
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned to this order.
        status:
          type: string
          description: >
            One of: "filled", "partially_filled", "resting", "cancelled".
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: List of fills produced by this order. Empty if no matches.
        ephemeralPubkey:
          type: string
          pattern: '^[0-9a-fA-F]{66}$'
          description: >
            Echoes the ephemeralPubkey the client submitted. Lets clients
            confirm round-trip before they discard the corresponding privkey.

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/Sats'
      description: A single price level in the order book depth.

    OrderBookSnapshot:
      type: object
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          oneOf:
            - type: integer
            - type: 'null'
          description: Difference between best ask and best bid. Null if either side is empty.

    CreateMarketOutcome:
      type: object
      required:
        - name
        - probability
      properties:
        name:
          type: string
          description: Outcome label (e.g. "Yes", "Alice").
        probability:
          type: integer
          minimum: 1
          maximum: 99
          description: Initial implied probability for this outcome [1, 99].

    CreateMarketRequest:
      type: object
      description: >
        JSON payload embedded in the multipart `metadata` field of the
        createMarket endpoint.
      required:
        - title
        - description
        - outcomes
      properties:
        title:
          type: string
          description: Human-readable market title.
        description:
          type: string
          description: Detailed market description.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/CreateMarketOutcome'
          minItems: 2
          description: The outcomes for the market (at least 2).
        outcomeType:
          type: string
          enum: [yesno, categorical, numeric]
          description: >
            Market outcome type. Numeric creation is disabled until finite-bin
            metadata is supported end-to-end.
        liquiditySats:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Initial liquidity budget in satoshis.
        categoryTags:
          type: array
          items:
            type: string
          description: Optional category tags for the market.

    CreateMarketResponse:
      type: object
      required:
        - conditionId
        - marketsCreated
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered for.
        marketsCreated:
          type: array
          items:
            type: string
          description: >
            List of per-outcome market IDs created
            (format: "{conditionId}-{outcomeName}").
        thumbnailUrl:
          oneOf:
            - type: string
            - type: 'null'
          description: URL to the uploaded thumbnail, or null if none was provided.

    LiquidityStateResponse:
      type: object
      required:
        - marketId
        - reserveA
        - reserveB
        - impliedProbability
        - totalLiquiditySats
        - activeOrders
      properties:
        marketId:
          type: string
        reserveA:
          type: integer
          format: int64
        reserveB:
          type: integer
          format: int64
        impliedProbability:
          type: integer
          minimum: 1
          maximum: 99
        totalLiquiditySats:
          type: integer
          format: int64
        activeOrders:
          type: integer
          description: Number of active liquidity orders.

    MarketMetadataSnapshot:
      type: object
      required:
        - marketId
        - totalVolumeSats
        - totalTrades
        - uniqueTraderCount
        - totalLiquiditySats
      properties:
        marketId:
          type: string
          description: The market ID.
        totalVolumeSats:
          type: integer
          format: int64
          description: Total trading volume in satoshis across all fills.
        totalTrades:
          type: integer
          description: Total number of fills (trades) executed.
        uniqueTraderCount:
          type: integer
          description: Number of unique user IDs that have submitted orders.
        totalLiquiditySats:
          type: integer
          format: int64
          description: Total liquidity deposited in satoshis.

    CreatorMarketEntry:
      type: object
      required:
        - conditionId
        - totalVolumeSats
        - createdAt
        - state
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered under.
        totalVolumeSats:
          type: integer
          format: int64
          minimum: 0
          description: >
            Aggregated trading volume in satoshis across every per-outcome
            market belonging to this condition.
        createdAt:
          type: string
          format: date-time
          description: When this market was registered with the matching engine.
        state:
          type: string
          enum:
            - open
            - closed
          description: >
            Engine-side lifecycle state. `open` accepts new orders; `closed`
            does not.

    CreatorMarketsResponse:
      type: object
      required:
        - pubkey
        - markets
      properties:
        pubkey:
          type: string
          description: The creator pubkey this response belongs to (echoed from the path).
        markets:
          type: array
          items:
            $ref: '#/components/schemas/CreatorMarketEntry'
          description: >
            Markets created by this pubkey. May be empty if the creator has
            not registered any markets yet.

    DepositState:
      type: string
      enum:
        - Requested
        - Paid
        - Credited
        - Failed
      description: >
        Lifecycle state of a single deposit. `Requested` → invoice issued or
        ecash submission accepted, awaiting payment proof. `Paid` → payment
        confirmed and crediting is in progress. `Credited` → the market account
        was credited (terminal-success). `Failed` → invoice expired, ecash
        rejected, or crediting failed (terminal-failure).

    DepositMethod:
      type: string
      enum:
        - LightningInvoice
        - Ecash
      description: How the funder is paying the deposit.

    RequestLnInvoiceDepositRequest:
      type: object
      required:
        - amountSats
      properties:
        amountSats:
          type: integer
          format: int64
          minimum: 1
          description: Amount of sats the funder intends to deposit.

    RequestLnInvoiceDepositResponse:
      type: object
      required:
        - depositId
        - bolt11
        - expiresAt
      properties:
        depositId:
          type: string
          format: uuid
          description: Identifier for polling the deposit's lifecycle state.
        bolt11:
          type: string
          description: >
            Bolt11 invoice the funder pays. Bearer material — never echoed
            from the polling endpoint.
        expiresAt:
          type: string
          format: date-time
          description: When the bolt11 stops being payable.

    RequestEcashDepositRequest:
      type: object
      required:
        - amountSats
        - proofsToken
      properties:
        amountSats:
          type: integer
          format: int64
          minimum: 1
          description: Asserted sat value of the supplied ecash proofs.
        proofsToken:
          type: string
          description: >
            Opaque ecash token (Cashu V4 token blob). Proofs and amount are
            verified before crediting.

    RequestEcashDepositResponse:
      type: object
      required:
        - depositId
        - state
      properties:
        depositId:
          type: string
          format: uuid
          description: Identifier for polling the deposit's lifecycle state.
        state:
          $ref: '#/components/schemas/DepositState'

    GetDepositResponseDto:
      type: object
      required:
        - depositId
        - conditionId
        - state
        - method
        - amountSats
        - requestedAt
        - updatedAt
      properties:
        depositId:
          type: string
          format: uuid
        conditionId:
          type: string
          description: Condition the deposit funds.
        state:
          $ref: '#/components/schemas/DepositState'
        method:
          $ref: '#/components/schemas/DepositMethod'
        amountSats:
          type: integer
          format: int64
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Most recent state-change timestamp.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: For LN deposits, when the bolt11 stops being payable.
        failureReason:
          type: string
          nullable: true
          description: Populated only when `state == Failed`.

    MarketCatalogueEntry:
      type: object
      required:
        - conditionId
        - outcomes
        - state
        - createdAt
        - volume24hSats
        - volume30dSats
        - categoryTags
        - lastSuccessfulRefreshAt
      properties:
        conditionId:
          type: string
          description: >
            The condition identifier (hex string derived from the oracle
            announcement). Stable identifier for the market.
        outcomes:
          type: array
          items:
            type: string
          description: >
            Outcome names sourced from the mintd condition snapshot. Each
            outcome maps to its own per-outcome order book at
            `marketId = "{conditionId}-{outcomeName}"`.
        title:
          type: string
          nullable: true
          description: >
            Optional human-readable title from market registration. Null when
            the creator did not supply one.
        thumbnailUrl:
          type: string
          nullable: true
          description: >
            Optional thumbnail URL. Null when no thumbnail was uploaded.
        creatorPubkey:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
          description: >
            Creator's Nostr pubkey (64-char lowercase hex), captured at
            registration time via NIP-98. Null on legacy markets that
            predate creator tracking.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: >
            Oracle attestation deadline carried from the mintd condition
            snapshot. The market auto-closes at this instant when the kind-89
            attestation has not yet been observed.
        state:
          type: string
          enum: [open, closed]
          description: >
            Engine-side lifecycle state. `open` accepts new orders; `closed`
            does not. Source of truth is the matching engine's lifecycle state,
            NOT mintd's attestation status.
        createdAt:
          type: string
          format: date-time
          description: >
            When the market was registered with the matching engine.
        volume24hSats:
          type: integer
          format: int64
          minimum: 0
          description: >
            Trading volume over the last 24 hours in satoshis. Drives the
            `Trending` sort dimension.
        volume30dSats:
          type: integer
          format: int64
          minimum: 0
          description: >
            Trading volume over the last 30 days in satoshis. Drives the
            `Popular` sort dimension.
        lastTradedPrice:
          type: number
          nullable: true
          description: >
            Most recent execution price (probability in `[1, 99]`), null if
            the market has never traded.
        categoryTags:
          type: array
          items:
            type: string
          description: >
            Category tags supplied at market registration. Filterable via
            the `tag` query parameter.
        lastSuccessfulRefreshAt:
          type: string
          format: date-time
          description: >
            When the engine last successfully pulled the mintd condition
            snapshot used to populate this entry's mintd-sourced fields.
            Mirrored on every entry so callers can render staleness
            indicators per market without an additional request.

    MarketCatalogueResponse:
      type: object
      required:
        - markets
        - lastSuccessfulRefreshAt
      properties:
        markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketCatalogueEntry'
          description: >
            Page of markets matching the supplied filters, ordered by the
            requested `sort` dimension. Empty when no markets match.
        nextCursor:
          type: string
          nullable: true
          description: >
            Opaque (HMAC-signed) pagination cursor for the next page. Null
            when this is the last page. Pass back as `?cursor=...` to
            continue.
        lastSuccessfulRefreshAt:
          type: string
          format: date-time
          description: >
            Top-level mirror of the mintd-mirror's most recent successful
            refresh time. Useful for rendering a single staleness banner
            covering the whole catalogue when the mintd poller has been
            failing.

    ProblemDetails:
      type: object
      description: >
        RFC 7807 problem details. The matching engine returns this shape on
        4xx and 5xx responses where additional context helps the caller
        recover.
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          description: The HTTP status code generated for this occurrence.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying the specific occurrence.
