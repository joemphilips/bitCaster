openapi: 3.1.0
info:
  title: BitCaster Matching Engine API
  description: REST API for the BitCaster prediction market matching engine.
  version: 0.2.0
  license:
    name: MIT

servers:
  - url: http://localhost:5001
    description: Local development (via Aspire AppHost)

paths:
  /api/v1/markets/{conditionId}:
    post:
      operationId: createMarket
      summary: Register a new market on the matching engine
      description: >
        Validates the condition exists in the mint, creates empty order books
        with CPMM pools for each outcome, and optionally stores a thumbnail.
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
              properties:
                metadata:
                  type: string
                  description: >
                    JSON-encoded CreateMarketRequest object containing market
                    title, description, outcomes, liquidity, and category tags.
                thumbnail:
                  type: string
                  format: binary
                  description: Optional thumbnail image (JPEG, PNG, or WebP, max 5 MB).
      responses:
        '200':
          description: Market created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMarketResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string
        '409':
          description: Market already exists for this condition
          content:
            application/json:
              schema:
                type: string

  /api/v1/{marketId}/orders:
    post:
      operationId: submitOrder
      summary: Submit a new order
      description: Submit a limit or market order to the matching engine.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: string

  /api/v1/{marketId}/orders/{orderId}:
    get:
      operationId: getOrderStatus
      summary: Fetch the current state of an order
      description: >
        Returns the order's live status, remaining/filled amounts, and the
        list of fills produced so far. Clients poll this endpoint to observe
        async state changes (fills, cancellation, expiry) without holding an
        open connection. The orderId is opaque and sufficient for authorization
        — callers are assumed to have received it from submitOrder.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The order's unique identifier.
      responses:
        '200':
          description: Current order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '404':
          description: Order not found

    delete:
      operationId: cancelOrder
      summary: Cancel an existing order
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the order to cancel.
      responses:
        '200':
          description: Order cancelled
        '404':
          description: Order not found

  /api/v1/{marketId}/orderbook:
    get:
      operationId: getOrderBook
      summary: Get the current order book snapshot
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookSnapshot'

  /api/v1/{marketId}/liquidity:
    get:
      operationId: getLiquidity
      summary: Get CPMM pool state
      description: Returns the current state of the CPMM liquidity pool for a market.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Current pool state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityStateResponse'
        '404':
          description: No CPMM pool for this market

  /api/v1/{marketId}/metadata:
    get:
      operationId: getMarketMetadata
      summary: Get market metadata
      description: >
        Returns aggregated metadata for a market including trading volume,
        trade count, unique trader count, and liquidity.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: Market metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMetadataSnapshot'

  /api/v1/{conditionId}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Get the thumbnail image for a condition
      parameters:
        - $ref: '#/components/parameters/ConditionId'
      responses:
        '200':
          description: The thumbnail image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: No thumbnail for this condition

  /api/v1/markets/{marketId}/payment-requests:
    post:
      operationId: createPaymentRequest
      summary: Create a bolt11 payment request for a market
      description: >
        Creates a Lightning invoice via the market's dedicated LNBits wallet.
        The returned bolt11 string contains the payment hash and all details.
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequestRequest'
      responses:
        '200':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentRequestResponse'
        '404':
          description: Market not found or no wallet provisioned
        '502':
          description: LNBits backend error

  /api/v1/markets/{marketId}/simulate-payment:
    post:
      operationId: simulatePayment
      summary: Simulate paying a bolt11 invoice (dev-only)
      description: >
        Pays the given bolt11 invoice using the market's LNBits wallet admin key.
        Only works with LNBits FakeWallet backend (internal invoices only).
      x-dev-only: true
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePaymentRequest'
      responses:
        '200':
          description: Payment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatePaymentResponse'
        '404':
          description: Market not found or no wallet provisioned
        '502':
          description: LNBits backend error

  /api/v1/creators/{pubkey}/markets:
    get:
      operationId: listCreatorMarkets
      summary: List markets created by a given Nostr pubkey
      description: >
        Returns every market that was registered with the supplied pubkey in
        its `creatorPubkey` field, along with aggregated volume data so the
        creator dashboard can render totals without additional round-trips.
      parameters:
        - name: pubkey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: Nostr pubkey (hex) of the market creator.
      responses:
        '200':
          description: List of markets created by this pubkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorMarketsResponse'


components:
  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
      description: >
        The market to trade on, in the format "{conditionId}-{outcomeName}"
        (e.g. "deadbeef…abc-Alice"). Each outcome of a condition has its own
        independent binary order book. A marketId containing "|" is invalid.

    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: string
      description: >
        The condition identifier (hex string derived from the oracle announcement).

  schemas:
    Sats:
      type: integer
      format: int64
      minimum: 0
      description: A non-negative amount of satoshis.

    Probability:
      type: integer
      minimum: 1
      maximum: 99
      description: A probability price representing a percentage chance [1, 99].

    OrderSide:
      type: string
      enum:
        - Buy
        - Sell
      description: Direction of an order relative to the outcome token.

    OrderType:
      type: string
      enum:
        - Limit
        - Market
      description: Execution semantics of an order.

    TimeInForce:
      type: string
      enum:
        - GTC
        - FOK
        - FAK
      description: >
        Time-in-force policy. GTC = Good-Till-Cancel (rests on book),
        FOK = Fill-Or-Kill (reject if not fully filled),
        FAK = Fill-And-Kill (cancel remaining after partial fill).

    MatchPath:
      type: string
      enum:
        - Direct
        - Complementary
      description: How two orders were matched together.

    Fill:
      type: object
      required:
        - id
        - takerOrderId
        - makerOrderId
        - amountSats
        - executionPrice
        - path
        - filledAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique fill identifier.
        takerOrderId:
          type: string
          format: uuid
          description: The incoming (aggressor) order that triggered this fill.
        makerOrderId:
          type: string
          format: uuid
          description: The resting order that was matched against.
        amountSats:
          $ref: '#/components/schemas/Sats'
        executionPrice:
          $ref: '#/components/schemas/Probability'
        path:
          $ref: '#/components/schemas/MatchPath'
        filledAt:
          type: string
          format: date-time
          description: Timestamp when this fill was executed.

    SubmitOrderRequest:
      type: object
      required:
        - outcomeId
        - side
        - price
        - amountSats
        - userId
        - ephemeralPubkey
      properties:
        outcomeId:
          type: string
          description: The outcome to trade (e.g. "Alice", "YES").
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          $ref: '#/components/schemas/Probability'
        amountSats:
          $ref: '#/components/schemas/Sats'
        userId:
          type: string
          description: Opaque user identifier (e.g. Nostr pubkey hex).
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
          default: GTC
        ephemeralPubkey:
          type: string
          pattern: '^[0-9a-fA-F]{66}$'
          description: >
            Hex-encoded compressed secp256k1 pubkey (33 bytes, 66 hex chars)
            generated by the client per-order. Used by the matching engine to
            route the counterparty's encrypted atomic-swap messages back to
            this order's submitter. The corresponding private key stays on the
            client and is the only thing that can decrypt and sign swap
            payloads — the engine never sees it.

    OrderStatusResponse:
      type: object
      required:
        - orderId
        - marketId
        - status
        - remainingAmountSats
        - filledAmountSats
        - fills
      properties:
        orderId:
          type: string
          format: uuid
          description: The order's unique identifier.
        marketId:
          type: string
          description: The market this order belongs to.
        status:
          type: string
          description: >
            One of: "resting" (on book, unmatched), "partially_filled",
            "filled", "cancelled". The InMemoryMatchingEngine only ever
            returns "resting" — matching semantics live in the real engine.
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'
        filledAmountSats:
          $ref: '#/components/schemas/Sats'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: All fills produced against this order so far.

    SubmitOrderResponse:
      type: object
      required:
        - orderId
        - status
        - remainingAmountSats
        - fills
        - ephemeralPubkey
      properties:
        orderId:
          type: string
          format: uuid
          description: The unique identifier assigned to this order.
        status:
          type: string
          description: >
            One of: "filled", "partially_filled", "resting", "cancelled".
        remainingAmountSats:
          $ref: '#/components/schemas/Sats'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Fill'
          description: List of fills produced by this order. Empty if no matches.
        ephemeralPubkey:
          type: string
          pattern: '^[0-9a-fA-F]{66}$'
          description: >
            Echoes the ephemeralPubkey the client submitted. Lets clients
            confirm round-trip before they discard the corresponding privkey.

    LevelDto:
      type: object
      required:
        - price
        - amount
      properties:
        price:
          $ref: '#/components/schemas/Probability'
        amount:
          $ref: '#/components/schemas/Sats'
      description: A single price level in the order book depth.

    OrderBookSnapshot:
      type: object
      required:
        - marketId
        - bids
        - asks
      properties:
        marketId:
          type: string
          description: >
            The market ID in the format "{conditionId}-{outcomeName}".
        bids:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Buy-side levels sorted by price descending (best bid first).
        asks:
          type: array
          items:
            $ref: '#/components/schemas/LevelDto'
          description: Sell-side levels sorted by price ascending (best ask first).
        spread:
          oneOf:
            - type: integer
            - type: 'null'
          description: Difference between best ask and best bid. Null if either side is empty.

    CreateMarketOutcome:
      type: object
      required:
        - name
        - probability
      properties:
        name:
          type: string
          description: Outcome label (e.g. "Yes", "Alice").
        probability:
          type: integer
          minimum: 1
          maximum: 99
          description: Initial implied probability for this outcome [1, 99].

    CreateMarketRequest:
      type: object
      description: >
        JSON payload embedded in the multipart `metadata` field of the
        createMarket endpoint.
      required:
        - title
        - description
        - outcomes
      properties:
        title:
          type: string
          description: Human-readable market title.
        description:
          type: string
          description: Detailed market description.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/CreateMarketOutcome'
          minItems: 2
          description: The outcomes for the market (at least 2).
        liquiditySats:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Initial liquidity to seed across outcome CPMM pools (in sats).
        categoryTags:
          type: array
          items:
            type: string
          description: Optional category tags for the market.
        creatorPubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Optional Nostr pubkey (hex) of the account that created this market.
            When supplied, the market is indexed under this creator so it can be
            queried via the `listCreatorMarkets` endpoint. Self-declared; the
            engine performs no signature verification in v1.

    CreateMarketResponse:
      type: object
      required:
        - conditionId
        - marketsCreated
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered for.
        marketsCreated:
          type: array
          items:
            type: string
          description: >
            List of per-outcome market IDs created
            (format: "{conditionId}-{outcomeName}").
        thumbnailUrl:
          oneOf:
            - type: string
            - type: 'null'
          description: URL to the uploaded thumbnail, or null if none was provided.

    LiquidityStateResponse:
      type: object
      required:
        - marketId
        - reserveA
        - reserveB
        - impliedProbability
        - totalLiquiditySats
        - activeOrders
      properties:
        marketId:
          type: string
        reserveA:
          type: integer
          format: int64
        reserveB:
          type: integer
          format: int64
        impliedProbability:
          type: integer
          minimum: 1
          maximum: 99
        totalLiquiditySats:
          type: integer
          format: int64
        activeOrders:
          type: integer
          description: Number of active CPMM orders on the CLOB.

    MarketMetadataSnapshot:
      type: object
      required:
        - marketId
        - totalVolumeSats
        - totalTrades
        - uniqueTraderCount
        - totalLiquiditySats
      properties:
        marketId:
          type: string
          description: The market ID.
        totalVolumeSats:
          type: integer
          format: int64
          description: Total trading volume in satoshis across all fills.
        totalTrades:
          type: integer
          description: Total number of fills (trades) executed.
        uniqueTraderCount:
          type: integer
          description: Number of unique user IDs that have submitted orders.
        totalLiquiditySats:
          type: integer
          format: int64
          description: Total CPMM liquidity deposited in satoshis.

    CreatePaymentRequestRequest:
      type: object
      required:
        - amountSats
      properties:
        amountSats:
          $ref: '#/components/schemas/Sats'
        description:
          type: string
          description: Optional memo for the invoice.

    CreatePaymentRequestResponse:
      type: object
      required:
        - bolt11
      properties:
        bolt11:
          type: string
          description: The bolt11-encoded Lightning invoice.

    SimulatePaymentRequest:
      type: object
      required:
        - bolt11
      properties:
        bolt11:
          type: string
          description: The bolt11 invoice to pay.

    SimulatePaymentResponse:
      type: object
      required:
        - paid
      properties:
        paid:
          type: boolean
          description: Whether the payment was successful.

    CreatorMarketEntry:
      type: object
      required:
        - conditionId
        - totalVolumeSats
        - createdAt
      properties:
        conditionId:
          type: string
          description: The condition ID this market was registered under.
        totalVolumeSats:
          type: integer
          format: int64
          minimum: 0
          description: >
            Aggregated trading volume in satoshis across every per-outcome
            market belonging to this condition.
        createdAt:
          type: string
          format: date-time
          description: When this market was registered with the matching engine.

    CreatorMarketsResponse:
      type: object
      required:
        - pubkey
        - markets
      properties:
        pubkey:
          type: string
          description: The creator pubkey this response belongs to (echoed from the path).
        markets:
          type: array
          items:
            $ref: '#/components/schemas/CreatorMarketEntry'
          description: >
            Markets created by this pubkey. May be empty if the creator has
            not registered any markets yet.

