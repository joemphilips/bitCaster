name: Release CLI

# Each push to main (a merged PR) publishes one bitcaster-cli release. Push
# runs do not cancel or replace each other. Only a run for the current head of
# main marks its release as latest, so a re-run of an older run cannot.
# A pull request that changes the CLI build runs the build jobs only, so the
# archives are checked before the merge. Only the attest job can sign, and
# only the publish job can write repository contents.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release-cli.yml
      - scripts/package-cli-release.mjs
      - scripts/tests/package-cli-release.test.mjs
      - scripts/build-native-oracle-helper.mjs
      - scripts/rewrite-dts-imports.mjs
      - bitcaster-cli/**
      - bitcaster-daemon/**
      - bitcaster-client-sdk/**
      - cashu-ts
      - dlcdevkit
      - package.json
      - package-lock.json
      - patches/**
  workflow_dispatch:

permissions: {}

# A newer pull request run cancels the older run of the same pull request.
# Every other run has its own group, so GitHub never cancels a pending main run.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('release-cli-pr-{0}', github.ref)
    || format('release-cli-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.repository == 'joemphilips/bitCaster'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The build needs only these two public submodules. The dlcdevkit URL uses
      # SSH, so read it over HTTPS without credentials.
      - name: Check out the cashu-ts and dlcdevkit submodules
        run: >-
          git -c url.https://github.com/.insteadOf=git@github.com:
          submodule update --init --depth 1 cashu-ts dlcdevkit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A release build does not restore a cache that another run wrote.
          package-manager-cache: false
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # The Linux oracle helper is a static musl binary, so it runs with any
      # glibc version that Node.js supports.
      - name: Install the musl target and C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-unknown-linux-musl
      - run: npm ci --ignore-scripts
      - run: npm run patch:dependencies
      - name: Test the packaging rules
        run: node --test scripts/tests/package-cli-release.test.mjs
      - name: Package and check the CLI archive
        run: node scripts/package-cli-release.mjs --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitcaster-cli-${{ matrix.target }}
          path: |
            release/bitcaster-cli-${{ matrix.target }}.tar.gz
            release/bitcaster-cli-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest the build provenance
    needs: build
    if: >-
      github.repository == 'joemphilips/bitCaster' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The OIDC token signs the attestation. This job cannot write repository contents.
    permissions:
      id-token: write
      attestations: write
    # This job runs no repository code.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bitcaster-cli-*
          path: release
          merge-multiple: true
      - name: Verify the checksums
        working-directory: release
        run: |
          set -euo pipefail
          for checksum in *.tar.gz.sha256; do
            sha256sum --check --strict "$checksum"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/bitcaster-cli-*.tar.gz

  publish:
    name: Publish the release
    needs: [build, attest]
    if: >-
      github.repository == 'joemphilips/bitCaster' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # This job runs no repository code. It checks the archives and creates the release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bitcaster-cli-*
          path: release
          merge-multiple: true
      - name: Verify the checksums and write SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          for checksum in *.tar.gz.sha256; do
            sha256sum --check --strict "$checksum"
          done
          cat *.tar.gz.sha256 > SHA256SUMS
          rm *.tar.gz.sha256
          cat SHA256SUMS
      - name: Read the CLI version and source commit from the archives
        id: version
        working-directory: release
        run: |
          set -euo pipefail
          version=''
          for archive in bitcaster-cli-*.tar.gz; do
            name="${archive%.tar.gz}"
            cli="$name/node_modules/@bitcaster-market/cli"
            commit="$(tar -xzOf "$archive" "$cli/build-info.json" | jq -r .commit)"
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "$archive was not built from $GITHUB_SHA" >&2
              exit 1
            fi
            found="$(tar -xzOf "$archive" "$cli/package.json" | jq -r .version)"
            if [[ ! "$found" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "$archive has an invalid CLI version" >&2
              exit 1
            fi
            if [[ -n "$version" && "$found" != "$version" ]]; then
              echo "the archives contain different CLI versions" >&2
              exit 1
            fi
            version="$found"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="cli-v${VERSION}-${GITHUB_SHA:0:12}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > notes.md <<'NOTES'
          bitcaster-cli @VERSION@, built from commit @COMMIT@.

          You need Node.js 22.15 or later. The archives are for Linux on x64 and for macOS on Apple silicon. Windows is not supported.

          ## Install on Linux (x64)

          ```sh
          curl -fLO @BASE@/bitcaster-cli-linux-x64.tar.gz &&
            curl -fLO @BASE@/SHA256SUMS &&
            grep ' bitcaster-cli-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c - &&
            tar -xzf bitcaster-cli-linux-x64.tar.gz &&
            ./bitcaster-cli-linux-x64/bin/bitcaster-cli --help
          ```

          ## Install on macOS (Apple silicon)

          ```sh
          curl -fLO @BASE@/bitcaster-cli-darwin-arm64.tar.gz &&
            curl -fLO @BASE@/SHA256SUMS &&
            grep ' bitcaster-cli-darwin-arm64.tar.gz$' SHA256SUMS | shasum -a 256 -c - &&
            tar -xzf bitcaster-cli-darwin-arm64.tar.gz &&
            ./bitcaster-cli-darwin-arm64/bin/bitcaster-cli --help
          ```

          The commands stop at the first failed step. If the checksum check fails, download both files again.

          Optionally, check with the GitHub CLI that the release workflow on the main branch built the archive. Use the name of the archive that you downloaded:

          ```sh
          gh attestation verify bitcaster-cli-linux-x64.tar.gz --repo joemphilips/bitCaster \
            --cert-identity https://github.com/joemphilips/bitCaster/.github/workflows/release-cli.yml@refs/heads/main \
            --deny-self-hosted-runners
          ```

          `bitcaster-cli --version` prints `@VERSION@+@SHORT@`.
          To run `bitcaster-cli` from any directory, add the `bin` directory to `PATH`.
          Then read the [CLI guide](https://bitcasterdoc.com/user-guide/getting-started/ai-trading/).
          NOTES
          # The values are a checked version, a tag made from it, and the commit SHA.
          sed -i -e "s|@VERSION@|${VERSION}|g" -e "s|@COMMIT@|${GITHUB_SHA}|g" \
            -e "s|@SHORT@|${GITHUB_SHA:0:12}|g" -e "s|@BASE@|${base}|g" notes.md
          # Only a release of the current head of main becomes latest. A re-run of
          # an older run, or a run that a newer merge overtook, keeps the newer release.
          head="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)"
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not read the head of main" >&2
            exit 1
          fi
          latest=false
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            latest=true
          fi
          echo "head of main: $head; latest: $latest"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "bitcaster-cli ${VERSION} (${GITHUB_SHA:0:12})" \
            --notes-file notes.md \
            --latest="$latest" \
            release/bitcaster-cli-*.tar.gz release/SHA256SUMS
