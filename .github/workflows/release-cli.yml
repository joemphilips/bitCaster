name: Release CLI

# Each push to main (a merged PR) publishes one bitcaster-cli release.
# A pull request that changes the CLI build runs the build jobs only, so the
# archives are checked before the merge. Only the publish job can write.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release-cli.yml
      - scripts/package-cli-release.mjs
      - scripts/build-native-oracle-helper.mjs
      - bitcaster-cli/**
      - bitcaster-daemon/**
      - bitcaster-client-sdk/**
      - cashu-ts
      - dlcdevkit
      - package.json
      - package-lock.json
      - patches/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cli-${{ github.ref }}
  # Do not cancel a release in progress. A newer pull request run replaces an older one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.repository == 'joemphilips/bitCaster'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The build needs only these two public submodules. The dlcdevkit URL uses
      # SSH, so read it over HTTPS without credentials.
      - name: Check out the cashu-ts and dlcdevkit submodules
        run: >-
          git -c url.https://github.com/.insteadOf=git@github.com:
          submodule update --init --depth 1 cashu-ts dlcdevkit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          # A release build does not restore a cache that another run wrote.
          package-manager-cache: false
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: npm ci --ignore-scripts
      - run: npm run patch:dependencies
      - name: Test the packaging rules
        run: node --test scripts/tests/package-cli-release.test.mjs
      - name: Package and check the CLI archive
        run: node scripts/package-cli-release.mjs --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitcaster-cli-${{ matrix.target }}
          path: |
            release/bitcaster-cli-${{ matrix.target }}.tar.gz
            release/bitcaster-cli-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    if: >-
      github.repository == 'joemphilips/bitCaster' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # This job runs no repository code. It checks the archives and creates the release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bitcaster-cli-*
          path: release
          merge-multiple: true
      - name: Verify the checksums and write SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          for checksum in *.tar.gz.sha256; do
            sha256sum --check --strict "$checksum"
          done
          cat *.tar.gz.sha256 > SHA256SUMS
          rm *.tar.gz.sha256
          cat SHA256SUMS
      - name: Read the CLI version from the archives
        id: version
        working-directory: release
        run: |
          set -euo pipefail
          version=''
          for archive in bitcaster-cli-*.tar.gz; do
            name="${archive%.tar.gz}"
            found="$(tar -xzOf "$archive" "$name/node_modules/@bitcaster-market/cli/package.json" | jq -r .version)"
            if [[ ! "$found" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "$archive has an invalid CLI version" >&2
              exit 1
            fi
            if [[ -n "$version" && "$found" != "$version" ]]; then
              echo "the archives contain different CLI versions" >&2
              exit 1
            fi
            version="$found"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="cli-v${VERSION}-${GITHUB_SHA:0:12}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cat > notes.md <<'NOTES'
          bitcaster-cli @VERSION@, built from commit @COMMIT@.

          You need Node.js 22.15 or later. The archives are for Linux on x64 and for macOS on Apple silicon. Windows is not supported.

          ## Install on Linux (x64)

          ```sh
          curl -fLO @BASE@/bitcaster-cli-linux-x64.tar.gz
          curl -fLO @BASE@/SHA256SUMS
          grep ' bitcaster-cli-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c -
          tar -xzf bitcaster-cli-linux-x64.tar.gz
          ./bitcaster-cli-linux-x64/bin/bitcaster-cli --help
          ```

          ## Install on macOS (Apple silicon)

          ```sh
          curl -fLO @BASE@/bitcaster-cli-darwin-arm64.tar.gz
          curl -fLO @BASE@/SHA256SUMS
          grep ' bitcaster-cli-darwin-arm64.tar.gz$' SHA256SUMS | shasum -a 256 -c -
          tar -xzf bitcaster-cli-darwin-arm64.tar.gz
          ./bitcaster-cli-darwin-arm64/bin/bitcaster-cli --help
          ```

          To run `bitcaster-cli` from any directory, add the `bin` directory to `PATH`.
          Then read the [CLI guide](https://bitcasterdoc.com/user-guide/getting-started/ai-trading/).
          NOTES
          # The values are a checked version, a tag made from it, and the commit SHA.
          sed -i -e "s|@VERSION@|${VERSION}|g" -e "s|@COMMIT@|${GITHUB_SHA}|g" \
            -e "s|@BASE@|${base}|g" notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "bitcaster-cli ${VERSION} (${GITHUB_SHA:0:12})" \
            --notes-file notes.md \
            --latest \
            release/bitcaster-cli-*.tar.gz release/SHA256SUMS
