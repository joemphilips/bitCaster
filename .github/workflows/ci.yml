name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet build BitCaster.MatchingEngine.Contracts/
      - run: dotnet build BitCaster.InMemoryMatchingEngine/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bitCaster-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:enum-discipline
      - run: npm run build
      - run: npm run test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd bitCaster-doc && npm ci && npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [dotnet-build, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check if CDK has changes
        id: cdk-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE"..HEAD -- cdk/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if cashu.me has changes
        id: cashu-me-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE"..HEAD -- cashu.me/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mintd image (CDK changed)
        if: steps.cdk-check.outputs.changed == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build mintd

      - name: Build cashu-me image (cashu.me changed)
        if: steps.cashu-me-check.outputs.changed == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build cashu-me

      # Start dependency services via Docker.
      # Server and frontend run natively to match the local dev workflow.
      # lnbits-init pulls in lnbits via depends_on and runs first_install so /api/v1/health returns 200.
      - name: Start mint and interop services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d mintd seed cashu-me nostr-relay lnbits-init

      - name: Wait for mint
        run: |
          echo "Waiting for mint..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/v1/info && exit 0
            sleep 5
          done
          echo "Mint not ready"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Wait for cashu.me
        run: |
          echo "Waiting for cashu.me..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && exit 0
            sleep 2
          done
          echo "cashu.me not ready"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs cashu-me
          exit 1

      - name: Wait for nostr-relay
        run: |
          echo "Waiting for nostr-relay..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:7777 && exit 0
            sleep 2
          done
          echo "nostr-relay not ready"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs nostr-relay
          exit 1

      - name: Wait for lnbits
        run: |
          echo "Waiting for lnbits (post first_install)..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5002/api/v1/health && exit 0
            sleep 2
          done
          echo "lnbits not ready"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs lnbits lnbits-init
          exit 1

      - name: Start server
        run: |
          dotnet tool restore
          dotnet run --project BitCaster.InMemoryMatchingEngine/ &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 2
          done
          echo "Server not ready"
          exit 1

      - name: Start frontend
        run: |
          cd bitCaster-app && npm ci && npx vite --host &
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && exit 0
            sleep 2
          done
          echo "Frontend not ready"
          exit 1

      - name: Build E2E tests and install Playwright
        run: |
          dotnet build tests/E2E/
          pwsh tests/E2E/bin/Debug/*/playwright.ps1 install chromium

      - name: Run E2E tests
        run: dotnet test tests/E2E/ --no-build -- RunConfiguration.MaxCpuCount=$(($(nproc) - 1))

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs mintd cashu-me nostr-relay lnbits lnbits-init
