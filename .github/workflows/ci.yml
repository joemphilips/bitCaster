name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x

jobs:
  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check new secret candidates
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_HEAD: ${{ github.sha }}
        run: >-
          python3 tools/security-audit/incremental_secrets.py
          --repo . --event-name "$SCAN_EVENT" --event-path "$GITHUB_EVENT_PATH"
          --head "$SCAN_HEAD"

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run patch:dependencies
      - run: npm run format:check

  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet build BitCaster.MatchingEngine.Contracts/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bitCaster-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run patch:dependencies
        working-directory: .
      - name: Check kormir-wasm provenance
        working-directory: .
        run: bash tools/check-kormir-wasm-provenance.sh
      - name: Build SDK exports for cross-client tests
        working-directory: .
        run: npm run build --workspace @bitcaster-market/client-sdk
      - run: npm run typecheck
      - run: npm run lint:enum-discipline
      - run: npm run lint:identity-ops
      - run: npm run lint:wallet-ops
      - run: npm run build
      - run: npm run test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cd bitCaster-doc && npm ci && npm run build
