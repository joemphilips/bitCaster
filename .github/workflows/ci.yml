name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x

jobs:
  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check new secret candidates
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_HEAD: ${{ github.sha }}
        run: >-
          python3 tools/security-audit/incremental_secrets.py
          --repo . --event-name "$SCAN_EVENT" --event-path "$GITHUB_EVENT_PATH"
          --head "$SCAN_HEAD"
          --reviewed-findings tools/security-audit/reviewed-secret-findings.json

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run patch:dependencies
      - run: npm run format:check

  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet build BitCaster.MatchingEngine.Contracts/
      - name: Test the public contracts
        run: dotnet test BitCaster.MatchingEngine.Contracts.Tests/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bitCaster-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install boundary-check prerequisite
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run patch:dependencies
        working-directory: .
      - name: Check kormir-wasm provenance
        working-directory: .
        run: bash tools/check-kormir-wasm-provenance.sh
      - name: Build SDK exports for cross-client tests
        working-directory: .
        run: npm run build --workspace @bitcaster-market/client-sdk
      - name: Test the SDK
        working-directory: .
        run: npm test --workspace @bitcaster-market/client-sdk
      - run: npm run typecheck
      - run: npm run lint:enum-discipline
      - run: npm run lint:identity-ops
      - run: npm run lint:wallet-ops
      - run: npm run build
      - run: npm run test
      - run: npm run test:server

  # The app browser tests run in Chromium with the committed kormir WASM core.
  # vitest.chart.config.ts does not run here: it is a renderer measurement, not a gate.
  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bitCaster-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run patch:dependencies
        working-directory: .
      - name: Install Chromium for the browser tests
        working-directory: .
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:chart-geometry
      - run: npm run test:browser:shell

  scripts-daemon-and-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep this pin equal to the pin in release-cli.yml.
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # ripgrep runs the boundary checks. musl-tools builds the static oracle helper.
      - name: Install the apt prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends ripgrep musl-tools
      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install the musl target
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-unknown-linux-musl
      # The daemon tests use the oracle helper that the CLI release ships: a
      # static musl binary.
      - name: Build the native oracle helper
        run: node scripts/build-native-oracle-helper.mjs --target x86_64-unknown-linux-musl
      - run: npm ci --ignore-scripts
      - run: npm run patch:dependencies
      # The Playwright launch test starts full Chromium and reads its sandbox state.
      - name: Install Chromium for the Playwright launch test
        run: npx playwright install --with-deps chromium
      - name: Test the scripts
        run: node --test scripts/tests/*.test.mjs
      # The daemon build builds the SDK first. Some daemon tests load the built
      # daemon package, as the CLI does.
      - name: Build the SDK and daemon packages
        run: npm run build --workspace @bitcaster-market/daemon
      # Without this path, the real-helper tests skip.
      - name: Test the daemon
        env:
          BITCASTER_TEST_NATIVE_ORACLE_HELPER: ${{ github.workspace }}/bitcaster-daemon/native/linux-x64/bitcaster-oracle-helper
        run: npm test --workspace @bitcaster-market/daemon
      - name: Test the CLI
        run: npm test --workspace @bitcaster-market/cli

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: cd bitCaster-doc && npm ci && npm run build
