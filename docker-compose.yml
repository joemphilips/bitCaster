services:
  mintd:
    build: ./cdk
    ports:
      - "8085:8085"
    environment:
      CDK_MINTD_URL: "http://localhost:8085"
      CDK_MINTD_LN_BACKEND: fakewallet
      CDK_MINTD_LISTEN_HOST: "0.0.0.0"
      CDK_MINTD_LISTEN_PORT: "8085"
      CDK_MINTD_DATABASE: sqlite
      CDK_MINTD_CACHE_BACKEND: memory
      CDK_MINTD_INPUT_FEE_PPK: "1"
      CDK_MINTD_CTF_DEFAULT_KEYSET_CREATION: "one-vs-rest"
      CDK_MINTD_MNEMONIC: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  seed:
    build:
      context: .
      dockerfile: tools/seed-conditions/Dockerfile
    environment:
      MINT_URL: "http://mintd:8085"
    depends_on:
      mintd:
        condition: service_healthy

  lnbits:
    image: lnbitsdocker/lnbits:latest
    ports:
      - "5102:5000"
    environment:
      LNBITS_ADMIN_UI: "true"
      LNBITS_BACKEND_WALLET_CLASS: FakeWallet
      FAKE_WALLET_SECRET: "serversecret"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 5s
      timeout: 5s
      retries: 30

  lnbits-init:
    image: curlimages/curl:latest
    depends_on:
      lnbits:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "body=$$(mktemp); code=$$(curl -sS -o \"$$body\" -w '%{http_code}' -X PUT http://lnbits:5000/api/v1/auth/first_install -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"adminpass\",\"password_repeat\":\"adminpass\"}'); if [ \"$$code\" -ge 200 ] && [ \"$$code\" -lt 300 ]; then exit 0; fi; if [ \"$$code\" = 401 ] && grep -q 'not your first install' \"$$body\"; then exit 0; fi; cat \"$$body\"; exit 22",
      ]

  server:
    build:
      context: .
      dockerfile: BitCaster.InMemoryMatchingEngine/Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      MINT_URL: "http://mintd:8085"
      LNBITS_URL: "http://lnbits:5000"
    depends_on:
      mintd:
        condition: service_healthy
      lnbits-init:
        condition: service_completed_successfully

  cashu-me:
    build: ./cashu.me
    ports:
      - "3000:80"
    depends_on:
      mintd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nostr-relay:
    image: scsibug/nostr-rs-relay
    ports:
      - "7777:8080"
    environment:
      RUST_LOG: info
