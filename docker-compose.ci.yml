services:
  mintd-setup:
    image: ${MINT_IMAGE:?Set MINT_IMAGE to the reviewed immutable mint image}
    build: !reset null
  mintd:
    image: ${MINT_IMAGE:?Set MINT_IMAGE to the reviewed immutable mint image}
    build: !reset null
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  cashu-me:
    image: joemphilips/cashu-me
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
