[package]
name = "bitcaster-oracle-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bitcaster-oracle-helper"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
ddk-messages = { path = "../../dlcdevkit/dlc-messages", features = ["std", "use-serde"] }
hex = "0.4.3"
kormir = { path = "../../dlcdevkit/kormir", features = ["nostr"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.41.1", default-features = false, features = ["rt"] }
